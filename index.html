<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kodo">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="kodo-list-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="kodo-list-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="kodo-list-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<title>Kodo</title>
<style>
  /* กฎสี 60-30-10: 60% พื้นหลังตามช่วงเวลา · 30% พื้นผิวการ์ด/เมนู · 10% สี accent (indigo) */
  :root, :root[data-theme="day"] {
    /* กลางวัน: พื้นเทาอมฟ้าอ่อนสะอาดๆ การ์ดขาว hero สี indigo เข้ม (แบบ reference) */
    --bg: #f3f4f9; --fg: #15172b; --card: #ffffff; --border: #e5e7f0; --edge: transparent;
    --muted: #676c86; --primary: #6366f1; --primary-dark: #4f46e5;
    --primary-soft: #eceefe;
    --hero: #6366f1; --hero-2: #7c6cf5; --hero-fg: #ffffff;
    --danger: #ef4444; --danger-text: #c2410c; --success: #059669;
    --switch-on: #0f8a3d;
    --shadow: 0 1px 2px rgba(21, 23, 43, .04), 0 8px 24px -16px rgba(21, 23, 43, .16);
    --r-lg: 1.5rem; --r-md: 1.15rem; --r-sm: .8rem;
  }
  :root[data-theme="night"] {
    /* กลางคืน: น้ำเงินเข้ม การ์ดมีขอบบางๆ แทนเงา */
    --bg: #0e1020; --fg: #eef0fb; --card: #181b30; --border: #2a2e4a; --edge: var(--border);
    --muted: #a3a8c6; --primary: #818cf8; --primary-dark: #6366f1;
    --primary-soft: #272b52;
    --hero: #4338ca; --hero-2: #5b4bd6; --hero-fg: #ffffff;
    --danger: #ef4444; --danger-text: #fca5a5; --success: #34d399;
    --switch-on: #34c759;
    --shadow: none;
    --r-lg: 1.5rem; --r-md: 1.15rem; --r-sm: .8rem;
  }
  html { transition: background .4s ease-out; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ---- motion: สื่อสถานะ ไม่ตกแต่งเกิน (150-250ms, ease-out) ---- */
  #view.anim > * { animation: viewIn .2s cubic-bezier(.22, 1, .36, 1) both; }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .just-done .task-status, .just-done .mini-dot { animation: checkPop .26s cubic-bezier(.22, 1, .36, 1); }
  @keyframes checkPop {
    0% { transform: scale(.6); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .task.just-done { animation: cardSettle .25s cubic-bezier(.22, 1, .36, 1); }
  @keyframes cardSettle {
    0% { transform: scale(.985); }
    100% { transform: scale(1); }
  }
  .overlay { animation: overlayIn .18s ease-out both; }
  @keyframes overlayIn { from { background: rgba(0,0,0,0); } to { background: rgba(0,0,0,.45); } }
  .sheet { animation: sheetUp .24s cubic-bezier(.22, 1, .36, 1) both; }
  @keyframes sheetUp {
    from { opacity: .4; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fab { transition: transform .15s cubic-bezier(.22, 1, .36, 1), background .15s; }
  .fab:active { transform: scale(.9); }
  .nav-btn .ico { transition: transform .15s cubic-bezier(.22, 1, .36, 1); }
  .nav-btn.active .ico { transform: translateY(-1px) scale(1.08); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg); min-height: 100dvh; font-weight: 500;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 28rem; margin: 0 auto; padding-bottom: 6.5rem; }
  .page { padding: 1rem; }
  h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 1rem; text-wrap: balance; }
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .page-head h1 { margin-bottom: 0; }
  h2.section-title, .section-title {
    font-size: 1.02rem; font-weight: 800; letter-spacing: -.01em;
    color: var(--fg); margin: 1.5rem 0 .65rem;
  }
  .empty { text-align: center; color: var(--muted); font-size: .875rem; margin-top: 4rem; }
  .cat-head { display: flex; align-items: center; gap: .4rem; }
  .cat-head .cat-dot { width: .6rem; height: .6rem; }

  /* home overview */
  .today-date { font-size: .8rem; color: var(--muted); margin: -0.75rem 0 1rem; }
  .ov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; align-items: start; }
  /* จอมือถือ: การ์ด 2 คอลัมน์แคบเกินไป (วงแหวน+ปุ่มลูกศรกินที่จนชื่อเหลือไม่กี่สิบพิกเซล) -> คอลัมน์เดียว */
  @media (max-width: 29.99rem) { .ov-grid { grid-template-columns: 1fr; } }
  .ov-card {
    background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md);
    padding: .9rem; display: flex; flex-direction: column; gap: .55rem;
    color: var(--fg); position: relative; box-shadow: var(--shadow); min-width: 0;
  }
  .ov-head { display: flex; align-items: center; gap: .55rem; font-size: .86rem; font-weight: 700; min-width: 0; }
  /* ชื่อหมวดขึ้นบรรทัดใหม่ได้ (ไม่ตัดเป็น "AI W...") แต่ไม่หั่นกลางคำ นอกจากคำนั้นยาวเกินจริงๆ */
  .ov-head .name { flex: 1; min-width: 0; overflow-wrap: break-word; line-height: 1.25; }
  .cat-ico {
    flex-shrink: 0; width: 2rem; height: 2rem; border-radius: .65rem;
    display: flex; align-items: center; justify-content: center;
  }
  /* วงแหวน progress รอบไอคอนหมวด (แบบ reference Habitual) */
  .cat-ring { position: relative; flex-shrink: 0; width: 2.6rem; height: 2.6rem; display: flex; align-items: center; justify-content: center; }
  .cat-ring svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .cat-ring svg.ring circle { fill: none; stroke-width: 3; }
  .cat-ring svg.ring .ring-track { stroke: var(--border); }
  .cat-ring svg.ring .ring-fill { stroke-linecap: round; transition: stroke-dashoffset .45s cubic-bezier(.22, 1, .36, 1); }
  .cat-ring .cat-ico { width: 1.7rem; height: 1.7rem; border-radius: 50%; }
  .ov-more {
    flex-shrink: 0; background: none; border: none; color: var(--muted); cursor: pointer;
    width: 2.75rem; height: 2.75rem; margin: -.65rem -.65rem -.65rem 0;
    display: flex; align-items: center; justify-content: center; border-radius: .4rem;
  }
  .ov-sub { font-size: .68rem; color: var(--muted); }
  .ov-sub .ov-overdue { color: var(--danger-text); font-weight: 600; }
  .ov-bar { display: block; height: .3rem; background: var(--border); border-radius: 999px; overflow: hidden; }
  .ov-bar span { display: block; height: 100%; border-radius: 999px; }
  .ov-done-all { color: var(--success); font-weight: 600; }
  .mini-list { display: flex; flex-direction: column; }
  .mini-task {
    display: flex; align-items: flex-start; gap: .5rem;
    padding: .38rem 0; background: none; border: none; text-align: left; width: 100%;
    font-family: inherit; font-size: .8rem; font-weight: 600; color: var(--fg); cursor: pointer;
  }
  .mini-task:active { opacity: .6; }
  .mini-dot {
    flex-shrink: 0; width: .95rem; height: .95rem; margin-top: .05rem;
    border: 1.5px solid var(--muted); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: .55rem;
  }
  .mini-task.done .mini-dot { background: var(--success); border-color: var(--success); }
  .mini-task.done .mini-title { text-decoration: line-through; opacity: .55; }
  .mini-title { min-width: 0; line-height: 1.3; }
  .mini-time { display: block; font-size: .62rem; color: var(--muted); font-weight: 400; }
  .mini-time.overdue { color: var(--danger-text); font-weight: 600; }
  .mini-empty { font-size: .68rem; color: var(--muted); padding: .2rem 0; }

  /* iOS-style switch */
  .switch {
    flex-shrink: 0; width: 2.85rem; height: 1.7rem; border-radius: 999px; border: none;
    background: color-mix(in srgb, var(--fg) 42%, var(--border)); cursor: pointer; position: relative;
    transition: background .2s ease-out; padding: 0;
  }
  /* ขยายพื้นที่กดให้ถึง 44px โดยไม่เปลี่ยนขนาดที่เห็น */
  .switch::before { content: ""; position: absolute; inset: -.55rem; }
  .switch::after {
    content: ""; position: absolute; top: .15rem; left: .15rem;
    width: 1.4rem; height: 1.4rem; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
    transition: transform .2s cubic-bezier(.22, 1, .36, 1);
  }
  .switch[aria-checked="true"] { background: var(--switch-on); }
  .switch[aria-checked="true"]::after { transform: translateX(1.15rem); }

  /* featured "Now" card + schedule editor */
  .ov-card.featured {
    grid-column: 1 / -1; border-width: 1.5px;
    box-shadow: 0 6px 20px -8px rgba(0, 0, 0, .25);
  }
  .now-badge {
    flex-shrink: 0; color: #fff; font-size: .62rem; font-weight: 700;
    padding: .15rem .5rem; border-radius: 999px; letter-spacing: .02em;
  }
  .day-pills { display: flex; gap: .35rem; }
  .day-pill {
    flex: 1; aspect-ratio: 1; max-width: 2.6rem; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--card); color: var(--muted);
    font-family: inherit; font-size: .8rem; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s cubic-bezier(.22, 1, .36, 1);
  }
  .day-pill:active { transform: scale(.9); }
  .day-pill.sel { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* ---- Home hero: แถบสี indigo เต็มความกว้าง + แผ่นเนื้อหาโค้งซ้อนขึ้นมา (แบบ reference) ---- */
  .hero {
    margin: -1rem -1rem 0; padding: calc(1.1rem + env(safe-area-inset-top)) 1.25rem 3.4rem;
    background: linear-gradient(160deg, var(--hero) 0%, var(--hero-2) 100%);
    color: var(--hero-fg); position: relative; overflow: hidden;
  }
  .hero::before { /* วงกลมจางๆ มุมขวาบน ให้มีมิติแบบ reference */
    content: ""; position: absolute; top: -7rem; right: -5rem; width: 16rem; height: 16rem;
    border-radius: 50%; background: rgba(255, 255, 255, .08);
  }
  .hero > * { position: relative; }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1.1rem; }
  .hero-date { display: flex; align-items: center; gap: .4rem; font-size: .8rem; font-weight: 700; color: rgba(255, 255, 255, .78); }
  .hero-actions { display: flex; align-items: center; gap: .5rem; }
  .hero-streak, .hero-pet {
    display: inline-flex; align-items: center; justify-content: center; gap: .3rem;
    background: rgba(255, 255, 255, .18); color: var(--hero-fg); border: none; cursor: pointer;
    font: inherit; font-weight: 800; font-size: .82rem; border-radius: 999px; min-height: 2.5rem;
    backdrop-filter: blur(6px); transition: background .15s ease-out, transform .15s cubic-bezier(.22, 1, .36, 1);
  }
  .hero-streak { padding: 0 .8rem 0 .6rem; }
  .hero-streak:active, .hero-pet:active { transform: scale(.94); }
  .hero-pet { width: 2.5rem; padding: .2rem; line-height: 0; background: var(--card); }
  .hero-pet svg { width: 100%; height: 100%; overflow: visible; }
  .hero-pet.bounce { animation: petBounce .9s cubic-bezier(.22, 1.4, .36, 1); }
  .hero-title {
    font-size: 1.75rem; font-weight: 800; letter-spacing: -.025em; line-height: 1.15;
    margin: 0 0 1.25rem; color: var(--hero-fg); text-wrap: balance;
  }
  .hero-title b { font-weight: 800; }
  .hero-title .soft { font-weight: 600; color: rgba(255, 255, 255, .8); }
  /* 7 วัน check-in เป็นวงกลมใหญ่ (แบบ Habitual) */
  .hero-week { display: flex; justify-content: space-between; gap: .3rem; }
  .hw-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .4rem; }
  .hw-dow { font-size: .68rem; font-weight: 800; color: rgba(255, 255, 255, .72); letter-spacing: .04em; }
  .hw-circle {
    width: 2.35rem; height: 2.35rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .16); color: transparent; font-size: .95rem; font-weight: 800;
    transition: transform .2s cubic-bezier(.22, 1, .36, 1);
  }
  .hw-day.in .hw-circle { background: var(--card); color: var(--primary); }
  .hw-day.today .hw-circle { box-shadow: 0 0 0 2px var(--hero-fg); }
  .hw-day.today:not(.in) .hw-circle { background: rgba(255, 255, 255, .28); }
  .hw-day.future .hw-circle { background: rgba(255, 255, 255, .09); }
  .hw-num { font-size: .66rem; font-weight: 700; color: rgba(255, 255, 255, .6); }
  .hw-day.today .hw-num { color: var(--hero-fg); }
  /* แผ่นเนื้อหาโค้งซ้อนทับ hero */
  .sheet-body {
    position: relative; margin: -1.9rem -1rem 0; padding: 1.1rem 1rem 0;
    background: var(--bg); border-radius: var(--r-lg) var(--r-lg) 0 0;
  }
  .sheet-body .section-title:first-of-type { margin-top: 1.1rem; }
  .pp-streak { display: flex; flex-direction: column; gap: .45rem; }
  .pet-week {
    flex-basis: 100%; display: flex; gap: .3rem; justify-content: space-between;
    border-top: 1px solid var(--border); padding-top: .6rem; margin-top: .1rem;
  }
  .pw-cell {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: .15rem;
    border-radius: .5rem; padding: .25rem 0;
  }
  .pw-cell.today { background: var(--primary-soft); }
  .pw-dow { font-size: .62rem; font-weight: 700; color: var(--muted); }
  .pw-dot {
    width: 1.35rem; height: 1.35rem; line-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .pw-dot svg { filter: none; }
  .pw-dot.in svg { filter: drop-shadow(0 1px 3px rgba(255, 100, 20, .45)); }
  .pw-num { font-size: .62rem; color: var(--muted); }
  .pet-streak b { color: var(--fg); font-weight: 700; }
  .pet-streak { display: flex; align-items: center; gap: .3rem; }
  .flame-anim { animation: flameFlick 1.7s ease-in-out infinite; transform-origin: 50% 90%; }
  .pet-emoji {
    width: 4.6rem; height: 4.6rem; flex-shrink: 0; background: none; border: none;
    padding: 0; cursor: pointer; line-height: 0;
  }
  .pet-svg { width: 100%; height: 100%; overflow: visible; }
  .pet-emoji.bounce { animation: petBounce .9s cubic-bezier(.22, 1.4, .36, 1); }
  /* อนิเมชันสัตว์เลี้ยง: หายใจ+เด้งเบาๆ, เอียงหัวมองไปมา, กะพริบตา, สะบัดปีก/หาง เป็นครั้งคราว, ไข่โยก, โน้ตลอย, ไฟวูบวาบ */
  /* ใช้ translate/scale/rotate แบบ property แยก (ไม่ใช่ transform รวม) เพื่อให้ bob + look ทำงานพร้อมกันบน element เดียวได้โดยไม่ตีกัน */
  .p-body {
    animation: petBob 2.7s ease-in-out infinite, petLook 7.4s ease-in-out infinite;
    transform-origin: 50% 85%;
  }
  @keyframes petBob {
    0%, 100% { translate: 0 0; scale: 1 1; }
    50% { translate: 0 -2.5px; scale: 1.015 .985; }
  }
  /* เอียงหัว/ตัวมองไปมาเป็นระยะ เหมือนนกสังเกตสิ่งรอบตัว จังหวะไม่สม่ำเสมอตั้งใจให้ดูไม่เหมือนหุ่นยนต์ */
  @keyframes petLook {
    0%, 12%, 100% { rotate: 0deg; }
    22%, 38% { rotate: -4deg; }
    50% { rotate: 0deg; }
    68%, 84% { rotate: 5deg; }
    94% { rotate: 0deg; }
  }
  .p-belly { animation: petBreathe 3.15s ease-in-out infinite; transform-origin: 50% 68%; transform-box: fill-box; }
  @keyframes petBreathe {
    0%, 100% { scale: 1 1; }
    50% { scale: 1.035 1.06; }
  }
  .p-eye { animation: petBlink 4.2s infinite; transform-origin: 50% 52%; transform-box: fill-box; }
  @keyframes petBlink {
    0%, 89%, 100% { transform: scaleY(1); }
    91%, 93% { transform: scaleY(.08); }
    94%, 96% { transform: scaleY(1); }
    97%, 98% { transform: scaleY(.08); }
  }
  /* ปีกพักนิ่งเป็นส่วนใหญ่ สะบัดสั้นๆ เป็นครั้งคราวแทนกระพือรัวตลอดเวลา */
  .p-wing { animation: petFlap 5.8s ease-in-out infinite; transform-box: fill-box; }
  .p-wing-l { transform-origin: 90% 15%; }
  .p-wing-r { transform-origin: 10% 15%; animation-delay: .15s; }
  @keyframes petFlap {
    0%, 85%, 100% { transform: rotate(0deg); }
    89% { transform: rotate(-14deg); }
    93% { transform: rotate(3deg); }
    96% { transform: rotate(-8deg); }
  }
  .p-wing-r { animation-name: petFlapR; }
  @keyframes petFlapR {
    0%, 85%, 100% { transform: rotate(0deg); }
    89% { transform: rotate(14deg); }
    93% { transform: rotate(-3deg); }
    96% { transform: rotate(8deg); }
  }
  /* หางสะบัดเบาๆ นานๆ ครั้ง */
  .p-tail { animation: petTailFlick 6.6s ease-in-out infinite; transform-origin: 95% 25%; transform-box: fill-box; }
  @keyframes petTailFlick {
    0%, 90%, 100% { rotate: 0deg; }
    94% { rotate: -7deg; }
    97% { rotate: 3deg; }
  }
  .p-wobble { animation: petWobble 3s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes petWobble {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-4deg); }
    75% { transform: rotate(4deg); }
  }
  .p-note { animation: noteFloat 2.8s ease-in-out infinite; transform-box: fill-box; }
  @keyframes noteFloat {
    0%, 100% { transform: translateY(0); opacity: 0; }
    25% { opacity: 1; }
    60% { transform: translateY(-9px); opacity: 1; }
    90% { transform: translateY(-14px); opacity: 0; }
  }
  .p-flame { animation: flameFlick 1.6s ease-in-out infinite; transform-origin: 50% 100%; transform-box: fill-box; }
  @keyframes flameFlick {
    0%, 100% { transform: scale(1) rotate(0deg); }
    30% { transform: scale(1.12, .94) rotate(-2deg); }
    65% { transform: scale(.94, 1.1) rotate(2deg); }
  }
  @keyframes petBounce {
    0% { transform: scale(1); }
    30% { transform: scale(1.35) rotate(-8deg); }
    55% { transform: scale(.92) rotate(5deg); }
    75% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .pet-level {
    font-size: .62rem; font-weight: 700; color: var(--primary);
    background: var(--primary-soft); border-radius: 999px; padding: .1rem .45rem;
  }
  .pet-levelup {
    font-size: .6rem; font-weight: 800; color: #fff; background: var(--primary);
    border-radius: 999px; padding: .1rem .45rem; letter-spacing: .04em;
    animation: petBounce .9s cubic-bezier(.22, 1.4, .36, 1);
  }
  .pet-streak { font-size: .72rem; color: var(--muted); margin-top: .15rem; }
  .pet-xp-num { font-size: .6rem; color: var(--muted); flex-shrink: 0; }
  .pet-next { font-size: .62rem; color: var(--muted); margin-top: .3rem; }
  .toast {
    position: fixed; left: 50%; bottom: calc(6rem + env(safe-area-inset-bottom));
    transform: translate(-50%, 12px); opacity: 0; z-index: 60;
    background: var(--fg); color: var(--bg); font-size: .8rem; font-weight: 600;
    padding: .6rem 1rem; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.3);
    transition: transform .3s cubic-bezier(.22, 1, .36, 1), opacity .3s;
    max-width: min(90vw, 24rem); text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  /* pet page (focus) */
  .pet-page { display: flex; flex-direction: column; align-items: center; gap: .8rem; padding-top: .25rem; }
  .pp-head { display: flex; align-items: center; gap: .5rem; }
  .pp-head h1 { font-size: 1.3rem; }
  .pp-bubble {
    position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 1rem; padding: .6rem .9rem; font-size: .82rem; max-width: 18rem; text-align: center;
  }
  .pp-bubble::after {
    content: ""; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%) rotate(45deg);
    width: 12px; height: 12px; background: var(--card);
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .pp-pet { position: relative; width: 9.5rem; height: 9.5rem; }
  .pp-pet.small { width: 6.5rem; height: 6.5rem; }
  .pp-pet svg { width: 100%; height: 100%; overflow: visible; }
  /* สัตว์เลี้ยง 3D: กล่องห่อเต็มพื้นที่เดิมของภาพวาด */
  .pet3d { display: block; position: relative; width: 100%; height: 100%; }
  .species-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: .5rem; }
  .species-opt {
    display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .6rem .5rem .7rem;
    border-radius: var(--r-md); border: 2px solid var(--border); background: var(--card); color: var(--fg);
    font: inherit; cursor: pointer; text-align: center;
  }
  .species-opt.sel { border-color: var(--primary); background: var(--primary-soft); }
  .species-pic { width: 5.5rem; height: 5.5rem; display: block; }
  .species-opt b { font-size: .88rem; }
  .species-note { font-size: .72rem; color: var(--muted); }
  .pet3d > svg { width: 100%; height: 100%; overflow: visible; }
  .pet3d-img { display: block; width: 100%; height: 100%; object-fit: contain; animation: pet3dBob 3.4s ease-in-out infinite; }
  .pet3d-canvas { display: block; width: 100% !important; height: 100% !important; touch-action: pan-y; cursor: grab; }
  .pet3d-canvas:active { cursor: grabbing; }
  .pp-pet[data-live]:has(.pet3d-canvas) { width: 11.5rem; height: 11.5rem; }
  .pet3d-hint { position: absolute; left: 50%; bottom: -1.1rem; transform: translateX(-50%); white-space: nowrap;
    font-size: .68rem; font-weight: 600; color: var(--muted); pointer-events: none; }
  @keyframes pet3dBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3%); } }
  @media (prefers-reduced-motion: reduce) { .pet3d-img { animation: none; } }
  .pp-spark { position: absolute; color: var(--primary); opacity: .6; animation: sparkTw 2.4s ease-in-out infinite; }
  .pp-spark.s1 { top: 8%; left: -6%; font-size: 1rem; }
  .pp-spark.s2 { top: 30%; right: -10%; font-size: .7rem; animation-delay: .7s; }
  .pp-spark.s3 { bottom: 12%; left: -12%; font-size: .8rem; animation-delay: 1.3s; }
  @keyframes sparkTw { 0%, 100% { opacity: .25; transform: scale(.9); } 50% { opacity: .85; transform: scale(1.15); } }
  .pp-stats { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; width: 100%; max-width: 22rem; }
  .pp-stat {
    background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md);
    padding: .8rem .9rem; display: flex; flex-direction: column; gap: .3rem; box-shadow: var(--shadow);
  }
  .pp-stat-label { font-size: .7rem; color: var(--muted); font-weight: 600; }
  .pp-stat b { font-size: 1.1rem; }
  .pp-start { max-width: 22rem; }
  .pp-hint { font-size: .74rem; color: var(--muted); text-align: center; }
  .pp-card {
    background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md);
    padding: .9rem; width: 100%; max-width: 22rem; box-shadow: var(--shadow);
  }
  .pp-q { font-size: .82rem; font-weight: 700; margin-bottom: .6rem; text-align: center; }
  .fp-stepper { display: flex; align-items: center; justify-content: center; gap: 1.1rem; margin-bottom: .6rem; }
  .fp-step {
    width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); font-size: 1.2rem; cursor: pointer; font-family: inherit;
  }
  .fp-num { font-size: 2rem; font-weight: 800; text-align: center; line-height: 1; }
  .fp-num span { display: block; font-size: .62rem; font-weight: 400; color: var(--muted); margin-top: .2rem; }
  .fp-presets { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; }
  .fp-pill {
    border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    font-family: inherit; font-size: .74rem; font-weight: 600; border-radius: 999px;
    padding: .45rem .7rem; cursor: pointer; min-height: 2.2rem;
  }
  .fp-pill.sel { background: var(--primary); border-color: var(--primary); color: #fff; }
  .pp-clock { font-size: 3.2rem; font-weight: 800; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .pp-bar {
    width: 100%; max-width: 20rem; height: .5rem; border-radius: 999px;
    background: var(--border); overflow: hidden;
  }
  .pp-bar span { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .5s linear; }

  /* real pets */
  .petr-card {
    display: flex; align-items: center; gap: .8rem; width: 100%; box-shadow: var(--shadow);
    background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md);
    padding: .8rem .9rem; margin-bottom: .55rem; cursor: pointer;
    font-family: inherit; color: var(--fg); text-align: left;
    transition: transform .08s;
  }
  .petr-card:active { transform: scale(.985); }
  .petr-avatar {
    flex-shrink: 0; width: 2.9rem; height: 2.9rem; border-radius: 50%;
    background: var(--primary-soft); display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
  }
  .petr-avatar.big { width: 3.6rem; height: 3.6rem; font-size: 1.9rem; }
  .petr-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .1rem; }
  .petr-info b { font-size: .95rem; }
  .petr-sub { font-size: .72rem; color: var(--muted); }
  .petr-head { display: flex; align-items: center; gap: .8rem; margin-bottom: .5rem; }
  .petr-notes {
    font-size: .78rem; color: var(--muted); background: var(--card);
    border: 1px solid var(--border); border-radius: .7rem; padding: .55rem .7rem; margin-bottom: .7rem;
  }
  .petr-rec {
    display: flex; gap: .65rem; align-items: flex-start; width: 100%;
    background: var(--card); border: 1px solid var(--border); border-radius: .8rem;
    padding: .7rem .8rem; margin-bottom: .5rem; cursor: pointer;
    font-family: inherit; color: var(--fg); text-align: left;
  }
  .petr-rec:active { background: color-mix(in srgb, var(--fg) 4%, var(--card)); }
  .petr-rec-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .25rem; }
  .petr-rec-head { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
  .petr-rec-head b { font-size: .85rem; }
  .bl-table { display: flex; flex-wrap: wrap; gap: .3rem; }
  .bl-cell {
    background: var(--bg); border: 1px solid var(--border); border-radius: .45rem;
    padding: .25rem .5rem; font-size: .7rem; display: flex; flex-direction: column;
  }
  .bl-cell i { font-style: normal; color: var(--muted); font-size: .62rem; }
  .petr-status {
    background: var(--card); border: 1px solid var(--border); border-radius: .9rem;
    padding: .75rem; cursor: pointer; font-family: inherit; color: var(--fg); text-align: left;
    display: flex; flex-direction: column; gap: .35rem; min-width: 0;
    transition: transform .08s;
  }
  .petr-status:active { transform: scale(.97); }
  .petr-status-head { display: flex; align-items: center; gap: .45rem; font-size: .76rem; font-weight: 700; min-width: 0; }
  .petr-status-head .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .petr-count {
    font-size: .62rem; font-weight: 700; color: var(--muted);
    background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: .05rem .4rem;
  }
  .petr-status-big { font-size: 1.35rem; font-weight: 800; line-height: 1.1; }
  .petr-status .petr-sub { display: flex; align-items: center; gap: .2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .petr-chart-mini .wt-chart { height: 2.6rem; }
  .petr-chart-mini .wt-range { display: none; }
  .bl-row { display: flex; gap: .4rem; align-items: center; margin-bottom: .4rem; }
  .bl-row input { margin: 0; }
  .bl-row .bl-k { flex: 1.2; }
  .bl-row .bl-v { flex: 1; }
  .wt-chart { width: 100%; height: 4rem; display: block; }
  .wt-range { display: flex; justify-content: space-between; font-size: .64rem; color: var(--muted); }

  /* pet journal */
  .jr-add { display: flex; flex-direction: column; gap: .5rem; }
  .jr-add textarea { margin: 0; }
  .jr-entry {
    background: var(--card); border: 1px solid var(--border); border-radius: .8rem;
    padding: .7rem .8rem .4rem; margin-bottom: .5rem;
  }
  .jr-text { font-size: .85rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: break-word; }
  .jr-meta {
    display: flex; align-items: center; justify-content: space-between;
    font-size: .66rem; color: var(--muted); margin-top: .15rem;
  }

  /* greeting header */
  .greet { display: flex; align-items: center; gap: .55rem; }
  .greet-ico { line-height: 0; }

  /* daily routine + tomorrow cards */
  .rt-card { grid-column: 1 / -1; }
  .rt-row { display: flex; align-items: center; gap: .25rem; }
  .rt-row .mini-task { flex: 1; min-width: 0; }
  .rt-del {
    flex-shrink: 0; background: none; border: none; color: var(--muted); cursor: pointer;
    width: 2.75rem; height: 2.75rem; margin: -.3rem 0; border-radius: .4rem; opacity: .55;
    display: flex; align-items: center; justify-content: center;
  }
  .rt-del:hover { opacity: 1; color: var(--danger-text); }
  .rt-add { display: flex; align-items: center; gap: .4rem; margin-top: .3rem; }
  .rt-add input {
    flex: 1; margin: 0; padding: .5rem .65rem; font-size: .78rem;
    border-radius: .5rem; border: 1px dashed var(--border); background: transparent;
  }
  .rt-add button {
    flex-shrink: 0; width: 2.2rem; height: 2.2rem; border-radius: .5rem; border: none;
    background: var(--primary-soft); color: var(--primary); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* settings — grouped list แบบแอพ */
  .set-profile {
    display: flex; align-items: center; gap: .85rem;
    background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md);
    padding: 1rem; margin-bottom: 1.1rem; box-shadow: var(--shadow);
  }
  .set-avatar {
    width: 2.9rem; height: 2.9rem; border-radius: 50%; background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem;
    flex-shrink: 0;
  }
  .set-group {
    background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md);
    margin-bottom: 1.1rem; overflow: hidden; box-shadow: var(--shadow);
  }
  .set-row {
    display: flex; align-items: center; gap: .7rem; width: 100%;
    padding: .8rem .9rem; background: none; border: none; text-align: left;
    font-family: inherit; font-size: .85rem; color: var(--fg); cursor: pointer;
  }
  .set-row + .set-row, .set-group form.set-row { border-top: 1px solid var(--border); }
  .set-row:active { background: color-mix(in srgb, var(--fg) 4%, var(--card)); }
  .set-row .set-ico {
    flex-shrink: 0; width: 1.9rem; height: 1.9rem; border-radius: .5rem;
    display: flex; align-items: center; justify-content: center;
  }
  .set-row .set-label { flex: 1; min-width: 0; }
  .set-row .set-sub { display: block; font-size: .68rem; color: var(--muted); margin-top: .1rem; }
  .set-row .set-value { font-size: .75rem; color: var(--muted); flex-shrink: 0; display: flex; align-items: center; gap: .2rem; }
  .set-row.static { cursor: default; }
  .set-row.static:active { background: none; }
  .set-row.danger { color: var(--danger-text); }
  .set-add { display: flex; align-items: center; gap: .5rem; padding: .55rem .9rem; border-top: 1px solid var(--border); }
  .set-add input { border: none; background: none; margin: 0; padding: .35rem 0; font-size: .82rem; flex: 1; min-width: 0; }
  .set-add input:focus { outline: none; }

  /* splash (ตอนเปิดแอพ) */
  #splash {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .9rem;
    transition: opacity .35s ease-out;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  .splash-logo {
    width: 5.5rem; height: 5.5rem; filter: drop-shadow(0 10px 18px rgba(79, 70, 229, .35));
    display: flex; align-items: center; justify-content: center;
    animation: splashIn .55s cubic-bezier(.16, 1, .3, 1) both;
  }
  .splash-name { font-size: 1.15rem; font-weight: 700; animation: splashIn .55s cubic-bezier(.16, 1, .3, 1) .12s both; }
  @keyframes splashIn {
    from { opacity: 0; transform: scale(.6) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* login — บล็อบสีเป็นพื้นหลังเต็มจอ ฟอร์มลอยอยู่บนพื้นหลังตรงๆ ไม่มีการ์ดขาวซ้อน (แบบ reference) */
  .login-wrap {
    position: relative; min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; padding: 1.5rem; padding-top: max(4rem, 29vh); padding-bottom: 5rem;
  }
  /* บล็อบมุมบนขวา + คลื่นล่าง แยกเป็นชิ้นยึดมุม/ขอบตัวเอง ขนาดอิง vh (ไม่ใช่ vmax) เพื่อคุมว่ากินพื้นที่กลางจอแค่ไหน
     ให้คงที่ไม่ว่าจอจะแคบทรงตั้ง (มือถือ) หรือกว้างทรงเตี้ย (เดสก์ท็อป) และเหลือพื้นที่กลางจอโล่งพอให้ตัวหนังสืออ่านได้ */
  /* absolute (ไม่ใช่ fixed) — ยืดตามความสูงจริงของเนื้อหา คลื่นด้านล่างจะได้อยู่ท้ายเนื้อหาเสมอ
     แม้ฟอร์มจะยาวเกินจอเดียว (เช่น signup ที่มีช่องเยอะกว่า) ไม่ทับตัวหนังสือท้ายฟอร์ม */
  .login-hero { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .login-blob-1 {
    position: absolute; top: -22vh; right: -18vh; width: 46vh; height: 46vh;
    border-radius: 50%; background: var(--primary);
  }
  .login-blob-2 {
    position: absolute; top: 1vh; right: -3vh; width: 23vh; height: 23vh;
    border-radius: 50%; background: var(--primary-dark); opacity: .5;
  }
  .login-wave { position: absolute; inset: auto 0 0 0; width: 100%; height: 11vh; min-height: 5.5rem; }
  .login-wave svg { width: 100%; height: 100%; display: block; }
  /* การ์ดงานจิ๋วลอยบนบล็อบ/คลื่น (ธีมเดียวกับไอคอนแอป: ติ๊กเขียว + ขีดรายการ) */
  .login-chip {
    position: absolute; display: flex; align-items: center; gap: .4rem;
    padding: .45rem .7rem .45rem .45rem; border-radius: .8rem;
    background: rgba(255, 255, 255, .95); box-shadow: 0 10px 24px -10px rgba(30, 27, 75, .45);
    animation: chipFloat 5s ease-in-out infinite;
  }
  .login-chip .lc-tick {
    width: 1.35rem; height: 1.35rem; border-radius: .45rem; background: #10b981; padding: .2rem; flex-shrink: 0;
  }
  .login-chip i { display: block; width: 3.6rem; height: .42rem; border-radius: 1rem; background: #c7cbee; }
  .login-chip i.short { width: 2.2rem; background: #6366f1; opacity: .8; }
  .login-chip.lc-1 { top: max(3.2rem, 9vh); right: max(1.2rem, 7vw); flex-wrap: wrap; width: 6.6rem; row-gap: .35rem; transform: rotate(4deg); }
  .login-chip.lc-1 i.short { margin-left: 1.75rem; }
  .login-chip.lc-2 { bottom: max(1rem, 2.4vh); left: max(1.2rem, 7vw); transform: rotate(-5deg) scale(.88); animation-delay: -2.5s; }
  @keyframes chipFloat {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -6px; }
  }
  @media (prefers-reduced-motion: reduce) { .login-chip { animation: none; } }
  .setup-q { width: 100%; margin-bottom: .35rem; }
  .setup-label { font-size: .8rem; font-weight: 600; margin-bottom: .5rem; }
  .setup-chips { display: flex; flex-wrap: wrap; gap: .45rem; }
  .setup-chip {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .45rem .7rem; border-radius: 999px; font-size: .78rem; font-family: inherit;
    border: 1.5px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer;
    transition: transform .12s cubic-bezier(.22, 1, .36, 1);
  }
  .setup-chip:active { transform: scale(.95); }
  .setup-chip.sel-primary { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .login {
    display: flex; flex-direction: column; align-items: center;
    padding: 2rem 1.5rem; max-width: 22rem; width: 100%; margin: 0 auto; gap: .75rem;
    animation: loginIn .45s cubic-bezier(.16, 1, .3, 1) both;
  }
  .login.setup { min-height: 100dvh; justify-content: center; }
  .login-wrap .login { position: relative; z-index: 1; }
  /* input มีพื้นทึบของตัวเองอยู่แล้วเลยยังอ่านง่ายแม้ไม่มีการ์ดขาวรองด้านหลัง */
  .login-wrap .login input, .login-wrap .login .btn-google {
    background: var(--card); box-shadow: 0 2px 10px -4px rgba(0,0,0,.18);
  }
  @keyframes loginIn {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .login-logo {
    width: 4.2rem; height: 4.2rem; filter: drop-shadow(0 8px 14px rgba(79, 70, 229, .3));
    display: flex; align-items: center; justify-content: center; margin-bottom: .25rem;
  }
  .login-logo svg { width: 100%; height: 100%; display: block; }
  .login-brand { font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); margin: -.35rem 0 .1rem; }
  .login h1 { font-size: 1.4rem; margin: 0; }
  .login .tagline { font-size: .8rem; color: var(--muted); margin-bottom: .75rem; }
  .login input { margin: 0; }
  .login .btn { margin: 0; }
  .ic-field { position: relative; width: 100%; }
  .ic-field .ic-lead {
    position: absolute; left: .9rem; top: 50%; transform: translateY(-50%);
    color: var(--muted); line-height: 0; pointer-events: none;
  }
  .ic-field input { padding-left: 2.6rem; }
  .ic-field.has-toggle input { padding-right: 2.6rem; }
  .ic-toggle {
    position: absolute; right: .6rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); padding: .4rem;
    display: flex; line-height: 0; cursor: pointer; border-radius: .4rem;
  }
  .login-or {
    display: flex; align-items: center; gap: .75rem; width: 100%;
    color: var(--muted); font-size: .7rem; margin: .25rem 0;
  }
  .login-or::before, .login-or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .btn-google {
    background: var(--card); border: 1px solid var(--border); color: var(--fg);
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  }
  .login .demo-note { font-size: .68rem; color: var(--muted); text-align: center; margin-top: .5rem; }
  .head-actions { display: inline-flex; gap: .15rem; }
  .proj-head { display: flex; align-items: center; justify-content: space-between; margin: .2rem 0 .6rem; }
  .back-btn {
    background: none; border: none; color: var(--primary); font-size: .875rem; font-weight: 600;
    cursor: pointer; font-family: inherit; padding: 0; margin-bottom: .75rem; display: inline-flex; align-items: center; gap: .25rem;
  }
  .empty-sm { text-align: center; color: var(--muted); font-size: .8rem; padding: 1rem 0; }

  .task {
    display: flex; gap: .7rem; align-items: flex-start;
    background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md);
    padding: .9rem; margin-bottom: .55rem; box-shadow: var(--shadow);
    cursor: pointer; user-select: none; transition: transform .08s, opacity .15s;
  }
  .task:active { transform: scale(.98); }
  .task.is-done { opacity: .6; }
  .task-status {
    flex-shrink: 0; margin-top: .05rem; width: 1.5rem; height: 1.5rem;
    border-radius: 50%; border: 2px solid color-mix(in srgb, var(--muted) 45%, var(--border));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: .72rem; pointer-events: none;
  }
  .task.is-done .task-status { background: var(--success); border-color: var(--success); }
  .task-body { flex: 1; min-width: 0; }
  .edit-btn {
    flex-shrink: 0; background: none; border: none; color: var(--muted);
    cursor: pointer; width: 2.75rem; height: 2.75rem; border-radius: .5rem;
    display: flex; align-items: center; justify-content: center;
    margin: -.55rem -.55rem -.55rem -.25rem;
  }
  .task-title { font-size: .92rem; font-weight: 700; }
  .task-title.done { text-decoration: line-through; opacity: .5; }
  .task-meta {
    display: flex; flex-wrap: wrap; gap: .15rem .5rem; align-items: center;
    font-size: .75rem; color: var(--muted); margin-top: .15rem;
  }
  .task-meta .overdue { color: var(--danger-text); font-weight: 600; }
  .chip { border-radius: 999px; padding: .1rem .5rem; font-size: .65rem; font-weight: 600; }
  /* โน้ตย่อใต้ชื่องาน (บรรทัดเดียว) — กดปุ่มรายละเอียดเพื่ออ่านเต็ม */
  .task-title, .task-note { user-select: text; }
  .task-note {
    font-size: .74rem; color: var(--muted); margin-top: .2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .task.is-done .task-note { opacity: .8; }
  /* หน้ารายละเอียดงาน */
  .detail-chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .75rem; }
  .detail-row { display: flex; gap: .5rem; align-items: baseline; font-size: .82rem; margin-bottom: .35rem; }
  .detail-row .k { color: var(--muted); min-width: 4.5rem; flex-shrink: 0; }
  .detail-note {
    white-space: pre-wrap; overflow-wrap: anywhere; font-size: .86rem; line-height: 1.55;
    background: var(--bg); border-radius: var(--r-sm); padding: .8rem .9rem; margin: .6rem 0 .9rem;
    max-height: 50dvh; overflow-y: auto;
  }
  /* โน้ตของโปรเจกต์/หมวด บนหัวหน้ารายละเอียด */
  .cat-note {
    background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md);
    box-shadow: var(--shadow); padding: .85rem .95rem; margin-bottom: .9rem;
  }
  .cat-note-head { display: flex; align-items: center; gap: .45rem; font-size: .8rem; font-weight: 800; margin-bottom: .4rem; }
  .cat-note-head .spacer { flex: 1; }
  .cat-note-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .84rem; line-height: 1.5; }
  .cat-note-body.auto { color: var(--muted); }
  .cat-note-meta { font-size: .7rem; color: var(--muted); margin-top: .45rem; }
  /* หน้าสรุปโปรเจกต์: ภาพรวม + ความเปลี่ยนแปลง */
  .ps-list { margin: 0; padding-left: 1.1rem; font-size: .84rem; line-height: 1.55; }
  .ps-list li { margin: .1rem 0; overflow-wrap: anywhere; }
  .ps-mynote {
    margin-top: .6rem; padding: .55rem .7rem; border-radius: var(--r-sm); background: var(--bg);
    font-size: .8rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .ps-mynote b { display: block; font-size: .7rem; color: var(--muted); margin-bottom: .15rem; }
  .ps-group + .ps-group { margin-top: .7rem; }
  .ps-kind { font-size: .74rem; font-weight: 800; margin-bottom: .2rem; }
  .ps-kind span {
    font-weight: 700; font-size: .66rem; padding: .02rem .4rem; border-radius: 999px;
    background: var(--bg); color: var(--muted); margin-left: .2rem;
  }
  .ps-item {
    display: flex; align-items: flex-start; gap: .5rem; width: 100%; text-align: left;
    background: none; border: none; padding: .38rem .2rem; border-radius: .5rem; cursor: pointer;
    font: inherit; font-size: .82rem; color: var(--fg); line-height: 1.4;
  }
  .ps-item:hover { background: var(--bg); }
  .ps-item { user-select: text; }
  .ps-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .ps-dot { flex-shrink: 0; width: .45rem; height: .45rem; border-radius: 50%; margin-top: .42rem; }
  .ps-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  /* "English topic — คำอธิบายไทย": หัวข้อเด่น คำอธิบายจางลง */
  .ps-topic { font-weight: 700; color: var(--fg); }
  .ps-desc { color: var(--muted); }
  .ps-date { flex-shrink: 0; font-size: .68rem; color: var(--muted); margin-top: .1rem; }
  .ps-more {
    background: none; border: none; cursor: pointer; font: inherit; font-size: .74rem; font-weight: 700;
    color: var(--primary); padding: .3rem .2rem 0 1.15rem;
  }

  /* ---- bottom bar: แคปซูลลอย + ปุ่ม + แยกออกมาทางขวา (แบบ reference Iconly) ---- */
  .fab {
    position: fixed; bottom: calc(1rem + env(safe-area-inset-bottom)); right: max(1rem, calc(50% - 13rem));
    width: 3.6rem; height: 3.6rem; border-radius: 50%; border: none;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px -8px color-mix(in srgb, var(--primary) 70%, transparent); cursor: pointer; z-index: 20;
  }
  .fab:active { background: var(--primary-dark); }

  nav {
    position: fixed; z-index: 20; bottom: calc(1rem + env(safe-area-inset-bottom));
    left: max(1rem, calc(50% - 13rem)); right: max(5.4rem, calc(50% - 13rem + 4.4rem));
    background: var(--card); border: 1px solid var(--edge); border-radius: 999px;
    box-shadow: 0 12px 32px -12px rgba(21, 23, 43, .28), 0 1px 2px rgba(21, 23, 43, .06);
    padding: .35rem;
  }
  .nav-inner { display: flex; align-items: center; gap: .1rem; }
  .nav-btn {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: .4rem;
    height: 2.85rem; padding: 0 .5rem; border-radius: 999px;
    background: none; border: none; font-size: .8rem; font-weight: 800; color: var(--muted); cursor: pointer; font-family: inherit;
    transition: background .18s ease-out, color .18s ease-out, flex-grow .22s cubic-bezier(.22, 1, .36, 1);
  }
  .nav-btn .ico { line-height: 0; }
  .nav-btn .lbl { display: none; white-space: nowrap; }
  .nav-btn.active { flex: 0 0 auto; padding: 0 .95rem 0 .8rem; background: var(--primary-soft); color: var(--primary); }
  .nav-btn.active .lbl { display: inline; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 30rem) { .overlay { align-items: center; } }
  .sheet {
    width: 100%; max-width: 28rem; max-height: 90dvh; overflow-y: auto;
    background: var(--card); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 1.1rem 1.1rem 1rem;
    padding-bottom: calc(1rem + env(safe-area-inset-bottom));
  }
  @media (min-width: 30rem) { .sheet { border-radius: var(--r-lg); } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .9rem; }
  .sheet-head h2 { font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; }
  .x-btn {
    background: var(--bg); border: none; font-size: 1rem; color: var(--muted); cursor: pointer;
    width: 2.2rem; height: 2.2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }

  label.fld { display: block; font-size: .7rem; color: var(--muted); margin-bottom: .75rem; }
  label.fld-check {
    display: flex; align-items: center; gap: .5rem; font-size: .8rem; color: var(--fg);
    margin-bottom: .75rem; cursor: pointer;
  }
  label.fld-check input[type="checkbox"] {
    width: 1.15rem; height: 1.15rem; margin: 0; accent-color: var(--primary); flex-shrink: 0; cursor: pointer;
  }
  input, select, textarea, .btn { font-family: inherit; font-size: .9rem; color: var(--fg); }
  input, select, textarea {
    width: 100%; background: var(--bg); border: 1.5px solid transparent;
    border-radius: var(--r-sm); padding: .7rem .85rem; margin-top: .3rem; font-weight: 600;
    transition: border-color .15s ease-out, background .15s ease-out;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); font-weight: 500; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background: var(--card); }
  textarea { resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .btn { width: 100%; border: none; border-radius: var(--r-sm); padding: .85rem; font-weight: 800; cursor: pointer; margin-top: .25rem; transition: transform .12s cubic-bezier(.22, 1, .36, 1), background .15s; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:active { background: var(--primary-dark); }
  .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--fg); }
  .btn-danger-outline { background: transparent; border: 1.5px solid color-mix(in srgb, var(--danger) 45%, transparent); color: var(--danger); }

  .card { background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md); padding: 1rem; margin-bottom: .75rem; box-shadow: var(--shadow); }
  .cat-row { display: flex; align-items: center; gap: .75rem; background: var(--card); border: 1px solid var(--border); border-radius: .75rem; padding: .6rem .75rem; margin-bottom: .5rem; }
  .cat-dot { width: 1rem; height: 1rem; border-radius: 50%; flex-shrink: 0; }
  .cat-name { flex: 1; font-size: .875rem; }
  .link-danger { background: none; border: none; color: var(--danger); font-size: .75rem; cursor: pointer; font-family: inherit; }
  .add-cat { display: flex; align-items: center; gap: .5rem; border: 1px dashed var(--border); border-radius: .75rem; padding: .6rem .75rem; }
  .add-cat input { border: none; background: none; padding: 0; margin: 0; flex: 1; min-width: 0; }
  .color-opt { width: 1.2rem; height: 1.2rem; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; flex-shrink: 0; }
  .color-opt.sel { border-color: var(--fg); }
  .icon-opt {
    width: 1.9rem; height: 1.9rem; border-radius: .45rem; border: 1px solid var(--border);
    background: var(--card); color: var(--muted); cursor: pointer; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-opt.sel { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .link-primary { background: none; border: none; color: var(--primary); font-weight: 600; font-size: .875rem; cursor: pointer; font-family: inherit; }
  .hint { font-size: .75rem; color: var(--muted); margin-top: .5rem; }
  .filter-sel { width: auto; margin: 0; padding: .4rem .5rem; font-size: .8rem; }

  /* calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
  .cal-head h2 { font-size: 1rem; }
  .cal-title { display: flex; align-items: center; gap: .5rem; min-width: 0; }
  .cal-today-btn {
    border: 1px solid var(--primary); background: var(--primary-soft); color: var(--primary);
    font-family: inherit; font-size: .68rem; font-weight: 700; border-radius: 999px;
    padding: .3rem .65rem; cursor: pointer; flex-shrink: 0;
  }
  /* จอแคบพิเศษ (<360px): ปฏิทินซ่อนป้ายชื่องาน เหลือแถบสีบอกว่ามีงาน */
  @media (max-width: 359px) {
    .cal-day { min-height: 3rem; }
    .cal-lbl { font-size: 0; height: .3rem; border-radius: 999px; padding: 0; margin: 0 .1rem; }
    .cal-more { display: none; }
  }
  .cal-nav {
    background: var(--card); border: 1px solid var(--edge); border-radius: 50%; box-shadow: var(--shadow);
    width: 2.75rem; height: 2.75rem; cursor: pointer; color: var(--fg);
    display: flex; align-items: center; justify-content: center;
  }
  .cal-seg {
    display: inline-flex; background: var(--card); border: 1px solid var(--edge); box-shadow: var(--shadow);
    border-radius: 999px; padding: .2rem; gap: .1rem;
  }
  .cal-seg-btn {
    border: none; background: none; font-family: inherit; font-size: .78rem; font-weight: 800;
    color: var(--muted); padding: .55rem .85rem; border-radius: 999px; cursor: pointer;
    min-height: 2.4rem; transition: background .15s, color .15s;
  }
  .cal-seg-btn.sel { background: var(--primary); color: #fff; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: .2rem;
    background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md);
    padding: .5rem .3rem; box-shadow: var(--shadow);
  }
  .cal-dow { text-align: center; font-size: .65rem; color: var(--muted); font-weight: 600; padding: .25rem 0; }
  .cal-day {
    min-height: 4.3rem; border: 1px solid transparent; border-radius: .55rem; background: none;
    font-family: inherit; font-size: .78rem; color: var(--fg); cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch; gap: .14rem;
    position: relative; padding: .2rem .15rem; min-width: 0; overflow: hidden;
  }
  .cal-num { text-align: center; line-height: 1.2; }
  .cal-day.other { color: var(--muted); opacity: .4; }
  .cal-day.today { border-color: var(--primary); font-weight: 700; }
  .cal-day.sel { background: var(--primary); color: #fff; }
  .cal-day.sel .cal-lbl { background: rgba(255,255,255,.25) !important; color: #fff !important; }
  .cal-lbl {
    display: block; font-size: .66rem; font-weight: 600; line-height: 1.45;
    border-radius: .25rem; padding: 0 .2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left;
  }
  .cal-dot { width: .3rem; height: .3rem; border-radius: 50%; flex-shrink: 0; }
  .cal-more { font-size: .62rem; color: var(--muted); line-height: 1.2; text-align: left; padding-left: .2rem; }
  .cal-day.sel .cal-more { color: #fff; }

  /* week view */
  .wk-row {
    display: flex; gap: .6rem; padding: .45rem 0; border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }
  .wk-row.today .wk-num { background: var(--primary); color: #fff; }
  .wk-date {
    flex-shrink: 0; width: 2.6rem; background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: .1rem; font-family: inherit;
    color: var(--fg); padding: 0;
  }
  .wk-dow { font-size: .6rem; color: var(--muted); font-weight: 600; }
  .wk-num {
    width: 1.9rem; height: 1.9rem; border-radius: 50%; font-size: .85rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .wk-list { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .15rem; }
  .wk-item {
    display: flex; align-items: center; gap: .4rem; background: none; border: none;
    font-family: inherit; font-size: .76rem; color: var(--fg); cursor: pointer;
    padding: .25rem .3rem; border-radius: .4rem; text-align: left; min-width: 0;
  }
  .wk-item:active { background: color-mix(in srgb, var(--fg) 5%, transparent); }
  .wk-item.done .wk-title { text-decoration: line-through; opacity: .5; }
  .wk-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wk-time { flex-shrink: 0; font-size: .64rem; color: var(--muted); }

  /* checklist */
  .cl-new {
    border-style: dashed; cursor: pointer; flex-direction: row; align-items: center;
    justify-content: center; gap: .4rem; color: var(--muted); font-family: inherit; font-size: .8rem;
  }
  .cl-new:active { transform: scale(.985); }
  .cl-complete { border-color: var(--success); }

  /* dashboard */
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-bottom: .25rem; }
  .stat-card {
    background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md);
    padding: .8rem .6rem; text-align: left; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: flex-start; gap: .15rem;
  }
  .stat-ico {
    width: 1.8rem; height: 1.8rem; border-radius: .6rem; margin-bottom: .25rem;
    display: flex; align-items: center; justify-content: center;
  }
  .stat-num { font-size: 1.5rem; font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat-num.danger { color: var(--danger-text); }
  .stat-num.success { color: var(--success); }
  .stat-label { font-size: .7rem; font-weight: 700; color: var(--muted); }
  .dash-cat { background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-md); padding: .9rem; margin-bottom: .55rem; box-shadow: var(--shadow); }
  .dash-cat-head { display: flex; align-items: center; gap: .5rem; font-size: .85rem; font-weight: 600; }
  .dash-cat-head .cat-dot { width: .75rem; height: .75rem; }
  .dash-cat-nums { margin-left: auto; font-size: .75rem; color: var(--muted); font-weight: 400; }
  .bar { height: .4rem; background: var(--border); border-radius: 999px; margin-top: .5rem; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }
  .week-chart { display: flex; align-items: flex-end; gap: .4rem; height: 5rem; margin-top: .5rem; }
  .week-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .25rem; height: 100%; justify-content: flex-end; }
  .week-bar { width: 100%; max-width: 1.6rem; background: var(--primary); border-radius: .25rem .25rem 0 0; min-height: 2px; }
  .week-bar.zero { background: var(--border); }
  .week-label { font-size: .6rem; color: var(--muted); }

  /* ---- responsive: จับขนาดจออัตโนมัติ ---- */
  /* Tablet (>=640px): จอกว้างขึ้น การ์ด 3 คอลัมน์ */
  @media (min-width: 640px) {
    .app { max-width: 44rem; }
    .ov-grid { grid-template-columns: repeat(3, 1fr); }
    nav { left: calc(50% - 21rem); right: calc(50% - 21rem + 4.4rem); }
    .fab { right: calc(50% - 21rem); }
    /* จอกว้างขึ้น hero เป็นบล็อกโค้งลอยแทนเต็มขอบ */
    .hero { margin: 0; border-radius: var(--r-lg); padding-bottom: 3.4rem; }
    .sheet-body { margin-inline: 0; }
  }
  /* Desktop (>=1024px): sidebar ซ้าย + เนื้อหากว้าง */
  @media (min-width: 1024px) {
    .app { max-width: none; margin-left: 14rem; padding-bottom: 3rem; }
    .page { max-width: 56rem; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }
    nav {
      inset: 0 auto 0 0; width: 14rem; border-radius: 0; box-shadow: none; padding: 0;
      border: none; border-right: 1px solid var(--border);
    }
    .nav-inner {
      flex-direction: column; align-items: stretch; padding-top: .75rem; gap: .2rem;
    }
    .nav-inner::before {
      content: "Kodo"; font-size: 1.1rem; font-weight: 800; letter-spacing: -.02em;
      padding: .75rem 1.25rem 1rem; color: var(--fg);
    }
    .nav-btn {
      flex: none; justify-content: flex-start; gap: .65rem; height: auto;
      font-size: .88rem; padding: .65rem .9rem; margin: 0 .6rem; border-radius: var(--r-sm);
    }
    .nav-btn .lbl { display: inline; }
    .nav-btn.active { flex-grow: 0; }
    .ov-grid { grid-template-columns: repeat(3, 1fr); gap: .8rem; }
    .fab { right: 2.5rem; bottom: 2.5rem; }
    .stat-row { max-width: 32rem; }
  }

  /* ===== สถานะการโต้ตอบ (V6.0): ทุกอย่างที่กดได้มี hover / focus / กดค้าง =====
     hover เฉพาะเครื่องที่มีเมาส์ (มือถือไม่มี hover ค้าง) · 150–200ms ease-out · reduce-motion ปิดทั้งหมดด้วยกฎด้านบน */
  :root {
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --hover-tint: color-mix(in srgb, var(--primary) 9%, transparent);
    --lift-shadow: 0 14px 30px -18px color-mix(in srgb, var(--primary) 60%, transparent);
  }
  .ov-more, .x-btn, .edit-btn, .rt-del, .cal-nav, .fp-step, .ic-toggle, .mini-task, .wk-item, .wk-date,
  .set-row, .link-primary, .link-danger, .back-btn, .ps-more, .cal-today-btn, .btn, .btn-google,
  .fp-pill, .day-pill, .setup-chip, .icon-opt, .color-opt, .petr-card, .petr-rec, .petr-status,
  .species-opt, .ov-card.is-link, .cl-new, .ps-item, .cal-day, .cal-seg-btn, .switch {
    transition: background-color .18s var(--ease-out), color .18s var(--ease-out), border-color .18s var(--ease-out),
      box-shadow .2s var(--ease-out), transform .18s var(--ease-out), opacity .18s var(--ease-out);
  }
  .task {
    transition: transform .12s var(--ease-out), opacity .15s, background-color .18s var(--ease-out),
      border-color .18s var(--ease-out), box-shadow .2s var(--ease-out);

  if (h >= 5 && h < 12) return { text: "Good morning", icon: "sunrise", color: "#d97706" };

  if (h >= 17 && h < 21) return { text: "Good evening", icon: "sunset", color: "#f59e0b" };

  const n = name.toLowerCase();
  if (n.includes("workout") || n.includes("exercise") || n.includes("gym") || n.includes("ออกกำลัง")) return "dumbbell";
  if (n.includes("work") || n.includes("งาน")) return "briefcase";
  if (n.includes("personal") || n.includes("ส่วนตัว")) return "user";
  if (n.includes("house") || n.includes("บ้าน")) return "home";
  if (n.includes("health") || n.includes("สุขภาพ")) return "heart";
  if (n.includes("study") || n.includes("read") || n.includes("เรียน")) return "book";
  if (n.includes("shop") || n.includes("ซื้อ")) return "cart";
  return "tag";
}

// migration จากเวอร์ชันก่อน
function migrate(s) {
  s.categories.forEach(c => {
    if (c.name === "Exercise") { c.name = "Workout"; c.icon = "dumbbell"; }
    if (!c.icon) c.icon = guessIcon(c.name);
    if (c.schedule === undefined) c.schedule = null; // {days:[0-6], start:"HH:MM", end:"HH:MM"}
    if (c.enabled === undefined) c.enabled = true;
    // โปรเจกต์ย่อย: เก็บเฉพาะรายการที่ id/สี/ชื่อ อยู่ในรูปแบบที่แอปสร้างเอง
    if (c.projects !== undefined) {
      c.projects = Array.isArray(c.projects) ? c.projects.filter(p =>
        p && typeof p.id === "string" && /^[a-z0-9]{1,40}$/i.test(p.id)
        && typeof p.name === "string" && p.name.trim()
        && typeof p.color === "string" && /^#[0-9a-f]{3,8}$/i.test(p.color)) : [];
    }
  });
  if (s.game) {
    if (s.game.petName != null) s.game.petName = typeof s.game.petName === "string" ? (s.game.petName.trim().slice(0, 24) || null) : null;
    if (s.game.petSpecies != null && !["parrotlet", "cockatiel"].includes(s.game.petSpecies)) s.game.petSpecies = null;
  }
  (s.tasks || []).forEach(t => { if (t.projectId != null && (typeof t.projectId !== "string" || !/^[a-z0-9]{1,40}$/i.test(t.projectId))) t.projectId = null; });
  if (!Array.isArray(s.routines)) s.routines = [];
  if (!s.routineLog || typeof s.routineLog !== "object") s.routineLog = {};
  if (!s.meta || typeof s.meta !== "object") s.meta = {};
  // checklists: [{id, title, items:[{id, text, checked}], reminder: {days:[0-6], time:"HH:MM"}|null}]
  if (!Array.isArray(s.checklists)) s.checklists = [];
  // gamification: check-in รายวัน + XP + level ของสัตว์เลี้ยง
  if (!s.game || typeof s.game !== "object") s.game = { checkins: {}, best: 0, xp: 0 };
  if (!s.game.checkins) s.game.checkins = {};
  if (typeof s.game.xp !== "number") s.game.xp = 0;
  if (typeof s.game.best !== "number") s.game.best = 0;
  if (!s.game.focus || typeof s.game.focus !== "object") s.game.focus = {}; // dateKey -> นาทีที่โฟกัสสำเร็จ
  // pet journal: [{id, date: dateKey, text, createdAt}]
  if (!Array.isArray(s.journal)) s.journal = [];
  // สัตว์เลี้ยงจริงที่บ้าน: [{id, name, species, sex, hatchDate, notes, records: [...]}]
  // record: {id, type: checkup|blood|treatment|med|weight|note, date, title, details, values: [{k,v}], grams}
  if (!Array.isArray(s.pets)) s.pets = [];
  // task แบบช่วงวัน (range): endDate = "YYYY-MM-DD" | null — งานที่กินหลายวัน เช่น ทริปทำงาน
  s.tasks.forEach(t => { if (t.endDate === undefined) t.endDate = null; });
  // เก็บ log แค่ 30 วันล่าสุด
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
  for (const k of Object.keys(s.routineLog)) {
    if (new Date(k + "T00:00:00") < cutoff) delete s.routineLog[k];
  }
  return s;
}

/* ---------- dates ---------- */
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function startOfDay(d) { const r = new Date(d); r.setHours(0,0,0,0); return r; }
function startOfMonth(d) { const r = new Date(d); r.setDate(1); r.setHours(0,0,0,0); return r; }
function isToday(d) { return startOfDay(d).getTime() === startOfDay(new Date()).getTime(); }
function dateKey(d) {
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function fmtTime(d) {
  let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, "0");
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + m + " " + ap;
}
function fmtDate(d) {
  const diff = Math.round((startOfDay(d) - startOfDay(new Date())) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  if (diff === -1) return "Yesterday";
  return DOW[d.getDay()] + " " + d.getDate() + " " + MONTHS_SHORT[d.getMonth()];
}
function fmtDateTime(d) {
  const hasTime = d.getHours() !== 0 || d.getMinutes() !== 0;
  return hasTime ? fmtDate(d) + " " + fmtTime(d) : fmtDate(d);
}
function toInputValue(d) {
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}

/* ---------- recurrence ---------- */
function nextDueDate(due, recurrence) {
  if (recurrence === "none") return null;
  const next = new Date(due.getTime());
  if (recurrence === "daily") next.setDate(next.getDate() + 1);
  else if (recurrence === "weekly") next.setDate(next.getDate() + 7);
  else if (recurrence === "monthly") {
    const day = next.getDate();
    next.setDate(1);
    next.setMonth(next.getMonth() + 1);
    const dim = new Date(next.getFullYear(), next.getMonth() + 1, 0).getDate();
    next.setDate(Math.min(day, dim));
  }
  return next;
}

async function initCloud() {
  if (!cloudConfigured()) return;
  cloudStatus = "connecting";

        const s = document.createElement("script");

    cloudStatus = "ready";
    const { data } = await sb.auth.getSession();
    sbToken = data.session?.access_token || null;
    if (data.session) { await onCloudSignedIn(data.session); captureGoogleToken(data.session); }
    sb.auth.onAuthStateChange((event, session) => {
      sbToken = session?.access_token || sbToken;
      if (event === "SIGNED_IN" && session) {
        (async () => {
          if (!sbUser || sbUser.id !== session.user.id) await onCloudSignedIn(session);
          captureGoogleToken(session); // กลับมาจากหน้า Connect Google Calendar → เก็บ refresh token
        })();

async function pullCloud() {
  if (!sb || !sbUser) return;
  // มีการแก้ไขค้างที่ยังไม่ขึ้น cloud → ห้ามดึงมาทับ ดันของเราขึ้นไปแทน
  if (cloudDirty) { scheduleCloudSave(); return; }
  cloudPulling = true;
  try {
    const { data, error } = await sb.from("app_state").select("data").eq("user_id", sbUser.id).maybeSingle();
    if (error) { syncState = "error"; showToast("⚠️ Sync error: " + error.message); return; }
    if (data && data.data && typeof data.data === "object") {
      const remote = migrate(data.data);
      for (const k of ["categories", "tasks", "routines", "routineLog", "checklists", "game", "meta", "journal", "pets"]) {
        if (remote[k] !== undefined) state[k] = remote[k];
      }
      localStorage.setItem(stateKey, JSON.stringify(state));
      syncState = "synced";
    } else {
      // cloud ยังว่าง → ดันข้อมูลเครื่องนี้ขึ้นไป
      cloudDirty = true;
      scheduleCloudSave();
    }
  } finally {
    cloudPulling = false;
  }
  migrateAgentCategories();   // ย้ายงาน AI ที่ import ไว้ด้วยเวอร์ชันเก่าเข้าหมวดตามโปรเจกต์ (ทำครั้งเดียว)
  mergeProjectAliases();      // หมวด "AI · Solo Task" / "AI · Task_Studio" -> "AI · Kodo"
  absorbOverviewTasks();      // แถวภาพรวมที่แอปเวอร์ชันเก่าเผลอ import เป็น task -> ดูดกลับเป็นภาพรวม
  await importAgentLog();
}
