      <ul class="ps-list">${p[k.key].map(x => `<li>${topicHtml(x)}</li>`).join("")}</ul>
    </div>`).join("");
  // บรรทัด ⏱ ถูกย้ายไปแถว "ใช้เวลา" แล้ว — รายละเอียดจึงเอาส่วนที่เหลือ (ทั้งโน้ตแบบใหม่และแบบเก่า)
  const detailsText = p.details;
  const bodyHtml = (kindBlocks || detailsText)
    ? `${kindBlocks}${detailsText ? `${kindBlocks ? `<div class="ps-kind" style="color:var(--muted)">Details</div>` : ""}<div class="detail-note">${esc(detailsText)}</div>` : ""}`
    : `<p class="hint">No details</p>`;
  document.getElementById("modal").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeForm()">
    <div class="sheet" role="dialog" aria-label="Task details">
      <div class="sheet-head">
        <h2 style="overflow-wrap:anywhere">${esc(t.title)}</h2>
        <button class="x-btn" aria-label="Close" onclick="closeForm()">✕</button>
      </div>
      <div class="detail-chips">${chips}</div>
      ${rows.join("")}
      <div style="margin-top:.7rem">${bodyHtml}</div>
      <button class="btn btn-outline" onclick="copyTaskDetail('${t.id}')">Copy text</button>
      <button class="btn btn-outline" onclick="closeForm();openForm('${t.id}')">${icon("edit", 14)} Edit</button>
    </div>
  </div>`;
}

function sectionsHtml(sections, emptyText) {
  const nonEmpty = sections.filter(s => s.tasks.length > 0);
  if (nonEmpty.length === 0) return `<p class="empty">${emptyText}</p>`;
  return nonEmpty.map(s =>
    (s.title ? `<h2 class="section-title">${esc(s.title)}</h2>` : "") +
    s.tasks.map(taskHtml).join("")
  ).join("");
}

function sortByDue(tasks) {
  return [...tasks].sort((a, b) => new Date(a.dueAt || 0) - new Date(b.dueAt || 0));
}

/* ---------- multi-day (range) tasks ---------- */
function isRangeTask(t) {
  return !!(t.dueAt && t.endDate && t.endDate !== dateKey(new Date(t.dueAt)));
}
/** วันเริ่ม/จบของ task (ทั้งคู่เป็น Date เที่ยงคืนของวันนั้น) — task ปกติ start=end=วันครบกำหนด */
function taskSpan(t) {
  if (!t.dueAt) return null;
  const start = startOfDay(new Date(t.dueAt));
  const end = t.endDate ? startOfDay(new Date(t.endDate + "T00:00:00")) : start;
  return end < start ? { start, end: start } : { start, end };
}
/** อ่านง่าย: "Aug 20" ปกติ, "Aug 20 – Aug 25" ถ้าเป็นช่วง */
function fmtSpanDate(d) {
  return MONTHS_SHORT[d.getMonth()] + " " + d.getDate();
}

/** ลิงก์ "Add to Google Calendar" แบบไม่ต้อง OAuth — เปิดฟอร์มสร้าง event ที่กรอกให้แล้ว
 *  - task หลายวัน หรือไม่ได้ตั้งเวลา → all-day (วันจบเป็น exclusive ตามสเปก Google)
 *  - task มีเวลา → event 1 ชั่วโมง ส่งเป็น UTC (ลงท้าย Z) กันปัญหา timezone */
function googleCalUrl(t) {
  if (!t.dueAt) return null;
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  const utc = d => d.toISOString().replace(/[-:]|\.\d{3}/g, "");
  const start = new Date(t.dueAt);
  const hasTime = start.getHours() !== 0 || start.getMinutes() !== 0;
  let dates;
  if (isRangeTask(t) || !hasTime) {
    const span = taskSpan(t);
    const endEx = new Date(span.end); endEx.setDate(endEx.getDate() + 1);
    dates = ymd(span.start) + "/" + ymd(endEx);
  } else {
    dates = utc(start) + "/" + utc(new Date(start.getTime() + 3600000));
  }
  const cat = catById(t.categoryId);
  const details = [t.note, cat ? "Category: " + cat.name : "", "— from Kodo"].filter(Boolean).join("\n\n");
  const p = new URLSearchParams({ action: "TEMPLATE", text: t.title, dates, details });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function fmtSpan(t) {
  const span = taskSpan(t);
  if (!span) return "";
  if (!isRangeTask(t)) return fmtDateTime(new Date(t.dueAt));
  return `${fmtSpanDate(span.start)} – ${fmtSpanDate(span.end)}`;
}

/* ---------- views ---------- */
let todayCat = null; // null = overview, "none" = no-category group, "ai" = หน้ารวมงาน AI, อื่นๆ = category id
// ค่าพิเศษสำหรับหน้ารวม AI — ตั้งชื่อให้ไม่มีทางตรงกับ id ที่ uid() สร้าง (timestamp+random)
// กันเคสไฟล์ backup ที่ import เข้ามามีหมวด id ตรงกันแล้วเปิดหมวดนั้นไม่ได้
const AI_HUB = "__ai_hub__";

/** หมวดที่ระบบสร้างให้งาน AI (หน้าแรกยุบรวมเป็นใบเดียว ไม่กระจายเต็มหน้า) */
function isAgentCategory(c) {
  return !!c && (c.name === AGENT_CAT_FALLBACK || c.name.startsWith(AGENT_CAT_PREFIX));
}
function agentCategories() { return activeCategories().filter(isAgentCategory); }
/** ชื่อโปรเจกต์ล้วนๆ (ตัด "AI · " ออก) */
function agentCatLabel(c) {
  return c.name.startsWith(AGENT_CAT_PREFIX) ? c.name.slice(AGENT_CAT_PREFIX.length) : c.name;
}

/** งานของ "วันนี้": เลยกำหนด(ยังไม่จบช่วง), ช่วง/วันนี้อยู่ในกำหนด, ไม่มีกำหนด, หรือเสร็จแล้ววันนี้ */
function todayTasksOf(catKey) {
  const todayStart = startOfDay(new Date());
  return state.tasks.filter(t => {
    const inCat = catKey === "none"
      ? (!t.categoryId || !catById(t.categoryId))
      : t.categoryId === catKey;
    if (!inCat) return false;
    if (t.status === "done") return t.doneAt && isToday(new Date(t.doneAt));
    if (!t.dueAt) return true;
    const span = taskSpan(t);
    return span.end < todayStart || (span.start <= todayStart && todayStart <= span.end);
  });
}

/** ตาราง 7 วันล่าสุด (จบที่วันนี้) — โชว์ว่าวันไหนเข้าแอพบ้าง */
function petWeekHtml() {
  const cells = [];
  const d = new Date();
  d.setDate(d.getDate() - 6);
  for (let i = 0; i < 7; i++) {
    const k = dateKey(d);
    const inDay = !!state.game.checkins[k];
    const today = isToday(d);
    cells.push(`<span class="pw-cell ${today ? "today" : ""}" title="${k}">
      <span class="pw-dow">${DOW[d.getDay()][0]}</span>
      <span class="pw-dot ${inDay ? "in" : ""}">${flameSvg(inDay ? 17 : 14, inDay)}</span>
      <span class="pw-num">${d.getDate()}</span>
    </span>`);
    d.setDate(d.getDate() + 1);
  }
  return `<div class="pet-week">${cells.join("")}</div>`;
}

/** มุมขวาบนของ hero: ชิป streak + รูปสัตว์เลี้ยง (กดเข้าหน้าสัตว์เลี้ยง — รายละเอียด XP/streak อยู่ในนั้น) */
function heroActionsHtml() {
  const { level } = levelInfo();
  const pet = petForLevel(level);
  const streak = currentStreak();
  return `<div class="hero-actions">
    <button class="hero-streak" onclick="openPet()" aria-label="${streak} day streak — open ${esc(pet.name)}">${flameSvg(16, streak > 0, streak > 0)} ${streak}</button>
    <button class="hero-pet ${justCheckedIn || justLeveled ? "bounce" : ""}" onclick="openPet()" aria-label="Open ${esc(pet.name)} · Lv ${level}">${petSvg(level)}</button>
  </div>`;
}

/** 7 วันล่าสุดเป็นวงกลมใหญ่ใน hero — วันที่เข้าแอพเป็นวงขาวมี ✓ */
function heroWeekHtml() {
  const cells = [];
  const d = new Date();
  d.setDate(d.getDate() - 6);
  for (let i = 0; i < 7; i++) {
    const k = dateKey(d);
    const inDay = !!state.game.checkins[k];
    const today = isToday(d);
    cells.push(`<span class="hw-day ${inDay ? "in" : ""} ${today ? "today" : ""}" title="${k}">
      <span class="hw-dow">${DOW[d.getDay()][0]}</span>
      <span class="hw-circle">${inDay ? icon("check", 16) : ""}</span>
      <span class="hw-num">${d.getDate()}</span>
    </span>`);
    d.setDate(d.getDate() + 1);
  }
  return `<div class="hero-week">${cells.join("")}</div>`;
}

/** วงแหวน progress (0-100) รอบไอคอน */
function ringSvg(pct, color) {
  const r = 17, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return `<svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
    <circle class="ring-track" cx="20" cy="20" r="${r}"/>
    <circle class="ring-fill" cx="20" cy="20" r="${r}" stroke="${color}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>
  </svg>`;
}

const MINI_LIMIT = 4;

function miniTaskHtml(t) {
  const due = t.dueAt ? new Date(t.dueAt) : null;
  const span = taskSpan(t);
  const isRange = isRangeTask(t);
  const overdue = t.status === "open" && span && span.end.getTime() < startOfDay(new Date()).getTime();
  const time = due
    ? (isRange ? fmtSpan(t) : (due.getHours() !== 0 || due.getMinutes() !== 0 ? fmtTime(due) : fmtDate(due)))
    : "";
  return `<button class="mini-task ${t.status === "done" ? "done" : ""} ${t.id === lastToggled ? "just-done" : ""}"
    onclick="toggleDone('${t.id}')"
    aria-label="${esc(t.title)} — ${t.status === "done" ? "done, press to reopen" : "press to mark as done"}">
    <span class="mini-dot">${t.status === "done" ? "✓" : ""}</span>
    <span class="mini-title">${esc(t.title)}
      ${time ? `<span class="mini-time ${overdue ? "overdue" : ""}">${overdue && due && !isRange ? fmtDateTime(due) : time}</span>` : ""}
    </span>
  </button>`;
}

function renderHome() {
  const d = new Date();
  if (todayCat !== null) return renderTodayDetail();

  // หมวดงาน AI ไม่กระจายเป็นใบๆ บนหน้าแรก — ยุบเป็นการ์ดเดียว กดเข้าไปเลือกโปรเจกต์ทีหลัง
  const groups = activeCategories().filter(c => !isAgentCategory(c))
    .map(c => ({ key: c.id, name: c.name, color: c.color, icon: c.icon || "tag" }));
  if (todayTasksOf("none").length) groups.push({ key: "none", name: "No category", color: "#94a3b8", icon: "tag" });

  // สรุปรวมด้านบน
  const allOpen = state.tasks.filter(t => t.status === "open");
  const overdueCount = allOpen.filter(t => t.dueAt && new Date(t.dueAt) < startOfDay(new Date())).length;
  const dueTodayCount = allOpen.filter(t => t.dueAt && isToday(new Date(t.dueAt))).length;
  const doneTodayCount = state.tasks.filter(t => t.status === "done" && t.doneAt && isToday(new Date(t.doneAt))).length;

  function buildCard(g, featured) {
    const tasks = todayTasksOf(g.key);
    const open = sortByDue(tasks.filter(t => t.status === "open"));
    const done = tasks.filter(t => t.status === "done");
    const total = open.length + done.length;
    const pct = total ? Math.round(done.length / total * 100) : 0;
    const limit = featured ? 6 : MINI_LIMIT;
    const shown = [...open, ...done].slice(0, limit);
    const moreCount = total - shown.length;
    const list = total === 0
      ? `<span class="mini-empty">No tasks today</span>`
      : shown.map(miniTaskHtml).join("") +
        (moreCount > 0 ? `<button class="mini-task" onclick="goCat('${g.key}')">
          <span class="mini-dot" style="border-style:dashed"></span>
          <span class="mini-title" style="color:var(--muted)">+${moreCount} more…</span></button>` : "");
    const cat = g.key !== "none" ? catById(g.key) : null;
    const nowBadge = featured
      ? `<span class="now-badge" style="background:${g.color}">● Now</span>` : "";
    const schedText = featured && cat ? `<span class="ov-sub" style="margin-left:auto">${scheduleSummary(cat)}</span>` : "";
    return `<div class="ov-card is-link ${featured ? "featured" : ""}" ${featured ? `style="border-color:${g.color}"` : ""} onclick="if(!event.target.closest('button,a,input,select,textarea,label')&&!textSelected())goCat('${g.key}')">
      <div class="ov-head">
        <span class="cat-ring">${ringSvg(pct, g.color)}<span class="cat-ico" style="background:color-mix(in srgb, ${g.color} 16%, var(--card));color:color-mix(in srgb, ${g.color} 55%, var(--fg))">${icon(g.icon, 14)}</span></span>
        <span class="name">${esc(g.name)}
          <span class="ov-sub" style="display:block;font-weight:600">${total ? `${done.length}/${total} done${pct === 100 ? " ✓" : ""}` : "No tasks today"}</span>
        </span>
        ${nowBadge}
        <button class="ov-more" aria-label="Open ${esc(g.name)}" onclick="goCat('${g.key}')">${icon("right", 14)}</button>
      </div>
      ${featured ? `<div style="display:flex">${schedText}</div>` : ""}
      ${total ? `<div class="mini-list">${list}</div>` : ""}
    </div>`;
  }

  // หมวดที่ "ถึงเวลา" ตอนนี้ → ชูเด่นอันเดียวด้านบน ที่เหลือต่อด้านล่าง
  const activeCat = activeCategories().find(scheduleActive);
  const featuredGroup = activeCat ? groups.find(g => g.key === activeCat.id) : null;
  const featuredHtml = featuredGroup ? buildCard(featuredGroup, true) : "";
  const cards = groups
    .filter(g => !featuredGroup || g.key !== featuredGroup.key)
    .map(g => buildCard(g, false)).join("");

  // การ์ดรวมงาน AI ใบเดียว — กดแล้วเข้าไปเลือกโปรเจกต์ที่หน้า AI hub
  const aiCats = agentCategories();
  let aiCardHtml = "";
  if (aiCats.length) {
    const aiTasks = aiCats.flatMap(c => allTasksOf(c.id));
    const aiDoneToday = aiTasks.filter(t => t.status === "done" && t.doneAt && isToday(new Date(t.doneAt))).length;
    const aiOpen = aiTasks.filter(t => t.status === "open").length;
    const sub = [
      `${aiCats.length} project${aiCats.length > 1 ? "s" : ""}`,
      aiDoneToday ? `${aiDoneToday} done today` : "",
      aiOpen ? `${aiOpen} open` : "",
    ].filter(Boolean).join(" · ");
    const pct = aiTasks.length ? Math.round(aiTasks.filter(t => t.status === "done").length / aiTasks.length * 100) : 0;
    aiCardHtml = `<div class="ov-card is-link" onclick="if(!event.target.closest('button,a,input,select,textarea,label')&&!textSelected())goCat('${AI_HUB}')">
      <div class="ov-head">
        <span class="cat-ring">${ringSvg(pct, AI_HUB_COLOR)}<span class="cat-ico" style="background:color-mix(in srgb, ${AI_HUB_COLOR} 16%, var(--card));color:color-mix(in srgb, ${AI_HUB_COLOR} 55%, var(--fg))">${icon(AGENT_CAT_ICON, 14)}</span></span>
        <span class="name">AI Work
          <span class="ov-sub" style="display:block;font-weight:600">${sub}</span>
        </span>
        <button class="ov-more" aria-label="Open AI Work" onclick="goCat('${AI_HUB}')">${icon("right", 14)}</button>
      </div>
    </div>`;
  }

  // กราฟ done 7 วันล่าสุด
  const weekAgo = startOfDay(new Date());
  weekAgo.setDate(weekAgo.getDate() - 6);
  const doneWeek = state.tasks.filter(t => t.status === "done" && t.doneAt && new Date(t.doneAt) >= weekAgo);
  const dayCounts = [];
  for (let i = 6; i >= 0; i--) {
    const day = startOfDay(new Date());
    day.setDate(day.getDate() - i);
    const k = dateKey(day);
    dayCounts.push({ label: DOW[day.getDay()][0], count: doneWeek.filter(t => dateKey(new Date(t.doneAt)) === k).length });
  }
  const maxCount = Math.max(1, ...dayCounts.map(x => x.count));
  const weekChart = dayCounts.map(x =>
    `<div class="week-col">
      <div class="week-bar ${x.count === 0 ? "zero" : ""}" style="height:${Math.round(x.count / maxCount * 100)}%"></div>
      <span class="week-label">${x.label}</span>
    </div>`).join("");

  // Daily Routine card — ติ๊กจากหน้านี้ จัดการรายการใน Settings
  const rtDoneCount = state.routines.filter(r => routineDone(r.id)).length;
  const rtPct = state.routines.length ? Math.round(rtDoneCount / state.routines.length * 100) : 0;
  const rtRows = state.routines.map(r => `
      <button class="mini-task ${routineDone(r.id) ? "done" : ""} ${r.id === lastToggled ? "just-done" : ""}" onclick="toggleRoutine('${r.id}')"
        aria-label="${esc(r.title)} — ${routineDone(r.id) ? "done today, press to undo" : "press to mark done today"}">
        <span class="mini-dot">${routineDone(r.id) ? "✓" : ""}</span>
        <span class="mini-title">${esc(r.title)}</span>
      </button>`).join("");
  const routineCard = `<div class="ov-card rt-card">
    <div class="ov-head">
      <span class="cat-ico" style="background:var(--primary-soft);color:var(--primary)">${icon("repeat", 15)}</span>
      <span class="name">Daily Routine</span>
      <span class="ov-sub">${state.routines.length ? `${rtDoneCount}/${state.routines.length} today` : ""}</span>
    </div>
    <div class="mini-list">
      ${rtRows || `<span class="mini-empty">No routines yet — add them in Settings › Daily Routines</span>`}
    </div>
    ${state.routines.length ? `<span class="ov-bar"><span style="width:${rtPct}%;background:var(--primary)"></span></span>` : ""}
  </div>`;

  // Tomorrow preview — เตรียมตัวสำหรับพรุ่งนี้
  const tmStart = startOfDay(new Date()); tmStart.setDate(tmStart.getDate() + 1);
  const tmEnd = new Date(tmStart); tmEnd.setDate(tmEnd.getDate() + 1);
  const tomorrowTasks = sortByDue(state.tasks.filter(t =>
    t.status === "open" && t.dueAt && new Date(t.dueAt) >= tmStart && new Date(t.dueAt) < tmEnd));
  const tomorrowCard = tomorrowTasks.length ? `<div class="ov-card rt-card tm-card">
    <div class="ov-head">
      <span class="cat-ico" style="background:color-mix(in srgb, #f97316 16%, var(--card));color:color-mix(in srgb, #f97316 55%, var(--fg))">${icon("sunrise", 15)}</span>
      <span class="name">Prepare for tomorrow</span>
      <span class="ov-sub">${tomorrowTasks.length} task${tomorrowTasks.length > 1 ? "s" : ""}</span>
    </div>
    <div class="mini-list">
      ${tomorrowTasks.slice(0, 4).map(t => {
        const due = new Date(t.dueAt);
        const cat = catById(t.categoryId);
        const timeLabel = isRangeTask(t) ? fmtSpan(t) : fmtTime(due);
        return `<div class="mini-task" style="cursor:default">
          <span class="mini-dot" style="border-style:dashed"></span>
          <span class="mini-title">${esc(t.title)}
            <span class="mini-time">${timeLabel}${cat ? " · " + esc(cat.name) : ""}</span>
          </span>
        </div>`;
      }).join("")}
      ${tomorrowTasks.length > 4 ? `<span class="mini-empty">+${tomorrowTasks.length - 4} more in Calendar</span>` : ""}
    </div>
  </div>` : "";

  // Checklists — โน้ตแบบติ๊กก่อนออกจากห้อง / เตรียมของ
  const checklistCards = state.checklists.map(cl => {
    const total = cl.items.length;
    const doneN = cl.items.filter(i => i.checked).length;
    const pct = total ? Math.round(doneN / total * 100) : 0;
    const rows = cl.items.map(i => `
      <div class="rt-row">
        <button class="mini-task ${i.checked ? "done" : ""} ${i.id === lastToggled ? "just-done" : ""}"
          onclick="toggleChecklistItem('${cl.id}','${i.id}')"
          aria-label="${esc(i.text)} — ${i.checked ? "checked, press to uncheck" : "press to check"}">
          <span class="mini-dot">${i.checked ? "✓" : ""}</span>
          <span class="mini-title">${esc(i.text)}</span>
        </button>
        <button class="rt-del" aria-label="Remove item ${esc(i.text)}" onclick="deleteChecklistItem('${cl.id}','${i.id}')">${icon("x", 12)}</button>
      </div>`).join("");
    const remChip = cl.reminder
      ? `<span class="ov-sub">${icon("bell", 10)} ${cl.reminder.days.length === 7 ? "Every day" : [...cl.reminder.days].sort((a,b)=>a-b).map(d => DOW[d]).join(" ")} · ${cl.reminder.time}</span>`
      : "";
    return `<div class="ov-card rt-card ${total && doneN === total ? "cl-complete" : ""}">
      <div class="ov-head">
        <span class="cat-ico" style="background:color-mix(in srgb, #0ea5e9 16%, var(--card));color:color-mix(in srgb, #0ea5e9 55%, var(--fg))">${icon("checksquare", 15)}</span>
        <span class="name">${esc(cl.title)}</span>
        ${total ? `<span class="ov-sub">${doneN}/${total}${doneN === total ? " ✓" : ""}</span>` : ""}
        <button class="ov-more" aria-label="Reset ${esc(cl.title)}" onclick="resetChecklist('${cl.id}')">${icon("refresh", 13)}</button>
        <button class="ov-more" aria-label="Edit ${esc(cl.title)}" onclick="openChecklistForm('${cl.id}')">${icon("edit", 13)}</button>
      </div>
      ${remChip ? `<div style="display:flex">${remChip}</div>` : ""}
      <div class="mini-list">
        ${rows || `<span class="mini-empty">Add the things to check off below</span>`}
        <form class="rt-add" onsubmit="addChecklistItemSubmit(event, '${cl.id}')">
          <label class="sr-only" for="clNew-${cl.id}">Add checklist item</label>
          <input id="clNew-${cl.id}" placeholder="Add an item, e.g. Keys, wallet, charger" maxlength="80">
          <button type="submit" aria-label="Add item">${icon("plus", 15)}</button>
        </form>
      </div>
      ${total ? `<span class="ov-bar"><span style="width:${pct}%;background:#0ea5e9"></span></span>` : ""}
    </div>`;
  }).join("");
  const newChecklistBtn = `<button class="ov-card rt-card cl-new" onclick="openChecklistForm('new')">
    ${icon("plus", 15)} New checklist — e.g. Before leaving the room
  </button>`;

  const g = greeting();
  const firstName = user?.name ? esc(user.name.split(" ")[0]) : "";
  return `<section class="hero">
      <div class="hero-top">
        <div class="hero-date">${icon(g.icon, 15)} ${DOW[d.getDay()]}, ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}</div>
        ${heroActionsHtml()}
      </div>
      <h1 class="hero-title"><span class="soft">${g.text},</span><br>${firstName ? `${firstName}, ` : ""}you're doing <b>great!</b></h1>
      ${heroWeekHtml()}
    </section>
    <div class="sheet-body">
    <div class="stat-row">
      <div class="stat-card">
        <span class="stat-ico" style="background:color-mix(in srgb, #ef4444 14%, var(--card));color:var(--danger-text)">${icon("bell", 13)}</span>
        <div class="stat-num ${overdueCount ? "danger" : ""}">${overdueCount}</div><div class="stat-label">Overdue</div>
      </div>
      <div class="stat-card">
        <span class="stat-ico" style="background:var(--primary-soft);color:var(--primary)">${icon("calendar", 13)}</span>
        <div class="stat-num">${dueTodayCount}</div><div class="stat-label">Due today</div>
      </div>
      <div class="stat-card">
        <span class="stat-ico" style="background:color-mix(in srgb, #10b981 14%, var(--card));color:var(--success)">${icon("checksquare", 13)}</span>
        <div class="stat-num success">${doneTodayCount}</div><div class="stat-label">Done today</div>
      </div>
    </div>
    ${featuredHtml ? `<h2 class="section-title">Right now</h2><div class="ov-grid">${featuredHtml}</div>` : ""}
    <h2 class="section-title">Daily routine</h2>
    <div class="ov-grid">${routineCard}</div>
    <h2 class="section-title">Checklists</h2>
    <div class="ov-grid">${checklistCards}${newChecklistBtn}</div>
    <h2 class="section-title">${featuredHtml ? "Other categories" : "By category"}</h2>
    <div class="ov-grid">${cards}${aiCardHtml}</div>
    ${tomorrowCard ? `<h2 class="section-title">Tomorrow</h2><div class="ov-grid">${tomorrowCard}</div>` : ""}
    <h2 class="section-title">Completed — last 7 days</h2>
    <div class="card"><div class="week-chart">${weekChart}</div></div>
    </div>`;
}

/** เมื่อกดเข้าหมวดหมู่จาก Home: "today" = เฉพาะที่เกี่ยวกับวันนี้ (ค่าตั้งต้นเดิม), "all" = ทุก task ในหมวดไม่ว่าวันไหน */
let todayDetailScope = "all";
function allTasksOf(catKey) {
  return state.tasks.filter(t => catKey === "none" ? (!t.categoryId || !catById(t.categoryId)) : t.categoryId === catKey);
}
/** รวมความเปลี่ยนแปลงของทั้งโปรเจกต์ แยกเป็น เพิ่ม / ปรับปรุง / แก้บั๊ก (ใหม่สุดก่อน)
 *  งานเก่าที่ยังไม่มีหัวข้อ -> เอาชื่องานมาเป็น 1 รายการ แล้วเดาประเภทจากคำขึ้นต้น */
function projectChanges(catId) {
  const groups = { added: [], changed: [], fixed: [] };
  const when = t => t.doneAt || t.dueAt || t.createdAt || "";
  const tasks = allTasksOf(catId).slice().sort((a, b) => when(b).localeCompare(when(a)));
  for (const t of tasks) {
    const p = parseAgentNote(t.note);
    const at = when(t);
    if (p.added.length + p.changed.length + p.fixed.length) {
      for (const k of ["added", "changed", "fixed"]) for (const text of p[k]) groups[k].push({ text, task: t, at });
    } else {
      groups[guessChangeKind(t.title)].push({ text: t.title, task: t, at });
    }
  }
  return groups;
}

const CHANGES_PER_KIND = 6;
// กลุ่มที่ผู้ใช้กด "ดูทั้งหมด" ไว้ (ขยายในหน้าเดิม ไม่ต้องไปไล่หาใน task)  key = `${catId}:${kind}`
let psExpanded = {};
function togglePsGroup(catId, kind) {
  const k = catId + ":" + kind;
  psExpanded[k] = !psExpanded[k];
  render();
}

/** หน้าสรุปโปรเจกต์ AI หน้าเดียว: แอปมีอะไรบ้าง -> เพิ่มอะไร -> ปรับอะไร -> แก้บั๊กอะไร
 *  รายละเอียดเชิงลึกของแต่ละข้อ กดเข้าไปอ่านใน task ต้นทาง */
function projectSummaryHtml(cat) {
  if (!cat || !isAgentCategory(cat)) return "";
  // ---- 1) ภาพรวม: แอปนี้มีอะไรบ้าง ----
  const ov = Array.isArray(cat.overview) ? cat.overview.filter(Boolean) : [];
  const manual = String(cat.note || "").trim();
  const ovBody = ov.length
    ? `<ul class="ps-list">${ov.map(x => `<li>${topicHtml(x)}</li>`).join("")}</ul>`
    : `<div class="cat-note-body auto">ยังไม่มีภาพรวม — Claude จะเติมให้ตอนบันทึกงานครั้งถัดไป</div>`;
  const overviewCard = `<div class="cat-note">
    <div class="cat-note-head">${icon("doc", 13)} What's in this app<span class="spacer"></span>
      ${ov.length || manual ? `<button class="link-primary" style="font-size:.78rem" onclick="copyOverview('${cat.id}')">Copy</button>` : ""}
      <button class="link-primary" style="font-size:.78rem" onclick="openCatNote('${cat.id}')">${manual ? "Edit note" : "+ Note"}</button>
    </div>
    ${ovBody}
    ${manual ? `<div class="ps-mynote"><b>My note</b>${esc(manual)}</div>` : ""}
    ${cat.overviewAt ? `<div class="cat-note-meta">Overview updated ${fmtDate(new Date(cat.overviewAt))}</div>` : ""}
  </div>`;

  // ---- 2) ความเปลี่ยนแปลง ----
  const groups = projectChanges(cat.id);
  const total = groups.added.length + groups.changed.length + groups.fixed.length;
  const sections = CHANGE_KINDS.filter(k => groups[k.key].length).map(k => {
    const items = groups[k.key];
    const expanded = !!psExpanded[cat.id + ":" + k.key];
    const rows = (expanded ? items : items.slice(0, CHANGES_PER_KIND)).map(it => `
      <div class="ps-item" role="button" tabindex="0" onclick="if(!textSelected())openTaskDetail('${it.task.id}')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTaskDetail('${it.task.id}')}"
        aria-label="${esc(k.label)}: ${esc(it.text)} — open task">
        <span class="ps-dot" style="background:${k.color}"></span>
        <span class="ps-text">${topicHtml(it.text)}</span>
        <span class="ps-date">${it.at ? fmtDate(new Date(it.at)) : ""}</span>
      </div>`).join("");
    const more = items.length > CHANGES_PER_KIND
      ? `<button class="ps-more" onclick="togglePsGroup('${cat.id}','${k.key}')">${expanded ? "Show less" : `Show all (+${items.length - CHANGES_PER_KIND})`}</button>` : "";
    return `<div class="ps-group">
      <div class="ps-kind" style="color:color-mix(in srgb, ${k.color} 70%, var(--fg))">${k.label} <span>${items.length}</span></div>
      ${rows}${more}
    </div>`;
  }).join("");
  const changesCard = `<div class="cat-note">
    <div class="cat-note-head">${icon("repeat", 13)} Changes<span class="spacer"></span>
      <span class="cat-note-meta" style="margin:0">Newest first · tap for details</span>
      ${total ? `<button class="link-primary" style="font-size:.78rem" onclick="copyChanges('${cat.id}')">Copy</button>` : ""}
    </div>
    ${total ? sections : `<div class="cat-note-body auto">ยังไม่มีบันทึกการเปลี่ยนแปลง</div>`}
  </div>`;

  return overviewCard + changesCard;
}

function copyOverview(catId) {
  const cat = catById(catId);
  if (!cat) return;
  const ov = Array.isArray(cat.overview) ? cat.overview.filter(Boolean) : [];
  const note = String(cat.note || "").trim();
  const lines = [`What's in this app — ${agentCatLabel(cat)}`, ...ov.map(x => "• " + x)];
  if (note) lines.push("", "My note:", note);
  copyText(lines.join("\n"), "overview");
}

function copyChanges(catId) {
  const cat = catById(catId);
  if (!cat) return;
  const groups = projectChanges(cat.id);
  const lines = [`Changes — ${agentCatLabel(cat)}`];
  for (const k of CHANGE_KINDS) {
    if (!groups[k.key].length) continue;
    lines.push("", k.label);
    for (const it of groups[k.key]) lines.push(`• ${it.text}${it.at ? " (" + dateKey(new Date(it.at)) + ")" : ""}`);
  }
  copyText(lines.join("\n"), "changes");
}

function copyTaskDetail(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const p = parseAgentNote(t.note);
  const lines = [t.title];
  if (p.time) lines.push("Time spent: " + p.time.replace(/^⏱\s*/, ""));
  // วันที่จริง (ไม่ใช่ "Today") เพราะข้อความจะถูกเอาไปวางที่อื่น/วันอื่น
  if (t.status === "done" && t.doneAt) { const d = new Date(t.doneAt); lines.push("Finished: " + dateKey(d) + " " + d.toTimeString().slice(0, 5)); }
  for (const k of CHANGE_KINDS) {
    if (!p[k.key].length) continue;
    lines.push("", k.label, ...p[k.key].map(x => "• " + x));
  }
  if (p.details) lines.push("", "Details", p.details);
  copyText(lines.join("\n"), "task details");
}

function openCatNote(catId) {
  const cat = catById(catId);
  if (!cat) return;
  const label = isAgentCategory(cat) ? agentCatLabel(cat) : cat.name;
  document.getElementById("modal").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeForm()">
    <div class="sheet" role="dialog" aria-label="Project note">
      <div class="sheet-head">
        <h2>${esc(label)}</h2>
        <button class="x-btn" aria-label="Close" onclick="closeForm()">✕</button>
      </div>
      <label class="fld">My note — เป้าหมาย / สิ่งที่ค้าง / อะไรที่อยากจำ
        <textarea id="catNoteInput" rows="7" maxlength="4000" placeholder="เช่น ค้าง human GUI check ก่อน merge">${esc(cat.note || "")}</textarea>
      </label>
      <p class="hint" style="margin:-.35rem 0 .75rem">ภาพรวม "What's in this app" Claude อัปเดตให้เองตอนบันทึกงาน · เว้นโน้ตว่างไว้ = ไม่แสดง</p>
      <button class="btn btn-primary" onclick="saveCatNote('${cat.id}')">Save</button>

  </div>`;

function saveCatNote(catId) {
  const cat = catById(catId);
  const el = document.getElementById("catNoteInput");
  if (!cat || !el) return;
  const v = el.value.trim();
  cat.note = v;
  cat.noteAt = v ? new Date().toISOString() : null;
  save(); closeForm(); render();
}

/** หน้ารวมงาน AI — เลือกโปรเจกต์ก่อน แล้วค่อยเข้าไปดูงานของโปรเจกต์นั้น */
function renderAiHub() {
  const rows = agentCategories().map(c => {
    const tasks = allTasksOf(c.id);
    const done = tasks.filter(t => t.status === "done").length;
    // งานล่าสุดของโปรเจกต์ ใช้จัดเรียงและโชว์ว่าแตะล่าสุดเมื่อไหร่
    let last = null;
    for (const t of tasks) {
      const d = t.doneAt || t.dueAt || t.createdAt;
      if (d && (!last || d > last)) last = d;
    }
    return { cat: c, total: tasks.length, done, last };
  }).sort((a, b) => (b.last || "").localeCompare(a.last || ""));

  const totalTasks = rows.reduce((n, r) => n + r.total, 0);
  const cards = rows.map(r => {
    const pct = r.total ? Math.round(r.done / r.total * 100) : 0;
    const sub = [
      `${r.total} task${r.total > 1 ? "s" : ""}`,
      r.last ? fmtDate(new Date(r.last)) : "",
    ].filter(Boolean).join(" · ");
    return `<div class="ov-card is-link" onclick="if(!event.target.closest('button,a,input,select,textarea,label')&&!textSelected())goCat('${r.cat.id}')">
      <div class="ov-head">
        <span class="cat-ring">${ringSvg(pct, r.cat.color)}<span class="cat-ico" style="background:color-mix(in srgb, ${r.cat.color} 16%, var(--card));color:color-mix(in srgb, ${r.cat.color} 55%, var(--fg))">${icon(r.cat.icon || AGENT_CAT_ICON, 14)}</span></span>
        <span class="name">${esc(agentCatLabel(r.cat))}
          <span class="ov-sub" style="display:block;font-weight:600">${sub}</span>
        </span>
        <button class="ov-more" aria-label="Open ${esc(agentCatLabel(r.cat))}" onclick="goCat('${r.cat.id}')">${icon("right", 14)}</button>
      </div>
    </div>`;
  }).join("");

  return `<button class="back-btn" onclick="goHome()">${icon("left", 15)} Home</button>
    <div class="page-head" style="margin-bottom:.5rem">
      <h1 class="cat-head" style="font-size:1.25rem">
        <span class="cat-ico" style="background:color-mix(in srgb, ${AI_HUB_COLOR} 16%, var(--card));color:color-mix(in srgb, ${AI_HUB_COLOR} 55%, var(--fg))">${icon(AGENT_CAT_ICON, 15)}</span>
        AI Work</h1>
    </div>
    <p class="hint" style="margin:0 0 .9rem">${rows.length} project${rows.length > 1 ? "s" : ""} · ${totalTasks} task${totalTasks > 1 ? "s" : ""} — เลือกโปรเจกต์เพื่อดูงานทั้งหมด</p>
    ${rows.length ? `<div class="ov-grid">${cards}</div>` : `<p class="empty">ยังไม่มีงานจาก AI</p>`}`;
}

function renderTodayDetail() {
  // ถ้าบังเอิญมีหมวดจริง id ตรงกับค่าพิเศษ ให้หมวดจริงชนะ จะได้ไม่มีหมวดไหนเปิดไม่ได้
  if (todayCat === AI_HUB && !catById(AI_HUB)) return renderAiHub();
  const isNone = todayCat === "none";
  const cat = isNone ? null : catById(todayCat);
  if (!isNone && !cat) { todayCat = null; return renderToday(); }
  const name = isNone ? "No category" : cat.name;
  const color = isNone ? "var(--muted)" : cat.color;

  // มาจากหน้ารวม AI ก็ให้ย้อนกลับไปหน้ารวม ไม่ใช่เด้งกลับหน้าแรก
  const fromAi = !isNone && isAgentCategory(cat);
  // โปรเจกต์ย่อย: เฉพาะหมวดปกติ (หมวด AI แต่ละหมวดเป็นโปรเจกต์อยู่แล้ว)
  const projects = !isNone && !fromAi ? catProjects(cat) : [];
  const proj = todayProject ? projects.find(p => p.id === todayProject) || null : null;
  if (todayProject && !proj) todayProject = null;   // โปรเจกต์ถูกลบ/ไม่อยู่ในหมวดนี้ -> กลับหน้าหมวด

  let tasks = todayDetailScope === "today" ? todayTasksOf(todayCat) : allTasksOf(todayCat);
  // หน้าโปรเจกต์ = เฉพาะงานของโปรเจกต์นั้น / หน้าหมวดที่มีโปรเจกต์ = เฉพาะงานที่ไม่อยู่ในโปรเจกต์ไหน
  if (proj) tasks = tasks.filter(t => t.projectId === proj.id);
  else if (projects.length) tasks = tasks.filter(t => !projectOf(t));
  const open = sortByDue(tasks.filter(t => t.status === "open"));
  const done = sortByDue(tasks.filter(t => t.status === "done")).reverse();

  const catIcon = isNone ? "tag" : (cat.icon || "tag");
  const scopeToggle = `<div class="cal-seg" role="tablist" style="margin-bottom:.75rem">
    ${["today", "all"].map(s => `<button role="tab" aria-selected="${todayDetailScope === s}"
      class="cal-seg-btn ${todayDetailScope === s ? "sel" : ""}"
      onclick="todayDetailScope='${s}';render()">${s === "today" ? "Today" : "All"}</button>`).join("")}
  </div>`;
  const emptyMsg = proj
    ? (todayDetailScope === "today" ? "Nothing due today in this project" : "No tasks in this project yet")
    : projects.length
      ? (todayDetailScope === "today" ? "No other tasks due today" : "No tasks outside the projects")
      : (todayDetailScope === "today" ? "Nothing due today in this category" : "No tasks in this category yet");
  const backBtn = proj
    ? `<button class="back-btn" onclick="goCat('${cat.id}')">${icon("left", 15)} ${esc(name)}</button>`
    : fromAi
      ? `<button class="back-btn" onclick="goCat('${AI_HUB}')">${icon("left", 15)} AI Work</button>`
      : `<button class="back-btn" onclick="goHome()">${icon("left", 15)} Home</button>`;
  const headColor = proj ? proj.color : color;
  const headAction = proj
    ? `<span class="head-actions"><button class="edit-btn" aria-label="Rename project" onclick="openProjectForm('${cat.id}', '${proj.id}')">${icon("edit", 15)}</button>
        <button class="edit-btn" aria-label="Delete project" onclick="deleteProject('${cat.id}', '${proj.id}')">${icon("trash", 15)}</button></span>`
    : fromAi
      ? `<button class="edit-btn" aria-label="Delete project" onclick="deleteAgentProject('${cat.id}')">${icon("trash", 15)}</button>`
    : (!isNone && !fromAi && !projects.length
        ? `<button class="link-primary" style="font-size:.8rem" onclick="openProjectForm('${cat.id}')">+ Project</button>` : "");
  // การ์ดโปรเจกต์ (แบบเดียวกับหน้ารวม AI) — นับจากงานทั้งหมดของโปรเจกต์ ไม่ขึ้นกับปุ่ม Today/All
  const projCards = !proj && projects.length ? projects.map(p => {
    const pts = allTasksOf(cat.id).filter(t => t.projectId === p.id);
    const doneN = pts.filter(t => t.status === "done").length;
    const pct = pts.length ? Math.round(doneN / pts.length * 100) : 0;
    const sub = pts.length ? `${pts.length - doneN} open · ${pts.length} task${pts.length > 1 ? "s" : ""}` : "No tasks yet";
    return `<div class="ov-card is-link" onclick="if(!event.target.closest('button,a,input,select,textarea,label')&&!textSelected())openProject('${cat.id}', '${p.id}')">
      <div class="ov-head">
        <span class="cat-ring">${ringSvg(pct, p.color)}<span class="cat-ico" style="background:color-mix(in srgb, ${p.color} 16%, var(--card));color:color-mix(in srgb, ${p.color} 55%, var(--fg))">${icon("folder", 14)}</span></span>
        <span class="name">${esc(p.name)}
          <span class="ov-sub" style="display:block;font-weight:600">${sub}</span>
        </span>
        <button class="ov-more" aria-label="Open project ${esc(p.name)}" onclick="openProject('${cat.id}', '${p.id}')">${icon("right", 14)}</button>
      </div>
    </div>`;
  }).join("") : "";
  const projSection = projCards ? `<div class="proj-head">
      <h2 class="section-title" style="margin:0">Projects</h2>
      <button class="link-primary" style="font-size:.8rem" onclick="openProjectForm('${cat.id}')">+ New project</button>
    </div>
    <div class="ov-grid" style="margin-bottom:1.1rem">${projCards}</div>
    <h2 class="section-title" style="margin:0 0 .6rem">Other tasks</h2>` : "";
  return `${backBtn}
    <div class="page-head" style="margin-bottom:.5rem">
      <h1 class="cat-head" style="font-size:1.25rem">
        <span class="cat-ico" style="background:color-mix(in srgb, ${headColor} 16%, var(--card));color:color-mix(in srgb, ${headColor} 55%, var(--fg))">${icon(proj ? "folder" : catIcon, 15)}</span>
        ${esc(proj ? proj.name : fromAi ? agentCatLabel(cat) : name)}</h1>
      ${headAction}
    </div>
    ${proj ? `<p class="hint" style="margin:-.2rem 0 .8rem">Project in ${esc(name)}</p>` : ""}
    ${fromAi ? projectSummaryHtml(cat) : ""}
    ${projSection}
    ${scopeToggle}
    ${open.length === 0 && done.length === 0 ? `<p class="empty">${emptyMsg}</p>` : ""}
    ${open.map(t => taskHtml(t, true)).join("")}
    ${done.length ? `<h2 class="section-title">Done</h2>` + done.map(t => taskHtml(t, true)).join("") : ""}`;
}

/* ---------- Google Calendar -> Kodo (อ่านอย่างเดียว ไม่มี server) ----------
   ใช้ Google Identity Services (token model) ขอสิทธิ์ calendar.readonly จากเบราว์เซอร์โดยตรง แล้วดึง event มาโชว์ในหน้า Calendar
   - ไม่เขียนอะไรกลับไปที่ Google และไม่เก็บ event ลง state/cloud (ดึงสดเมื่อเปิดหน้า Calendar)
   - access token อายุ ~1 ชม. เก็บใน sessionStorage (ปิดแท็บ = หาย); หมดอายุแล้วกด Refresh ครั้งเดียว (ไม่ต้องอนุญาตซ้ำ)
   - "เปิดใช้บนเครื่องนี้" เก็บใน localStorage (ค่าต่อเครื่อง ไม่ sync) */
const GREAD_CLIENT_ID = "655578671934-vpqfkq6sqi3f6m6m9h5k27efddfp1vcj.apps.googleusercontent.com";
const GREAD_SCOPE = "https://www.googleapis.com/auth/calendar.readonly";
// ผูกกับบัญชี Kodo (stateKey) ไม่ใช่ทั้งเครื่อง — ใช้เบราว์เซอร์ร่วมกันแล้วคนถัดไปจะไม่เห็นปฏิทินของคนก่อน
const greadOnKey = () => "kodo-gcal-read:" + stateKey;
const greadTokenKey = () => "kodo-gcal-token:" + stateKey;
// ค่าจาก V6.1 ที่เคยผูกทั้งเครื่อง -> ลบทิ้ง (ต้องกด Connect ใหม่ในบัญชีตัวเอง)
try { localStorage.removeItem("kodo-gcal-read"); sessionStorage.removeItem("kodo-gcal-token"); } catch { /* ignore */ }
const GREAD_TTL = 5 * 60 * 1000;          // ดึงช่วงเดิมซ้ำได้หลัง 5 นาที
const GREAD_MAX_CALENDARS = 15;
let greadSeq = 0;   // เลขประจำ event (ใช้ใน onclick แทน id จาก Google ที่อาจมีอักขระพิเศษ)
const gread = { gen: 0, acct: "", token: "", exp: 0, client: null, gis: null, cache: new Map(), busy: false, error: "", lastKey: "" };

function greadOn() { try { return localStorage.getItem(greadOnKey()) === "1"; } catch { return false; } }
/** ล้างทุกอย่างของ Google Calendar ที่อยู่ในหน่วยความจำ (เปลี่ยนบัญชี / sign out) */
function greadReset() {
  gread.token = ""; gread.exp = 0; gread.cache.clear(); gread.error = ""; gread.acct = stateKey;
  gread.busy = false;
  gread.gen++;   // งานที่ค้างอยู่ (fetch/popup) ของบัญชีเดิมจะเห็นว่า gen เปลี่ยนแล้วทิ้งผลลัพธ์
}
/** งานนี้ยังเป็นของบัญชี/รอบปัจจุบันไหม (ใช้หลัง await ทุกครั้ง) */
const greadStill = (gen, acct) => gen === gread.gen && acct === stateKey;
function greadToken() {
  if (gread.acct !== stateKey) greadReset();
  if (gread.token && Date.now() < gread.exp) return gread.token;
  try {
    const t = JSON.parse(sessionStorage.getItem(greadTokenKey()) || "null");
    if (t && typeof t.token === "string" && t.exp > Date.now()) { gread.token = t.token; gread.exp = t.exp; return t.token; }
  } catch { /* ignore */ }
  return "";
}
function loadGis() {
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  if (!gread.gis) {
    gread.gis = new Promise((resolve, reject) => {
      const sc = document.createElement("script");
      sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
      sc.onload = () => window.google?.accounts?.oauth2 ? resolve() : reject(new Error("GIS unavailable"));
      sc.onerror = () => { gread.gis = null; reject(new Error("GIS load failed")); };
      document.head.appendChild(sc);
    });
  }
  return gread.gis;
}

/** ขอ token — ต้องเรียกจากการกดปุ่มโดยตรง (หน้าต่าง Google เป็น popup เบราว์เซอร์จะบล็อกถ้าไม่ได้มาจากการกด) */
function greadAuthorize(firstTime) {
  if (!window.google?.accounts?.oauth2) {
    showToast("⏳ Loading Google… tap again in a moment");
    loadGis().catch(() => showToast("❌ Couldn't reach Google — check your connection"));
    return;
  }
  if (!gread.client) {
    gread.client = google.accounts.oauth2.initTokenClient({ client_id: GREAD_CLIENT_ID, scope: GREAD_SCOPE, callback: () => {} });
  }
  // ผูกผลลัพธ์กับบัญชีที่กด Connect — ถ้าระหว่างรอ popup มีการเปลี่ยนบัญชี/sign out ให้ทิ้ง (และเพิกถอน) token นั้น
  const gen = gread.gen, acct = stateKey;
  gread.client.callback = (resp) => {
    if (!greadStill(gen, acct)) {
      if (resp && resp.access_token) google.accounts.oauth2.revoke(resp.access_token, () => {});
      return;
    }
    if (resp.error || !resp.access_token) { gread.error = resp.error_description || resp.error || "denied"; render(); return; }
    if (!google.accounts.oauth2.hasGrantedAllScopes(resp, GREAD_SCOPE)) {
      gread.error = "Calendar access wasn't granted"; render(); return;
    }
    gread.acct = acct;
    gread.token = resp.access_token;
    gread.exp = Date.now() + (Number(resp.expires_in || 3600) - 60) * 1000;
    try { sessionStorage.setItem(greadTokenKey(), JSON.stringify({ token: gread.token, exp: gread.exp })); } catch { /* ignore */ }
    try { localStorage.setItem(greadOnKey(), "1"); } catch { /* ignore */ }
    gread.error = ""; gread.cache.clear();
    if (firstTime) showToast("📅 Google Calendar connected");
    render();
  };
  gread.client.error_callback = (err) => {
    if (!greadStill(gen, acct)) return;
    // ผู้ใช้ปิดหน้าต่างเอง = ไม่ใช่ error ที่ต้องโวยวาย
    if (err?.type !== "popup_closed") { gread.error = err?.type === "popup_failed_to_open" ? "Popup blocked — allow popups for this site" : "Couldn't connect to Google"; render(); }
  };
  gread.client.requestAccessToken({ prompt: firstTime ? "select_account consent" : "" });
}
function greadConnect() { greadAuthorize(!greadOn()); }
function greadDisconnect() {
  const tok = greadToken();
  if (tok && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(tok, () => {});
  greadReset();   // ทิ้งงานที่ค้างอยู่ด้วย ไม่ให้ fetch ที่ยังไม่เสร็จเอา event กลับมาใส่หลังตัดการเชื่อม
  try { sessionStorage.removeItem(greadTokenKey()); localStorage.removeItem(greadOnKey()); } catch { /* ignore */ }
  showToast("Google Calendar disconnected");
  render();
}

/** เรียก Calendar API ด้วย token ที่ระบุ (ของรอบที่เริ่มงาน ไม่ใช่ token ปัจจุบัน — กันใช้ token บัญชีใหม่กับงานของบัญชีเดิม) */
async function greadApi(path, tok) {
  const r = await fetch("https://www.googleapis.com/calendar/v3" + path, { headers: { Authorization: "Bearer " + tok } });
  if (r.status === 401) {
    // ล้างเฉพาะถ้า token ที่หมดอายุยังเป็นตัวปัจจุบันอยู่
    if (gread.token === tok) { gread.token = ""; gread.exp = 0; try { sessionStorage.removeItem(greadTokenKey()); } catch {} }
    throw new Error("expired");
  }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
const greadColor = (c) => typeof c === "string" && /^#[0-9a-f]{3,8}$/i.test(c) ? c : "#4285f4";

/** ดึง event ของช่วง [start, end) — cache ต่อช่วง แล้ว render ใหม่เมื่อได้ข้อมูล */
async function greadEnsure(start, end) {
  if (!greadOn() || !greadToken() || gread.busy) return;
  const key = dateKey(start) + "_" + dateKey(end);
  const c = gread.cache.get(key);
  if (c && Date.now() - c.at < GREAD_TTL) return;
  const gen = gread.gen, acct = stateKey, tok = greadToken();
  gread.busy = true;
  try {
    const list = await greadApi("/users/me/calendarList?minAccessRole=reader&fields=items(id,summary,summaryOverride,backgroundColor,selected,hidden,primary)", tok);
    if (!greadStill(gen, acct)) return;
    const cals = (list.items || []).filter(x => x.selected !== false && !x.hidden).slice(0, GREAD_MAX_CALENDARS);
    const q = `timeMin=${encodeURIComponent(start.toISOString())}&timeMax=${encodeURIComponent(end.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=250&fields=nextPageToken,items(id,summary,start,end,location,description,htmlLink,status,attendees(self,responseStatus))`;
    // ตามหน้า (nextPageToken) — ช่วง 6 สัปดาห์ของปฏิทินที่มี event ซ้ำเยอะอาจเกิน 250; จำกัด 4 หน้า/ปฏิทิน
    const fetchCal = async (cal) => {
      const items = []; let token = "";
      for (let page = 0; page < 4; page++) {
        if (!greadStill(gen, acct)) break;
        const r = await greadApi(`/calendars/${encodeURIComponent(cal.id)}/events?${q}${token ? "&pageToken=" + encodeURIComponent(token) : ""}`, tok);
        items.push(...(r.items || []));
        if (!r.nextPageToken) break;
        token = r.nextPageToken;
      }
      return { cal, items };
    };
    const results = await Promise.all(cals.map(cal => fetchCal(cal).catch(err => {
      if (err.message === "expired") throw err;   // token หมด -> ให้ทั้งรอบจบแบบ paused
      return { cal, items: [] };                   // ปฏิทินเดียวพัง ปฏิทินอื่นยังโชว์
    })));
    if (!greadStill(gen, acct)) return;   // เปลี่ยนบัญชีระหว่างโหลด -> ทิ้งผลของบัญชีเดิม
    const events = [];
    for (const { cal, items } of results) {
      for (const e of items) {
        if (e.status === "cancelled" || !e.start) continue;
        // event ที่เราตอบปฏิเสธแล้วไม่ต้องโชว์
        if (Array.isArray(e.attendees) && e.attendees.some(a => a && a.self && a.responseStatus === "declined")) continue;
        const allDay = !!e.start.date && !e.start.dateTime;
        const st = allDay ? new Date(e.start.date + "T00:00:00") : new Date(e.start.dateTime);
        // วันเต็ม: end.date เป็นวันถัดจากวันสุดท้าย (exclusive)
        const en = allDay ? new Date(new Date((e.end?.date || e.start.date) + "T00:00:00").getTime() - 1) : new Date(e.end?.dateTime || e.start.dateTime);
        if (isNaN(st) || isNaN(en)) continue;
        events.push({
          n: ++greadSeq, uid: cal.id + "|" + e.id, title: String(e.summary || "(No title)"), start: st, end: en, allDay,
          color: greadColor(cal.backgroundColor), calName: String(cal.summaryOverride || cal.summary || "Google Calendar"),
          location: String(e.location || ""), description: String(e.description || ""),
          link: typeof e.htmlLink === "string" && /^https:\/\/(www\.)?google\.com\/calendar\//.test(e.htmlLink) ? e.htmlLink : "",
        });
      }
    }
    events.sort((a, b) => (a.allDay === b.allDay ? a.start - b.start : a.allDay ? -1 : 1));
    gread.cache.set(key, { at: Date.now(), events });
    gread.lastKey = key; gread.error = "";
  } catch (err) {
    if (greadStill(gen, acct)) gread.error = err.message === "expired" ? "" : "Couldn't load Google events";
  } finally {
    if (greadStill(gen, acct)) gread.busy = false;   // รอบใหม่ reset busy ของตัวเองแล้ว
  }
  if (greadStill(gen, acct) && currentTab === "calendar") render();
}
/** event แยกตามวัน (event หลายวันอยู่ทุกวันที่ครอบคลุม) ของช่วงที่ cache ไว้ */
function greadByDay(start, end) {
  const c = gread.cache.get(dateKey(start) + "_" + dateKey(end));
  const out = {};
  if (!c) return out;
  for (const ev of c.events) {
    const d = startOfDay(ev.start); let n = 0;
    while (d <= ev.end && n < 62) { (out[dateKey(d)] = out[dateKey(d)] || []).push(ev); d.setDate(d.getDate() + 1); n++; }
  }
  return out;
}
function greadTime(ev) {
  if (ev.allDay) return "All day";
  const same = dateKey(ev.start) === dateKey(ev.end);
  return same ? `${fmtTime(ev.start)}–${fmtTime(ev.end)}` : `${fmtTime(ev.start)} →`;
}
function greadItemHtml(ev) {
  return `<div class="gev" role="button" tabindex="0" onclick="if(!textSelected())openGEvent(${ev.n})"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openGEvent(${ev.n})}">
    <span class="cal-dot" style="background:${ev.color}"></span>
    <span class="gev-title">${esc(ev.title)}</span>
    <span class="gev-time">${greadTime(ev)}</span>
  </div>`;
}
function openGEvent(n) {
  let ev = null;
  for (const c of gread.cache.values()) { ev = c.events.find(x => x.n === Number(n)); if (ev) break; }
  if (!ev) return;
  // คำอธิบายจาก Google อาจเป็น HTML -> เอาแต่ข้อความ
  const desc = new DOMParser().parseFromString(ev.description.replace(/<br\s*\/?>|<\/(p|div|li)>/gi, "\n"), "text/html")
    .body.textContent.replace(/\n{3,}/g, "\n\n").trim().slice(0, 2000);
  const when = ev.allDay
    ? (dateKey(ev.start) === dateKey(ev.end) ? fmtDate(ev.start) : `${fmtDate(ev.start)} – ${fmtDate(ev.end)}`) + " · All day"
    : `${fmtDateTime(ev.start)} – ${dateKey(ev.start) === dateKey(ev.end) ? fmtTime(ev.end) : fmtDateTime(ev.end)}`;
  document.getElementById("modal").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeForm()">
    <div class="sheet" role="dialog" aria-label="Google Calendar event">
      <div class="sheet-head">
        <h2 style="overflow-wrap:anywhere">${esc(ev.title)}</h2>
        <button class="x-btn" aria-label="Close" onclick="closeForm()">✕</button>
      </div>
      <div class="detail-chips"><span class="chip" style="background:color-mix(in srgb, ${ev.color} 16%, var(--card));color:color-mix(in srgb, ${ev.color} 55%, var(--fg))">${icon("calendar", 10)} ${esc(ev.calName)}</span></div>
      <div class="detail-row"><span class="k">When</span><span>${when}</span></div>
      ${ev.location ? `<div class="detail-row"><span class="k">Where</span><span style="overflow-wrap:anywhere">${esc(ev.location)}</span></div>` : ""}
      ${desc ? `<div class="detail-note" style="margin-top:.6rem">${esc(desc)}</div>` : ""}
      <p class="hint" style="margin:.7rem 0">From Google Calendar — view only. Edit it in Google Calendar.</p>
      ${ev.link ? `<a class="btn btn-outline" href="${esc(ev.link)}" target="_blank" rel="noopener" style="text-decoration:none">${icon("calendar", 14)} Open in Google Calendar</a>` : ""}
    </div>
  </div>`;
}
/** แถบสถานะบนหน้า Calendar (เชื่อมแล้วแต่ token หมด / กำลังโหลด / error) */
function greadBar() {
  if (!greadOn()) return "";
  if (!window.google?.accounts?.oauth2) loadGis().catch(() => {});
  if (!greadToken()) {
    return `<div class="gread-bar">${icon("calendar", 13)}<span>Google Calendar events are paused</span>
      <button class="link-primary" onclick="greadAuthorize(false)">Refresh</button></div>`;
  }
  if (gread.error) return `<div class="gread-bar err">${icon("calendar", 13)}<span>${esc(gread.error)}</span>
      <button class="link-primary" onclick="gread.cache.clear();gread.error='';render()">Retry</button></div>`;
  if (gread.busy && !gread.cache.size) return `<div class="gread-bar">${icon("calendar", 13)}<span>Loading Google Calendar…</span></div>`;
  return "";
}

function renderCalendar() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1);
  const gridStart = new Date(first);
  gridStart.setDate(1 - first.getDay());

  // เตรียม map วัน -> tasks (เฉพาะที่มี due) — งานแบบช่วงวัน (range) จะถูกใส่ในทุกวันที่ครอบคลุม ไม่ใช่แค่วันเริ่ม
  const byDay = {};
  const MAX_SPAN_DAYS = 60; // กันช่วงวันยาวผิดปกติทำให้ค้าง
  for (const t of state.tasks) {
    if (!t.dueAt) continue;
    const span = taskSpan(t);
    const d = new Date(span.start);
    let n = 0;
    while (d <= span.end && n < MAX_SPAN_DAYS) {
      const k = dateKey(d);
      (byDay[k] = byDay[k] || []).push(t);
      d.setDate(d.getDate() + 1);
      n++;
    }
  }

  const selDate = new Date(calSelected + "T00:00:00");
  // ช่วงที่ดึงจาก Google = ตารางเดือน 6 สัปดาห์ของเดือนที่กำลังดู (week/day ใช้เดือนของวันที่เลือก)
  const gBase = calMode === "month" ? calMonth : new Date(selDate.getFullYear(), selDate.getMonth(), 1);
  const gStart = new Date(gBase.getFullYear(), gBase.getMonth(), 1); gStart.setDate(1 - gStart.getDay());
  const gEnd = new Date(gStart); gEnd.setDate(gEnd.getDate() + 42);
  greadEnsure(gStart, gEnd);
  const gByDay = greadOn() ? greadByDay(gStart, gEnd) : {};
  const gList = (k) => gByDay[k] || [];
  const gSection = (k) => gList(k).length
    ? `<h2 class="section-title gsec">${icon("calendar", 14)} Google Calendar</h2>${gList(k).map(greadItemHtml).join("")}` : "";
  const seg = `<div class="cal-seg" role="tablist">
    ${["day", "week", "month"].map(mo =>
      `<button role="tab" aria-selected="${calMode === mo}" class="cal-seg-btn ${calMode === mo ? "sel" : ""}"
        onclick="calMode='${mo}';render()">${mo[0].toUpperCase() + mo.slice(1)}</button>`).join("")}
  </div>`;

  /* ----- Month ----- */
  if (calMode === "month") {
    let cells = "";
    const d = new Date(gridStart);
    for (let i = 0; i < 42; i++) {
      const k = dateKey(d);
      const inMonth = d.getMonth() === m;
      const dayTasks = sortByDue(byDay[k] || []);
      // ชื่องานแบบย่อในช่อง (2 รายการแรก)
      const items = [
        ...dayTasks.map(t => { const cat = catById(t.categoryId); return { title: t.title, col: cat ? cat.color : "#94a3b8", g: false }; }),
        ...gList(k).map(ev => ({ title: ev.title, col: ev.color, g: true })),
      ];
      const labels = items.slice(0, 2).map(it =>
        `<span class="cal-lbl ${it.g ? "g" : ""}" style="background:color-mix(in srgb, ${it.col} 18%, var(--card));color:color-mix(in srgb, ${it.col} 58%, var(--fg))">${esc(it.title)}</span>`).join("");
      cells += `<button class="cal-day ${inMonth ? "" : "other"} ${isToday(d) ? "today" : ""} ${k === calSelected ? "sel" : ""}"
        onclick="calSelected='${k}';render()">
        <span class="cal-num">${d.getDate()}</span>
        ${labels}${items.length > 2 ? `<span class="cal-more">+${items.length - 2}</span>` : ""}
      </button>`;
      d.setDate(d.getDate() + 1);
    }
    const selTasks = sortByDue(byDay[calSelected] || []);
    return `<div class="page-head"><h1>Calendar</h1>${seg}</div>
      ${greadBar()}
      <div class="cal-head">
        <button class="cal-nav" aria-label="Previous month" onclick="calShift(-1)">${icon("left")}</button>
        <span class="cal-title"><h2>${MONTHS[m]} ${y}</h2>${calTodayBtn()}</span>
        <button class="cal-nav" aria-label="Next month" onclick="calShift(1)">${icon("right")}</button>
      </div>
      <div class="cal-grid month">
        ${DOW.map(dw => `<span class="cal-dow">${dw}</span>`).join("")}
        ${cells}
      </div>
      <h2 class="section-title">${fmtDate(selDate)}</h2>
      ${selTasks.length ? selTasks.map(taskHtml).join("") : gList(calSelected).length ? "" : `<p class="empty-sm">No tasks on this day</p>`}
      ${gSection(calSelected)}`;
  }

  /* ----- Week ----- */
  if (calMode === "week") {
    const weekStart = new Date(selDate);
    weekStart.setDate(weekStart.getDate() - weekStart.getDay());
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);
    let rows = "";
    const d = new Date(weekStart);
    for (let i = 0; i < 7; i++) {
      const k = dateKey(d);
      const dayTasks = sortByDue(byDay[k] || []);
      rows += `<div class="wk-row ${isToday(d) ? "today" : ""}">
        <button class="wk-date" onclick="calSelected='${k}';calMode='day';render()">
          <span class="wk-dow">${DOW[d.getDay()]}</span>
          <span class="wk-num">${d.getDate()}</span>
        </button>
        <div class="wk-list">
          ${[
            // งานกับ event จาก Google เรียงรวมกันตามเวลา (ทั้งวัน/ช่วงหลายวันขึ้นก่อน)
            ...dayTasks.map(t => {
              const cat = catById(t.categoryId);
              const col = cat ? cat.color : "#94a3b8";
              const due = new Date(t.dueAt);
              const label = isRangeTask(t) ? fmtSpan(t) : fmtTime(due);
              return { top: isRangeTask(t), at: due.getHours() * 60 + due.getMinutes(),
                html: `<button class="wk-item ${t.status === "done" ? "done" : ""}" onclick="toggleDone('${t.id}')">
              <span class="cal-dot" style="background:${col}"></span>
              <span class="wk-title">${esc(t.title)}</span>
              <span class="wk-time">${label}</span>
            </button>` };
            }),
            ...gList(k).map(ev => ({ top: ev.allDay, at: ev.allDay ? 0 : ev.start.getHours() * 60 + ev.start.getMinutes(),
              html: `<button class="wk-item gev-wk" onclick="openGEvent(${ev.n})">
              <span class="cal-dot" style="background:${ev.color}"></span>
              <span class="wk-title">${esc(ev.title)}</span>
              <span class="wk-time">${ev.allDay ? "All day" : fmtTime(ev.start)}</span>
            </button>` })),
          ].sort((a, b) => (b.top - a.top) || (a.at - b.at)).map(x => x.html).join("")}
          ${!dayTasks.length && !gList(k).length ? `<span class="mini-empty">—</span>` : ""}
        </div>
      </div>`;
      d.setDate(d.getDate() + 1);
    }
    return `<div class="page-head"><h1>Calendar</h1>${seg}</div>
      ${greadBar()}
      <div class="cal-head">
        <button class="cal-nav" aria-label="Previous week" onclick="calShiftDays(-7)">${icon("left")}</button>
        <span class="cal-title"><h2>${weekStart.getDate()} ${MONTHS_SHORT[weekStart.getMonth()]} – ${weekEnd.getDate()} ${MONTHS_SHORT[weekEnd.getMonth()]}</h2>${calTodayBtn()}</span>
        <button class="cal-nav" aria-label="Next week" onclick="calShiftDays(7)">${icon("right")}</button>
      </div>
      ${rows}`;
  }

  /* ----- Day ----- */
  const dayTasks = sortByDue(byDay[calSelected] || []);
  const openT = dayTasks.filter(t => t.status === "open");
  const doneT = dayTasks.filter(t => t.status === "done");
  return `<div class="page-head"><h1>Calendar</h1>${seg}</div>
    ${greadBar()}
    <div class="cal-head">
      <button class="cal-nav" aria-label="Previous day" onclick="calShiftDays(-1)">${icon("left")}</button>
      <span class="cal-title"><h2>${fmtDate(selDate)} · ${selDate.getDate()} ${MONTHS_SHORT[selDate.getMonth()]}</h2>${calTodayBtn()}</span>
      <button class="cal-nav" aria-label="Next day" onclick="calShiftDays(1)">${icon("right")}</button>
    </div>
    ${dayTasks.length === 0 && !gList(calSelected).length ? `<p class="empty-sm">No tasks on this day</p>` : ""}
    ${openT.map(t => taskHtml(t)).join("")}
    ${doneT.length ? `<h2 class="section-title">Done</h2>` + doneT.map(t => taskHtml(t)).join("") : ""}
    ${gSection(calSelected)}`;
}

function calShift(n) {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + n, 1);
  render();
}
function calToday() {
  calSelected = dateKey(new Date());
  calMonth = startOfMonth(new Date());
  render();
}
/** ปุ่มกลับวันนี้ — โชว์เมื่อเลื่อนออกไปจากวันปัจจุบัน */
function calTodayBtn() {
  const now = new Date();
  const off = calSelected !== dateKey(now) ||
    calMonth.getMonth() !== now.getMonth() || calMonth.getFullYear() !== now.getFullYear();
  return off ? `<button class="cal-today-btn" onclick="calToday()">Today</button>` : "";
}
function calShiftDays(n) {
  const d = new Date(calSelected + "T00:00:00");
  d.setDate(d.getDate() + n);
  calSelected = dateKey(d);
  calMonth = startOfMonth(d);
  render();
}

function renderAll() {
  const filtered = allFilter ? state.tasks.filter(t => t.categoryId === allFilter) : state.tasks;
  const open = sortByDue(filtered.filter(t => t.status === "open"));
  const done = filtered.filter(t => t.status === "done");
  const options = activeCategories().map(c =>
    `<option value="${c.id}" ${allFilter === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("");
  return `<div class="page-head">
      <h1>All Tasks</h1>
      <select class="filter-sel" onchange="allFilter=this.value;render()">
        <option value="">All categories</option>${options}
      </select>
    </div>` + sectionsHtml([
      { title: "Open", tasks: open },
      { title: "Done", tasks: done },
    ], "No tasks yet");
}

/** ช่องกรอกมีไอคอนนำหน้า (+ ปุ่มโชว์/ซ่อนถ้าเป็นรหัสผ่าน) */
function icField(iconName, inputHtml, withToggle) {
  return `<div class="ic-field${withToggle ? " has-toggle" : ""}">
    <span class="ic-lead">${icon(iconName, 16)}</span>
    ${inputHtml}
    ${withToggle ? `<button type="button" class="ic-toggle" aria-label="Show password" onclick="togglePwd(this)">${icon("eye", 16)}</button>` : ""}
  </div>`;
}
function togglePwd(btn) {
  const input = btn.previousElementSibling;
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  btn.innerHTML = icon(showing ? "eye" : "eyeOff", 16);
  btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
}

  // บล็อบสีโค้งมนเต็มจอ (สไตล์เดียวกับ reference) แต่ใช้โทนสีของแอพเราเอง — ปรับตามธีมกลางวัน/กลางคืนอัตโนมัติผ่าน CSS var

function render() {
  const nav = document.querySelector("nav");
  const fabEl = document.getElementById("fabBtn");
  if (!user) {
    document.getElementById("view").innerHTML = renderLogin();
    nav.style.display = "none";
    fabEl.style.display = "none";
    return;
  }
  nav.style.display = "";
  const view = document.getElementById("view");
  if (petView) {
    view.innerHTML = renderPetPage();
    fabEl.style.display = "none";
    if (viewTransition) {
      viewTransition = false;
      view.classList.remove("anim"); void view.offsetWidth; view.classList.add("anim");
    }
    return;
  }
  const tab = TABS.find(t => t[0] === currentTab);
  view.innerHTML = tab[3]();
  // เล่น view transition เฉพาะตอนเปลี่ยนหน้า ไม่ใช่ทุกการติ๊ก
  if (viewTransition) {
    viewTransition = false;
    view.classList.remove("anim");
    void view.offsetWidth;
    view.classList.add("anim");
  } else {
    view.classList.remove("anim");
  }
  document.getElementById("navBar").innerHTML = TABS.map(([id, ico, label]) =>
    `<button class="nav-btn ${id === currentTab ? "active" : ""}" onclick="switchTab('${id}')"
      aria-current="${id === currentTab ? "page" : "false"}">
      <span class="ico">${icon(ico, 20)}</span><span class="lbl">${label}</span></button>`).join("");
  document.getElementById("fabBtn").style.display =
    currentTab === "settings" ? "none" : "";
  // โหลด Google Identity Services ล่วงหน้า — ปุ่ม Connect เปิดใช้เมื่อพร้อม (popup ต้องเปิดภายใต้การกดของผู้ใช้ทันที)
  if (currentTab === "settings") {
    renderColorPick();
    if (!window.google?.accounts?.oauth2) loadGis().then(() => { if (currentTab === "settings") render(); }).catch(() => {});
  }
}

function switchTab(id) {
  currentTab = id;
  // ออกจากหน้า pet ก่อน (ยกเว้นกำลังจับเวลาอยู่ — ให้จับต่อเบื้องหลังไม่ได้ เลยกันสลับพลาดด้วย confirm)
  if (petView === "running") {
    if (!confirm("Leave the focus session? It will be cancelled.")) return;
    clearInterval(focusTimer); focusTimer = null; focusEndsAt = null;
  }
  petView = null;
  viewTransition = true;
  render();
}

/* ---------- category ops ---------- */
function addCategory() {
  const input = document.getElementById("newCatName");
  const name = input.value.trim();
  if (!name) return;
  state.categories.push({ id: uid(), name, color: newCatColor, icon: newCatIcon });
  save(); render();
}
function deleteCategory(id) {
  if (!confirm("Delete this category? Its tasks will be kept without a category.")) return;
  state.categories = state.categories.filter(c => c.id !== id);
  state.tasks.forEach(t => { if (t.categoryId === id) { t.categoryId = null; t.projectId = null; } });
  save(); render();
}

/* ---------- form modal ---------- */
function openForm(taskId) {
  const t = taskId ? state.tasks.find(x => x.id === taskId) : null;
  // ถ้าเปิดจากหน้า calendar และเป็น task ใหม่ ให้ default วันที่เป็นวันที่เลือกไว้
  let defaultDue = "";
  if (!t && currentTab === "calendar") {
    const d = new Date(calSelected + "T09:00:00");
    defaultDue = toInputValue(d);
  }
  // งานเดิมที่ตั้งเวลาไว้ตรงเที่ยงคืนพอดี ถือว่าไม่ได้ตั้งเวลาไว้ (เข้ากับ heuristic ของ fmtDateTime)
  const hasTimeInit = t && t.dueAt
    ? (new Date(t.dueAt).getHours() !== 0 || new Date(t.dueAt).getMinutes() !== 0)
    : true;
  const dueInputVal = t && t.dueAt ? toInputValue(new Date(t.dueAt)) : defaultDue;
  const formCats = activeCategories();
  if (t && t.categoryId && !formCats.some(c => c.id === t.categoryId)) {
    const cur = catById(t.categoryId);
    if (cur) formCats.push(cur); // หมวดที่ปิดอยู่แต่ task นี้ยังสังกัด
  }
  const catOpts = `<option value="">No category</option>` + formCats.map(c => {
    const sel = t ? t.categoryId === c.id
      : (currentTab === "home" && todayCat === c.id); // เปิดจากหน้า detail → default หมวดนั้น
    return `<option value="${c.id}" ${sel ? "selected" : ""}>${esc(c.name)}</option>`;
  }).join("");
  // หมวด/โปรเจกต์เริ่มต้น: งานเดิมใช้ของงาน, งานใหม่ที่เปิดจากหน้าหมวด/โปรเจกต์ใช้หน้านั้น
  const initCat = t ? t.categoryId : (currentTab === "home" ? todayCat : null);
  const initProj = t ? t.projectId : (currentTab === "home" && initCat === todayCat ? todayProject : null);
  const projOpts = projectOptionsHtml(initCat, initProj);
  const remOpts = REMINDER_OPTIONS.map(([v, l]) =>
    `<option value="${v}" ${t && String(t.reminderMin ?? "") === v ? "selected" : ""}>${l}</option>`).join("");
  const recOpts = Object.entries(RECURRENCE_LABELS).map(([v, l]) =>
    `<option value="${v}" ${t && t.recurrence === v ? "selected" : ""}>${l}</option>`).join("");
  document.getElementById("modal").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeForm()">
    <div class="sheet">
      <div class="sheet-head">
        <h2>${t ? "Edit Task" : "New Task"}</h2>
        <button class="x-btn" aria-label="Close" onclick="closeForm()">✕</button>
      </div>
      <form onsubmit="submitForm(event, '${taskId || ""}')">
        <label class="fld">What needs to be done?
          <input id="fTitle" required value="${t ? esc(t.title) : ""}" placeholder="e.g. Send report">
        </label>
        <label class="fld">Notes (optional)
          <textarea id="fNote" rows="2">${t ? esc(t.note || "") : ""}</textarea>
        </label>
        <div class="row2">
          <label class="fld">Category<select id="fCat" onchange="refreshFormProjects()">${catOpts}</select></label>
          <label class="fld"><span id="fDueLabelText">${t?.endDate ? "Start date" : "Due date"}</span>
            <input type="${hasTimeInit ? "datetime-local" : "date"}" id="fDue" value="${hasTimeInit ? dueInputVal : dueInputVal.slice(0, 10)}" onkeydown="submitOnEnter(event)">
          </label>
        </div>
        <label class="fld" id="fProjWrap" style="display:${projOpts ? "" : "none"}">Project
          <select id="fProj">${projOpts}</select>
        </label>
        <label class="fld-check">
          <input type="checkbox" id="fTimeOn" ${hasTimeInit ? "checked" : ""} onchange="toggleFormTime()">
          Include time
        </label>
        <label class="fld-check">
          <input type="checkbox" id="fRangeOn" ${t?.endDate ? "checked" : ""} onchange="toggleFormRange()">
          Multi-day task (spans a date range)
        </label>
        <label class="fld" id="fEndWrap" style="display:${t?.endDate ? "" : "none"}">End date
          <input type="date" id="fEnd" value="${t?.endDate || ""}" onkeydown="submitOnEnter(event)">
        </label>
        <div class="row2">
          <label class="fld">Reminder<select id="fRem">${remOpts}</select></label>
          <label class="fld">Repeat<select id="fRec">${recOpts}</select></label>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        ${t && t.dueAt ? `<a class="btn btn-outline" href="${esc(googleCalUrl(t))}" target="_blank" rel="noopener" style="text-decoration:none">${icon("calendar", 15)} Add to Google Calendar</a>` : ""}
        ${t ? `<button type="button" class="btn btn-danger-outline" onclick="deleteTask('${t.id}')">Delete Task</button>` : ""}
      </form>
    </div>
  </div>`;
  setTimeout(() => document.getElementById("fTitle")?.focus(), 50);
}

/** ตัวเลือกโปรเจกต์ของหมวด ("" = หมวดนี้ไม่มีโปรเจกต์ -> ซ่อนช่อง) */
function projectOptionsHtml(catId, selId) {
  const ps = catProjects(catById(catId));
  if (!ps.length) return "";
  return `<option value="">No project</option>` + ps.map(p =>
    `<option value="${p.id}" ${p.id === selId ? "selected" : ""}>${esc(p.name)}</option>`).join("");
}
/** เปลี่ยนหมวดในฟอร์ม -> เปลี่ยนรายการโปรเจกต์ตาม (โปรเจกต์ของหมวดเก่าใช้ต่อไม่ได้) */
function refreshFormProjects() {
  const sel = document.getElementById("fProj");
  const html = projectOptionsHtml(document.getElementById("fCat").value, sel.value);
  sel.innerHTML = html;
  document.getElementById("fProjWrap").style.display = html ? "" : "none";
}

/** สลับ Due date ระหว่างมีเวลา (datetime-local) กับไม่มีเวลา (date) โดยคงวันที่เดิมไว้ */
function toggleFormTime() {
  const on = document.getElementById("fTimeOn").checked;
  const dueEl = document.getElementById("fDue");
  const cur = dueEl.value;
  if (!cur) { dueEl.type = on ? "datetime-local" : "date"; return; }
  if (on) {
    dueEl.type = "datetime-local";
    dueEl.value = cur.length === 10 ? cur + "T09:00" : cur;
  } else {
    dueEl.type = "date";
    dueEl.value = cur.slice(0, 10);
  }
}

/** สลับโหมด multi-day: โชว์/ซ่อนช่อง End date + เปลี่ยน label ช่องแรกเป็น "Start date" */
function toggleFormRange() {
  const on = document.getElementById("fRangeOn").checked;
  document.getElementById("fEndWrap").style.display = on ? "" : "none";
  document.getElementById("fDueLabelText").textContent = on ? "Start date" : "Due date";
  if (on && !document.getElementById("fEnd").value) {
    // ตั้งค่าเริ่มต้น End date = วันเดียวกับ Due date ให้กรอกต่อง่ายๆ
    const dueVal = document.getElementById("fDue").value;
    if (dueVal) document.getElementById("fEnd").value = dueVal.slice(0, 10);
  }
}

function closeForm() {
  const modal = document.getElementById("modal");
  const ov = modal.querySelector(".overlay:not(.closing)");
  if (!ov || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) { modal.innerHTML = ""; return; }
  // เล่นท่าปิดแล้วค่อยลบ — ถ้าระหว่างนั้นมี sheet ใหม่มาแทน (innerHTML ถูกเขียนทับ) ตัวเก่าหลุดจาก DOM ไปเอง ไม่ต้องลบซ้ำ
  ov.classList.add("closing");
  if (ov.contains(document.activeElement)) document.activeElement.blur();   // ไม่ให้โฟกัสค้างอยู่ใน sheet ที่กำลังปิด
  ov.inert = true;
  setTimeout(() => { if (ov.isConnected) ov.remove(); }, 170);
}

function submitForm(e, taskId) {
  e.preventDefault();
  const title = document.getElementById("fTitle").value.trim();
  if (!title) return;
  const dueRaw = document.getElementById("fDue").value;
  const timeOn = document.getElementById("fTimeOn").checked;
  const remRaw = document.getElementById("fRem").value;
  const rangeOn = document.getElementById("fRangeOn").checked;
  const endRaw = rangeOn ? document.getElementById("fEnd").value : "";
  if (rangeOn && endRaw && dueRaw && endRaw < dueRaw.slice(0, 10)) {
    showToast("❌ End date can't be before the start date");
    return;
  }
  const categoryId = document.getElementById("fCat").value || null;
  const projRaw = document.getElementById("fProj").value;
  const data = {
    title,
    note: document.getElementById("fNote").value.trim(),
    categoryId,
    // เก็บเฉพาะโปรเจกต์ที่อยู่ในหมวดที่เลือกจริง
    projectId: projRaw && catProjects(catById(categoryId)).some(p => p.id === projRaw) ? projRaw : null,
    dueAt: dueRaw ? new Date(timeOn ? dueRaw : dueRaw + "T00:00:00").toISOString() : null,
    endDate: (rangeOn && dueRaw && endRaw) ? endRaw : null,
    reminderMin: remRaw === "" ? null : Number(remRaw),
    recurrence: document.getElementById("fRec").value,
  };
  if (taskId) {
    const t = state.tasks.find(x => x.id === taskId);
    Object.assign(t, data, { notifiedAt: null });
  } else {
    state.tasks.push({
      ...data, id: uid(), status: "open", doneAt: null, notifiedAt: null,
      createdAt: new Date().toISOString(),
    });
  }
  save(); closeForm(); render();
}

function deleteTask(id) {
  if (!confirm("Delete this task?")) return;
  state.tasks = state.tasks.filter(t => t.id !== id);
  save(); closeForm(); render();
}

/* ---------- notifications (while page is open) ---------- */
function enableNotify() {
  Notification.requestPermission().then(() => render());
}
function checkReminders() {
  if (!("Notification" in window) || Notification.permission !== "granted" || state.meta.notifOff) return;
  const now = Date.now();
  let fired = false;
  for (const t of state.tasks) {
    if (t.status !== "open" || !t.dueAt || t.reminderMin == null || t.notifiedAt) continue;
    const remindAt = new Date(t.dueAt).getTime() - t.reminderMin * 60000;
    if (remindAt <= now) {
      new Notification("⏰ " + t.title, { body: "Due " + fmtDateTime(new Date(t.dueAt)) });
      t.notifiedAt = new Date().toISOString();
      fired = true;
    }
  }
  // checklist ที่ตั้งเวลาไว้: ถึงเวลา → รีเซ็ตรายการ + แจ้งเตือนให้ไล่ติ๊ก
  {
    const now2 = new Date();
    const t2 = String(now2.getHours()).padStart(2, "0") + ":" + String(now2.getMinutes()).padStart(2, "0");
    const k2 = dateKey(now2);
    for (const cl of state.checklists) {
      if (!cl.reminder || !cl.reminder.days.includes(now2.getDay())) continue;
      if (t2 < cl.reminder.time) continue;
      if (cl.lastNotified === k2) continue;
      cl.items.forEach(i => { i.checked = false; });
      cl.lastNotified = k2;
      new Notification("✅ " + cl.title, {
        body: cl.items.length
          ? `${cl.items.length} things to check: ` + cl.items.slice(0, 4).map(i => i.text).join(", ") + (cl.items.length > 4 ? "…" : "")
          : "Time to run through your checklist",
      });
      fired = true;
    }
  }
  // สรุปงานพรุ่งนี้ทุกเย็น (หลัง 18:00 วันละครั้ง) — เตรียมตัวล่วงหน้า
  const todayKey = dateKey(new Date());
  if (new Date().getHours() >= 18 && state.meta.lastDigest !== todayKey) {
    const tmStart = startOfDay(new Date()); tmStart.setDate(tmStart.getDate() + 1);
    const tmEnd = new Date(tmStart); tmEnd.setDate(tmEnd.getDate() + 1);
    const tomorrow = state.tasks
      .filter(t => t.status === "open" && t.dueAt && new Date(t.dueAt) >= tmStart && new Date(t.dueAt) < tmEnd)
      .sort((a, b) => new Date(a.dueAt) - new Date(b.dueAt));
    if (tomorrow.length) {
      const titles = tomorrow.slice(0, 3).map(t => t.title).join(", ");
      new Notification(`📋 Tomorrow: ${tomorrow.length} task${tomorrow.length > 1 ? "s" : ""}`, {
        body: titles + (tomorrow.length > 3 ? ` +${tomorrow.length - 3} more` : "") +
          ` — first at ${fmtTime(new Date(tomorrow[0].dueAt))}`,
      });
    }
    state.meta.lastDigest = todayKey;
    fired = true;
  }
  // เซฟเฉพาะเมื่อมีการเปลี่ยนแปลงจริง — กันแท็บเก่าที่เปิดค้างเขียนทับข้อมูลใหม่
  if (fired) save();
}

/* ---------- export / import ---------- */
function exportData() {
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  const name = `kodo-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios && typeof File === "function" && navigator.canShare) {
    const file = new File([json], name, { type: "application/json" });
    if (navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "Kodo backup" }).catch(() => {});
      return;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.tasks) || !Array.isArray(data.categories)) throw new Error("bad format");
      if (!confirm(`Import ${data.tasks.length} tasks and ${data.categories.length} categories? Current data will be replaced.`)) return;
      // รับทุก field (รวม routines / checklists / pet-XP) — migrate เติมส่วนที่ไฟล์เก่าไม่มี
      const imported = migrate(data);
      for (const k of ["categories", "tasks", "routines", "routineLog", "checklists", "game", "meta", "journal", "pets"]) {
        state[k] = imported[k];
      }
      save(); render();
      alert("Import complete ✅");
    } catch (e) {
      alert("Invalid file — must be a Kodo (or Solo Task) export");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

/* ---------- init ---------- */
// Esc ปิด modal + focus trap ภายใน sheet
document.addEventListener("keydown", (e) => {
  const overlay = document.querySelector(".overlay:not(.closing)");   // sheet ที่กำลังปิดไม่นับ
  if (!overlay) return;
  if (e.key === "Escape") { closeForm(); return; }
  if (e.key === "Tab") {
    const focusables = [...overlay.querySelectorAll("input, select, textarea, button")]
      .filter(el => !el.disabled && el.offsetParent !== null);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  }
});

// ถ้าแท็บอื่นแก้ข้อมูล ให้ sync ตาม
window.addEventListener("storage", (e) => {
  if (e.key !== stateKey || !e.newValue) return;
  try {
    const data = JSON.parse(e.newValue);
    state.categories = data.categories;
    state.tasks = data.tasks;
    render();
  } catch { /* ข้อมูลไม่ถูกต้อง ไม่ต้องทำอะไร */ }
});

applyTheme();
initCloud(); // เชื่อม Supabase ถ้าตั้งค่าไว้ (async — local โหลดไปก่อน)
const fab = document.getElementById("fabBtn");
fab.innerHTML = icon("plus", 26);
fab.onclick = () => {
  // ปุ่ม + ทำตามบริบท: หน้า Pets = เพิ่มสัตว์เลี้ยง/record, หน้าอื่น = เพิ่ม task
  if (currentTab === "pets" && !petView) {
    if (petsView) openRecordForm(petsView, "", petsRecFilter || "checkup");
    else openPetForm();
    return;
  }
  openForm(null);
};
render();
new MutationObserver(() => hydratePets()).observe(document.body, { childList: true, subtree: true });
hydratePets();
// กลับมาที่แท็บแล้ววิวสดหยุดอยู่ (ซ่อนแท็บ = หยุด loop ประหยัดแบต) -> เดินต่อ
document.addEventListener("visibilitychange", () => {
  const L = pet3d.live;
  if (!document.hidden && L && L.canvas.isConnected && !L.running) { L.running = true; requestAnimationFrame(livePetFrame); }
});
checkReminders();
setTimeout(autoCheckin, 1400); // เปิดแอพ (หลัง splash) = check-in วันนี้อัตโนมัติ

// splash แบบเปิดแอพมือถือ แล้วค่อยเผยหน้า login/home
{
  const splash = document.getElementById("splash");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const delay = reduced ? 150 : 1100;
  setTimeout(() => {
    splash.classList.add("hide");
    setTimeout(() => splash.remove(), 400);
  }, delay);
}
</script>
