const AGENT_CAT_PREFIX = "AI · ";
const AGENT_CAT_FALLBACK = "AI Work";   // แถวที่ไม่ได้ระบุโปรเจกต์
const AGENT_CAT_ICON = "chart";
const AGENT_CAT_LEGACY_COLOR = "#ec4899";   // สีที่ V4.9 ใช้ตอนสร้างหมวด "AI Work" อัตโนมัติ
const AI_HUB_COLOR = "#6366f1";             // สีการ์ด/หัวข้อของหน้ารวมงาน AI
const AGENT_CAT_MAX = 20;               // กันหมวดงอกไม่สิ้นสุดถ้า project เพี้ยน
// ชื่อเก่า/ชื่อโฟลเดอร์ของโปรเจกต์ -> ชื่อปัจจุบัน (แอปนี้เปลี่ยนชื่อจาก Solo Task / Task Studio เป็น Kodo)
// hook อัตโนมัติตั้งชื่อโปรเจกต์จากชื่อโฟลเดอร์ ("Task_Studio") จึงต้องรวมเข้าหมวดเดียวกันด้วย
const PROJECT_ALIASES = { "solo task": "Kodo", "task studio": "Kodo", "task_studio": "Kodo" };

function canonicalProject(project) {
  const p = String(project || "").trim();
  return PROJECT_ALIASES[p.toLowerCase()] || p;
}

/** หมวดของโปรเจกต์นั้น — หาไม่เจอก็สร้างใหม่ (สีวนตาม COLORS ให้แต่ละโปรเจกต์ต่างกัน) */
function agentCategoryFor(project) {
  const proj = canonicalProject(project);
  const name = proj ? AGENT_CAT_PREFIX + proj : AGENT_CAT_FALLBACK;
  const key = name.toLowerCase();
  let cat = state.categories.find(c => c.name.toLowerCase() === key);
  if (cat) return cat;

  // เต็มโควตาแล้ว -> เทรวมไว้ที่หมวดกลาง ไม่สร้างเพิ่ม
  // นับเฉพาะหมวดที่ขึ้นต้นด้วย prefix (ไม่นับ "AI Work" ที่เป็นหมวดกลาง) โควตาจึงคงที่เสมอ
  const agentCats = state.categories.filter(c => c.name.startsWith(AGENT_CAT_PREFIX));
  if (agentCats.length >= AGENT_CAT_MAX) {
    cat = state.categories.find(c => c.name === AGENT_CAT_FALLBACK);
    if (cat) return cat;
    cat = { id: uid(), name: AGENT_CAT_FALLBACK, color: COLORS[0], icon: AGENT_CAT_ICON };
    state.categories.push(cat);
    return cat;
  }
  cat = { id: uid(), name, color: COLORS[agentCats.length % COLORS.length], icon: AGENT_CAT_ICON };
  state.categories.push(cat);
  return cat;
}

/* ---------- โน้ตงาน AI แบบมีโครงสร้าง ----------
   log-task.ps1 ส่งโน้ตเป็นหัวข้อ:  [overview-only] [overview] [added] [changed] [fixed] [details]
   รายการในหัวข้อ list ขึ้นต้น "- "; แอป import จะแปะบรรทัด "⏱ ช่วงเวลา" ไว้บนสุดอีกที
   โน้ตแบบเก่า (ไม่มีหัวข้อ) ยังอ่านได้: ทั้งก้อนถือเป็นรายละเอียด */
const AGENT_LIST_SECTIONS = ["overview", "added", "changed", "fixed"];
const CHANGE_KINDS = [
  { key: "added",   label: "Added",    color: "#10b981" },
  { key: "changed", label: "Improved", color: "#6366f1" },
  { key: "fixed",   label: "Fixed",    color: "#f97316" },
];

/** รายการรูปแบบ "English topic — คำอธิบายภาษาไทย" (ที่ log-task ใช้) -> หัวข้อตัวหนา + คำอธิบายสีจาง
 *  แยกเฉพาะเมื่อหัวไม่มีอักษรไทยและท้ายมีอักษรไทย ข้อความรูปแบบอื่นแสดงตามเดิม */
function topicHtml(text) {
  const s = String(text || "");
  const m = /^([^\u0E00-\u0E7F]{2,90}?)\s+[—–-]\s+(.*[\u0E00-\u0E7F][\s\S]*)$/.exec(s);
  return m ? `<b class="ps-topic">${esc(m[1])}</b> <span class="ps-desc">${esc(m[2])}</span>` : esc(s);
}

function parseAgentNote(note) {
  const out = { structured: false, overviewOnly: false, time: "",
                overview: [], added: [], changed: [], fixed: [], details: "" };
  const lines = String(note || "").replace(/\r/g, "").split("\n");
  let sec = null;                 // null = ก่อนเจอหัวข้อแรก
  const pre = [], det = [];
  for (const raw of lines) {
    const line = raw.trim();
    const m = /^\[([a-z-]+)\]$/.exec(line);
    if (m && (m[1] === "overview-only" || m[1] === "details" || AGENT_LIST_SECTIONS.includes(m[1]))) {
      out.structured = true;
      if (m[1] === "overview-only") out.overviewOnly = true;
      else sec = m[1];
      continue;
    }
    if (sec === null) { pre.push(raw); continue; }
    if (sec === "details") { det.push(raw); continue; }
    if (line) out[sec].push(line.startsWith("- ") ? line.slice(2).trim() : line);
  }
  // บรรทัด ⏱ ที่แอปแปะไว้บนสุด -> แยกเก็บเป็นเวลาทำงาน
  const firstIdx = pre.findIndex(s => s.trim());
  if (firstIdx >= 0 && pre[firstIdx].trim().startsWith("⏱")) {
    out.time = pre[firstIdx].trim();
    pre.splice(firstIdx, 1);
  }
  out.details = [pre.join("\n").trim(), det.join("\n").trim()].filter(Boolean).join("\n\n");
  return out;
}

/** เก็บกวาด task ที่จริงๆ เป็นแถว "อัปเดตภาพรวมอย่างเดียว" ([overview-only])
 *  เกิดได้ถ้าแท็บที่เปิดค้างไว้ยังเป็นแอปเวอร์ชันเก่า (ไม่รู้จักหัวข้อนี้) แล้ว import ไปเป็น task ธรรมดา
 *  -> ย้ายภาพรวมไปไว้ที่หมวด (ถ้าใหม่กว่า) แล้วลบ task นั้นทิ้ง; ปลอดภัยที่จะรันทุกครั้งที่ sync */
function absorbOverviewTasks() {
  let changed = false;
  const keep = [];
  for (const t of state.tasks) {
    if (t.agentLogId && String(t.note || "").includes("[overview-only]")) {
      const p = parseAgentNote(t.note);
      if (p.overviewOnly) {
        let cat = catById(t.categoryId);
        // แอป V4.9 เคย import ทุกอย่างเข้าหมวดรวม "AI Work" แล้วใส่ [ชื่อโปรเจกต์] นำหน้าชื่อ
        // -> หาหมวดโปรเจกต์ที่ถูกต้องจาก prefix ไม่งั้นภาพรวมจะไปติดหมวดรวมแทนหน้าโปรเจกต์
        const pm = /^\[([^\]]+)\]\s*/.exec(t.title || "");
        if ((!cat || cat.name === AGENT_CAT_FALLBACK) && pm && pm[1].trim()) {
          cat = agentCategoryFor(pm[1].trim());
        }
        const at = t.doneAt || t.createdAt || new Date().toISOString();
        if (cat && p.overview.length && (!cat.overviewAt || new Date(at) >= new Date(cat.overviewAt))) {
          cat.overview = p.overview.slice(0, 40);
          cat.overviewAt = at;
        }
        changed = true;
        continue;
      }
    }
    keep.push(t);
  }
  if (changed) { state.tasks = keep; save(); }
}

/** เดาประเภทจากชื่องาน (ใช้กับงานเก่าที่บันทึกก่อนมีหัวข้อ เพิ่ม/ปรับ/แก้บั๊ก) — ตรรกะเดียวกับ hook */
function guessChangeKind(text) {
  const s = String(text || "").trim();
  if (/^(feat|feature)(\(.*?\))?!?:/i.test(s)) return "added";
  if (/^(fix|bugfix|hotfix)(\(.*?\))?!?:/i.test(s)) return "fixed";
  if (/^(refactor|perf|style|chore|docs|test|build|ci)(\(.*?\))?!?:/i.test(s)) return "changed";
  const head = s.replace(/^(v?\d+(\.\d+)*\s*[:\-–]\s*|\[[^\]]*\]\s*)/i, "").slice(0, 40);
  if (/^(fix|fixed|fixes|hotfix|resolve|patch|harden)\b/i.test(head) || /^(แก้บั๊ก|แก้ปัญหา|แก้ไขบั๊ก|แก้บัก)/.test(head)) return "fixed";
  if (/^(add|adds|added|feat|new|introduce|create|support|implement|enable|integrate)\b/i.test(head)
      || /^(เพิ่ม|สร้าง|รองรับ|ทำระบบ|ทำฟีเจอร์)/.test(head)) return "added";
  return "changed";
}

/** ย้ายงาน AI ที่เวอร์ชันก่อนหน้า import ไว้ในหมวดรวม "AI Work" (ชื่องานขึ้นต้นด้วย [ชื่อโปรเจกต์])
 *  ให้ไปอยู่หมวดของโปรเจกต์ตัวเอง — ทำครั้งเดียว แล้วปักธงไว้ใน state ที่ sync ข้ามเครื่อง */
function migrateAgentCategories() {
  if (state.meta.agentCatV2) return;
  const legacy = state.categories.find(c => c.name === AGENT_CAT_FALLBACK);
  let moved = 0;
  if (legacy) {
    for (const t of state.tasks) {
      if (!t.agentLogId || t.categoryId !== legacy.id) continue;
      // ยอมให้ส่วนท้ายว่างได้ (ชื่อที่มีแต่ prefix) ไม่งั้นงานนั้นจะค้างที่เดิมถาวรเพราะธงถูกปักแล้ว
      const m = /^\[([^\]]+)\]\s*([\s\S]*)$/.exec(t.title || "");
      if (!m) continue;
      const proj = m[1].trim();
      if (!proj) continue;
      const cat = agentCategoryFor(proj);
      if (cat.id === legacy.id) continue;   // โควตาเต็ม -> ปล่อยไว้ที่เดิม พร้อม prefix เหมือนเดิม
      t.title = m[2].trim() || proj;        // เหลือแต่ prefix -> ใช้ชื่อโปรเจกต์เป็นชื่องานแทนชื่อว่าง
      t.categoryId = cat.id;
      moved++;
    }
    // หมวดรวมว่างแล้วก็เอาออก ไม่ให้เหลือการ์ดเปล่าคาหน้าจอ
    // แต่ลบเฉพาะตัวที่แอปสร้างเองเท่านั้น (สี/ไอคอนตรงกับค่าที่ V4.9 ใช้ตอน auto-create)
    // ถ้าผู้ใช้บังเอิญตั้งหมวดชื่อ "AI Work" เองไว้ ห้ามลบของเขา
    const autoCreated = legacy.color === AGENT_CAT_LEGACY_COLOR && legacy.icon === AGENT_CAT_ICON;
    if (moved && autoCreated && !state.tasks.some(t => t.categoryId === legacy.id)) {
      state.categories = state.categories.filter(c => c.id !== legacy.id);
    }
  }
  state.meta.agentCatV2 = 1;
  save();
  if (moved) render();
}

/** รวมหมวด AI ที่ใช้ชื่อโปรเจกต์เก่า (PROJECT_ALIASES) เข้าหมวดชื่อปัจจุบัน
 *  ไม่มีหมวดปลายทาง -> เปลี่ยนชื่อหมวดเดิมเลย (เก็บสี/id ไว้); มีแล้ว -> ย้าย task + ภาพรวม/โน้ต แล้วลบหมวดเก่า
 *  ปลอดภัยที่จะรันทุกครั้งที่ sync (ไม่มีหมวดชื่อเก่าเหลือ = ไม่ทำอะไร) */
function mergeProjectAliases() {
  let changed = false;
  for (const old of state.categories.slice()) {
    if (!old.name.startsWith(AGENT_CAT_PREFIX)) continue;
    const proj = old.name.slice(AGENT_CAT_PREFIX.length).trim();
    const target = canonicalProject(proj);
    if (target === proj) continue;
    const targetName = AGENT_CAT_PREFIX + target;
    const into = state.categories.find(c => c !== old && c.name.toLowerCase() === targetName.toLowerCase());
    changed = true;
    if (!into) { old.name = targetName; continue; }
    into.name = targetName;   // ปลายทางสะกดตัวเล็ก/ใหญ่ต่างไป (เช่น "AI · kodo") -> ใช้ชื่อมาตรฐาน
    for (const t of state.tasks) if (t.categoryId === old.id) t.categoryId = into.id;
    for (const r of state.routines || []) if (r.categoryId === old.id) r.categoryId = into.id;
    // ภาพรวม: เอาชุดที่ใหม่กว่า / โน้ต: รวมกันถ้ามีทั้งคู่
    if (Array.isArray(old.overview) && old.overview.length
        && (!into.overviewAt || (old.overviewAt && new Date(old.overviewAt) > new Date(into.overviewAt)))) {
      into.overview = old.overview; into.overviewAt = old.overviewAt;
    }
    const a = String(into.note || "").trim(), b = String(old.note || "").trim();
    if (b && b !== a) { into.note = a ? a + "\n\n" + b : b; into.noteAt = new Date().toISOString(); }
    // ค่าตั้งอื่นของหมวดเก่า (เช่น schedule / enabled) ที่หมวดปลายทางยังเป็นค่าเริ่มต้น -> ยกไปด้วย ไม่ให้หายตอนลบหมวดเก่า
    // migrate() เติมค่าเริ่มต้นให้ทุกหมวดแล้ว (schedule:null, enabled:true) จึงนับค่าพวกนี้ว่า "ยังไม่ได้ตั้ง"
    const unset = (k, v) => v === undefined || (k === "schedule" && v === null) || (k === "enabled" && v === true);
    for (const k of Object.keys(old)) {
      if (["id", "name", "overview", "overviewAt", "note", "noteAt"].includes(k)) continue;
      if (unset(k, into[k]) && !unset(k, old[k])) into[k] = old[k];
    }
    if (todayCat === old.id) todayCat = into.id;
    state.categories = state.categories.filter(c => c.id !== old.id);
  }
  if (changed) save();
}

async function importAgentLog() {
  if (!sb || !sbUser) return;
  try {
    const { data: rows, error } = await sb.from("agent_log")
      .select("id, title, note, project, started_at, done_at")
      .eq("user_id", sbUser.id).eq("imported", false)
      .order("done_at", { ascending: true }).limit(100);
    if (error || !rows || rows.length === 0) return;

    let added = 0;
    let touched = false;            // มีการเปลี่ยน state นอกจากเพิ่ม task (เช่น อัปเดตภาพรวมโปรเจกต์)
    const overviewOnlyIds = [];
    for (const r of rows) {
      // ภาพรวมโปรเจกต์ ("แอปนี้มีอะไรบ้าง") — เอาชุดล่าสุดแทนชุดเดิมทั้งชุด
      const parsed = parseAgentNote(r.note);
      if (parsed.overview.length) {
        const oc = agentCategoryFor((r.project || "").trim());
        const at = r.done_at || new Date().toISOString();
        if (!oc.overviewAt || new Date(at) >= new Date(oc.overviewAt)) {
          oc.overview = parsed.overview.slice(0, 40);
          oc.overviewAt = at;
          touched = true;
        }
      }
      // แถวที่อัปเดตภาพรวมอย่างเดียว ไม่ใช่งาน -> ไม่สร้าง task
      if (parsed.overviewOnly) { overviewOnlyIds.push(r.id); continue; }
      // กันซ้ำ: ถ้าเคย import แถวนี้แล้ว (เช่น mark imported ไม่สำเร็จรอบก่อน) ข้ามไป
      if (state.tasks.some(t => t.agentLogId === r.id)) continue;
      const doneAt = r.done_at || new Date().toISOString();
      const startedAt = r.started_at || null;
      // ใส่ช่วงเวลาทำงานไว้ใน note: "⏱ 14:00–16:30 (2h 30m)" — คร่อมวันก็ระบุวันด้วย
      let note = r.note || "";
      if (startedAt) {
        const s = new Date(startedAt), d = new Date(doneAt);
        const fmtT = x => x.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
        const sameDay = dateKey(s) === dateKey(d);
        const mins = Math.max(1, Math.round((d - s) / 60000));
        const dur = mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`;
        const range = sameDay ? `${fmtT(s)}–${fmtT(d)}` : `${dateKey(s)} ${fmtT(s)} – ${dateKey(d)} ${fmtT(d)}`;
        note = `⏱ ${range} (${dur})` + (note ? `\n${note}` : "");
      }
      const dueAt = startedAt || doneAt;
      const spansDays = startedAt && dateKey(new Date(startedAt)) !== dateKey(new Date(doneAt));
      // ปกติชื่อโปรเจกต์อยู่ที่หมวดแล้ว ไม่ต้องใส่หน้าชื่องานซ้ำ
      // ยกเว้นตอนถูกเทรวมไว้หมวดกลาง (โควตาเต็ม) — ต้องใส่ไว้ ไม่งั้นไม่รู้ว่างานมาจากโปรเจกต์ไหน
      const proj = canonicalProject(r.project);   // trim + ชื่อปัจจุบัน ที่เดียว ใช้ค่าเดียวกันทั้งชื่อหมวดและชื่องาน
      const agentCat = agentCategoryFor(proj);
      const pooled = agentCat.name === AGENT_CAT_FALLBACK && proj;
      state.tasks.push({
        id: uid(), agentLogId: r.id,
        title: pooled ? `[${proj}] ${r.title}` : r.title,
        note, categoryId: agentCat.id,
        dueAt, endDate: spansDays ? dateKey(new Date(doneAt)) : null,
        reminderMin: null, recurrence: "none",
        status: "done", doneAt, notifiedAt: null, createdAt: dueAt,
      });
      added++;
    }
    if (added > 0 || touched) save(); // ลง localStorage ก่อน — ถ้าขั้นถัดไปล้ม งานไม่หาย และรอบหน้า dedupe ด้วย agentLogId
    // mark ว่า import แล้ว "หลัง" state ที่มี task เหล่านี้ขึ้น cloud สำเร็จเท่านั้น —
    // กันเคสแท็บปิดก่อน debounced save ทัน (แถว log ถูกกินทิ้งแต่ task ไม่เคยถึง cloud)
    // และ mark เฉพาะแถวที่มี task ใน state จริง (แถวที่ dedupe ข้ามก็ผ่านเงื่อนไขนี้เพราะ task เดิมอยู่ใน state)
    // แถว overview-only ไม่มี task — ผลของมัน (ภาพรวมบนหมวด) อยู่ใน state ที่จะ upsert ข้างล่างแล้ว จึง mark ได้เลย
    const doneIds = rows.filter(r => overviewOnlyIds.includes(r.id) || state.tasks.some(t => t.agentLogId === r.id)).map(r => r.id);
    if (!doneIds.length) return;
    const { error: upErr } = await sb.from("app_state").upsert({
      user_id: sbUser.id, data: state, updated_at: new Date().toISOString(),
    });
    if (upErr) { console.warn("agent_log: cloud save failed, keeping rows for retry:", upErr.message); return; }
    const { error: markErr } = await sb.from("agent_log")
      .update({ imported: true }).in("id", doneIds);
    if (markErr) console.warn("agent_log mark imported failed:", markErr.message);
    if (added > 0) { showToast(`🤖 Imported ${added} task${added > 1 ? "s" : ""} from Claude`); render(); }
    else if (touched) render();
  } catch (e) {
    console.warn("agent_log import failed:", e);
  }
}

function scheduleCloudSave() {
  if (!sb || !sbUser || cloudPulling) return;
  cloudDirty = true;
  syncState = "pending";
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async () => {
    cloudSaveTimer = null;
    const { error } = await sb.from("app_state").upsert({
      user_id: sbUser.id,
      data: state,
      updated_at: new Date().toISOString(),
    });
    if (error) {
      syncState = "error";
      showToast("⚠️ Sync failed — data kept on this device, will retry");
      // ลองใหม่อัตโนมัติใน 10 วิ
      setTimeout(() => { if (cloudDirty) scheduleCloudSave(); }, 10000);
    } else {
      cloudDirty = false;
      syncState = "synced";
    }
  }, 1200);
}

/** ส่งข้อมูลค้างขึ้น cloud ทันทีก่อนแท็บถูกซ่อน/ปิด (fetch keepalive ทำงานต่อได้แม้หน้า unload) */
function flushCloudSave() {
  if (!cloudDirty || !sbUser || !sbToken || !cloudConfigured()) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = null;
  try {
    fetch(sbCfg.url + "/rest/v1/app_state?on_conflict=user_id", {
      method: "POST",
      keepalive: true,
      headers: {
        apikey: sbCfg.key,
        Authorization: "Bearer " + sbToken,
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates",
      },
      body: JSON.stringify([{ user_id: sbUser.id, data: state, updated_at: new Date().toISOString() }]),
    });
    cloudDirty = false;
    syncState = "synced";
  } catch { /* เก็บ dirty ไว้ รอบหน้า retry */ }
}
document.addEventListener("visibilitychange", () => { if (document.hidden) flushCloudSave(); });
window.addEventListener("pagehide", flushCloudSave);

function connectCloud() {
  const url = (document.getElementById("sbUrl")?.value || "").trim().replace(/\/+$/, "");
  const key = (document.getElementById("sbKey")?.value || "").trim();
  if (!/^https:\/\/.+\.supabase\.co$/.test(url) || key.length < 20) {
    showToast("❌ Check the Project URL and anon key");
    return;
  }
  localStorage.setItem(SB_CFG_KEY, JSON.stringify({ url, key }));
  location.reload();
}
function disconnectCloud() {
  if (!confirm("Disconnect cloud sync? Data stays on this device and in the cloud.")) return;
  localStorage.setItem(SB_CFG_KEY, JSON.stringify({ off: true }));
  location.reload();
}

function finishSetup() {
  // สร้างหมวดตามที่เลือก (ถ้ายังไม่มีข้อมูลเก่า แทนที่ default ได้เลย)

/* ---------- Google Calendar sync ----------
   ผ่าน Edge Function "gcal-sync" (ดู supabase/functions/gcal-sync) — ฝั่งเว็บไม่เคยเห็น Google token
   - Connect: login Google อีกรอบขอ scope calendar + offline → ได้ refresh token → ส่งไปเก็บที่ server
   - Sync: ทุกครั้งที่ save() จะเทียบ hash ของแต่ละ task กับ meta.gcalMap แล้วส่งเฉพาะที่เปลี่ยน
     task ที่หายไป (ลบ/ไม่มีวัน) → ลบ event ใน Google ด้วย — ไม่ต้อง hook ทุกจุดที่แก้ task */
const GCAL_SCOPES = "https://www.googleapis.com/auth/calendar";
const GCAL_PENDING_KEY = "task-studio-gcal-pending";
let gcalTimer = null;
let gcalBusy = false;
let gcalState = "idle"; // idle | syncing | error | reauth
let gcalRetryAt = 0;    // หลัง error พัก 60 วิ ก่อนลองใหม่ (กัน toast รัว)

/* การ sync แบบเขียนลง Google ผ่าน server (Edge Function gcal-sync) ปิดถาวรตั้งแต่ V6.1:
   ผู้ใช้เลือกแบบอ่านอย่างเดียว (Google -> Kodo ผ่าน gread*) และฟังก์ชันฝั่ง server ไม่เคยถูก deploy
   gcalConnected() คืน false เสมอ -> ทุกทางที่เคยส่งข้อมูลไป Google (sync/อัปโหลด token) ไม่ทำงาน */
const GCAL_SERVER_SYNC_DISABLED = true;
function gcalConnected() { return false; }

function gcalHash(t) {
  const cat = catById(t.categoryId);
  return [t.title, t.note || "", t.dueAt, t.endDate || "", cat ? cat.name : "", t.status, t.reminderMin ?? ""].join("|");
}

function gcalPayload(t) {
  const start = new Date(t.dueAt);
  const hasTime = start.getHours() !== 0 || start.getMinutes() !== 0;
  const span = taskSpan(t);
  const endEx = new Date(span.end); endEx.setDate(endEx.getDate() + 1);
  const cat = catById(t.categoryId);
  return {
    id: t.id, title: t.title, note: t.note || "", category: cat ? cat.name : "", status: t.status,
    reminderMin: t.reminderMin ?? null,
    allDay: isRangeTask(t) || !hasTime,
    dueAt: t.dueAt, startDate: dateKey(span.start), endDateEx: dateKey(endEx),
  };
}

async function gcalInvoke(body) {
  const { data, error } = await sb.functions.invoke("gcal-sync", { body });
  if (error) {
    let detail = error.message;
    try { const j = await error.context?.json(); if (j?.error) detail = j.error; } catch { /* ignore */ }
    throw new Error(detail);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}

async function connectGoogleCalendar() {
  if (!sb) return;
  localStorage.setItem(GCAL_PENDING_KEY, "1");
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: location.origin + location.pathname,
      scopes: GCAL_SCOPES,
      queryParams: { access_type: "offline", prompt: "consent" }, // ต้องมีทั้งคู่ถึงจะได้ refresh token
    },
  });
  if (error) { localStorage.removeItem(GCAL_PENDING_KEY); showToast("❌ " + error.message); }
}

/** หลัง redirect กลับมาจาก Google — Supabase แนบ provider_refresh_token มาใน session แค่ครั้งนี้ครั้งเดียว */
async function captureGoogleToken(session) {
  // ปิดถาวร (ดู gcalConnected): ล้างค่าค้างจากเวอร์ชันเก่าที่เคยกด Connect แบบ server ไว้ แล้วไม่ส่ง token ไปไหน
  localStorage.removeItem(GCAL_PENDING_KEY);
  if (GCAL_SERVER_SYNC_DISABLED) return;
  const rt = session?.provider_refresh_token;
  if (!rt) return;
  localStorage.removeItem(GCAL_PENDING_KEY);
  try {
    await gcalInvoke({ op: "store_token", refresh_token: rt });
    state.meta.gcal = { connected: true, lastSync: null };
    state.meta.gcalMap = state.meta.gcalMap || {};
    gcalState = "idle"; gcalRetryAt = 0;
    save();
    showToast("✅ Google Calendar connected — syncing your tasks");
    currentTab = "settings"; render();
  } catch (e) {
    showToast("❌ Google Calendar: " + e.message);
  }
}

async function disconnectGoogleCalendar() {
  if (!confirm("Disconnect Google Calendar? Events already created will stay in Google.")) return;
  try { await gcalInvoke({ op: "disconnect" }); } catch { /* ลบฝั่งเราต่อแม้ server ตอบ error */ }
  state.meta.gcal = { connected: false };
  state.meta.gcalMap = {};
  gcalState = "idle";
  save(); render();
}

function gcalSyncNow() {
  gcalRetryAt = 0;
  clearTimeout(gcalTimer); gcalTimer = null;
  // บังคับส่งทุก task ใหม่ (เผื่อผู้ใช้ลบ event ใน Google เอง server จะสร้างให้ใหม่)
  for (const k of Object.keys(state.meta.gcalMap || {})) state.meta.gcalMap[k].hash = "";
  runGcalSync();
}

function scheduleGcalSync() {
  if (!gcalConnected() || Date.now() < gcalRetryAt) return;
  clearTimeout(gcalTimer);
  gcalTimer = setTimeout(runGcalSync, 2500);
}

async function runGcalSync() {
  gcalTimer = null;
  if (!gcalConnected() || gcalBusy) return;
  const map = state.meta.gcalMap || (state.meta.gcalMap = {});
  const upserts = [];
  const removals = []; // { taskId, eventId }
  const alive = new Set();
  for (const t of state.tasks) {
    alive.add(t.id);
    if (!t.dueAt) { if (map[t.id]) removals.push({ taskId: t.id, eventId: map[t.id].eventId }); continue; }
    const h = gcalHash(t);
    if (!map[t.id] || map[t.id].hash !== h) upserts.push({ ...gcalPayload(t), eventId: map[t.id]?.eventId || null, hash: h });
  }
  for (const id of Object.keys(map)) if (!alive.has(id)) removals.push({ taskId: id, eventId: map[id].eventId });
  if (!upserts.length && !removals.length) {
    if (currentTab === "settings" && gcalState !== "idle") { gcalState = "idle"; render(); }
    return;
  }
  gcalBusy = true; gcalState = "syncing";
  if (currentTab === "settings") render();
  try {
    const res = await gcalInvoke({ op: "sync", upserts, deletes: removals.map(r => r.eventId).filter(Boolean) });
    for (const u of upserts) if (res.events?.[u.id]) map[u.id] = { eventId: res.events[u.id], hash: u.hash };
    for (const r of removals) delete map[r.taskId]; // server ถือว่า 404 = ลบแล้ว
    const failedCount = Object.keys(res.failed || {}).length;
    state.meta.gcal.lastSync = new Date().toISOString();
    gcalState = failedCount ? "error" : "idle";
    if (failedCount) { gcalRetryAt = Date.now() + 60000; showToast(`⚠️ Google Calendar: ${failedCount} task${failedCount > 1 ? "s" : ""} failed to sync`); }
  } catch (e) {
    if (/reauth|not_connected/.test(e.message)) {
      gcalState = "reauth";
      state.meta.gcal.connected = false;
      showToast("⚠️ Google Calendar disconnected — reconnect in Settings");
    } else {
      gcalState = "error";
      gcalRetryAt = Date.now() + 60000;
      showToast("⚠️ Google Calendar: " + e.message);
    }
  }
  gcalBusy = false;
  save(); // เก็บ map — save() จะเรียก schedule อีกรอบ แต่ไม่มีอะไรค้างแล้วเลยจบเงียบๆ
  if (currentTab === "settings") render();
}

/* ---------- category schedule ---------- */
/** ตอนนี้อยู่ในช่วงเวลาของหมวดนี้ไหม (รองรับช่วงข้ามเที่ยงคืน เช่น 22:00-01:00) */
function scheduleActive(c) {
  const s = c.schedule;
  if (!s || !Array.isArray(s.days) || !s.days.length || !s.start || !s.end) return false;
  const now = new Date();
  const t = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  if (s.start <= s.end) {
    return s.days.includes(now.getDay()) && t >= s.start && t < s.end;
  }
  // ข้ามเที่ยงคืน: ช่วงแรกนับวันที่ตั้ง ช่วงหลังเที่ยงคืนนับวันถัดจากวันที่ตั้ง
  const yesterday = (now.getDay() + 6) % 7;
  return (s.days.includes(now.getDay()) && t >= s.start) ||
         (s.days.includes(yesterday) && t < s.end);
}
const DAY_LETTERS = ["S", "M", "T", "W", "T", "F", "S"];
function scheduleSummary(c) {
  const s = c.schedule;
  if (!s || !s.days?.length) return "";
  const days = s.days.length === 7 ? "Every day"
    : [...s.days].sort((a, b) => a - b).map(d => DOW[d]).join(" ");
  return `${days} · ${s.start}–${s.end}`;
}

function toggleCategory(id) {
  const c = catById(id);
  if (!c) return;
  c.enabled = c.enabled === false;
  save(); render();
}
function toggleNotifications() {
  if (!("Notification" in window)) {
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    showToast(ios ? "📱 iPhone/iPad: Share → Add to Home Screen, then open Kodo from its icon to allow notifications"
                  : "⚠️ This browser doesn't support notifications");
    return;
  }
  if (Notification.permission === "denied") {
    showToast("🔕 Notifications are blocked — allow them in the browser's site settings (padlock icon), then reload");
    return;
  }
  if (Notification.permission !== "granted") {
    Notification.requestPermission().then(p => {
      if (p === "granted") { state.meta.notifOff = false; save(); showToast("🔔 Notifications on"); }
      else if (p === "denied") showToast("🔕 Notifications blocked — change it in the browser's site settings");
      render();
    });
    return;
  }
  state.meta.notifOff = !state.meta.notifOff;
  save(); render();
  showToast(state.meta.notifOff ? "🔕 Notifications off" : "🔔 Notifications on");
}
/** หมวดที่เปิดใช้อยู่ */
function activeCategories() {

}

let editingScheduleCat = null;

/** ชื่อที่ผู้ใช้ตั้งเอง (ตัดช่องว่าง/ยาวไม่เกิน 24 ตัว) หรือ "" */

/** ไฟ streak — เปลวทรงหยดน้ำโค้งเรียบ ไล่สีเหลือง→ส้ม→แดง + ไส้ในสว่าง (lit=false = เทาซีด) */
function flameSvg(size, lit, flick) {
  const outer = "M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.176 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248z";
  const inner = "M15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1a5.99 5.99 0 0 1 1.925-3.546 3.75 3.75 0 0 1 3.255 3.718z";
  if (!lit) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">
      <path d="${outer}" fill="var(--border)"/>
      <path d="${inner}" fill="var(--card)" opacity=".65"/>
    </svg>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" ${flick ? 'class="flame-anim"' : ""} style="overflow:visible">
    <defs>
      <linearGradient id="tkFlame" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd93b"/>
        <stop offset=".45" stop-color="#ff9500"/>
        <stop offset="1" stop-color="#ff3d1f"/>
      </linearGradient>
      <linearGradient id="tkFlameIn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff8d6"/>
        <stop offset="1" stop-color="#ffc93b"/>
      </linearGradient>
    </defs>
    <path d="${outer}" fill="url(#tkFlame)"/>
    <path d="${inner}" fill="url(#tkFlameIn)"/>
  </svg>`;
}

/** สัตว์เลี้ยงแบบ SVG — ค็อกคาเทล 7 ช่วงวัย วาดใหม่ (flat vector + ตาแบบ plush) — อนิเมชันอยู่ใน CSS ผ่าน class p-* */
/* นก Pacific parrotlet สีฟ้า (มุมหน้าตรง) — ร่าง 3..7 ของสัตว์เลี้ยง
   คืนค่า "inner" ของ <svg viewBox="0 0 100 100"> ; id(k) ต้องสร้าง id ไม่ซ้ำต่ออินสแตนซ์ */
function parrotletInner(stage, id, species) {
  const tiel = species === "cockatiel";
  const f = (v) => String(Math.round(v * 100) / 100);
  const SW = 'stroke-linecap="round" stroke-linejoin="round"';

  // สี: ฟ้าหัว/หลัง, ครีมหน้าอก, ปีกโคบอลต์, ปาก/เท้าชมพูอ่อน, ตาน้ำตาลเข้ม (ตาม reference)
  const PAL = {
    baby:  { b0: "#d9f0fa", b1: "#b4dcf0", b2: "#8cc3e2", edge: "#6fa9cf", w0: "#a9cdef", w1: "#86aee6", w2: "#6c93d6", wLine: "#5b7fc6", tail: "#7fb2dc" },
    young: { b0: "#c6e9f7", b1: "#98d0ec", b2: "#6bb2dc", edge: "#4f93c4", w0: "#86c0ea", w1: "#5b8ddc", w2: "#3f68c4", wLine: "#35599f", tail: "#3c86c0" },
    adult: { b0: "#bfe7f7", b1: "#8ccbea", b2: "#5ea8d6", edge: "#4488bd", w0: "#79bde8", w1: "#4f86d8", w2: "#3560c2", wLine: "#223f95", tail: "#2c7fb6" },
    cobalt:{ b0: "#b3e0f6", b1: "#7cc0e8", b2: "#4b98cf", edge: "#3776b0", w0: "#5fa6e6", w1: "#3563cf", w2: "#1f3fa6", wLine: "#172f7c", tail: "#1f64a8" },
  };
  const S = {
    3: { hx: 50, hy: 40, hr: 22, by: 66, brx: 23.5, bry: 19, eyeY: 39, eyeDx: 11.5, eyeR: 4.2, beak: 0.9, beakY: 42.5, pal: "baby", tail: 0, wingLen: 0.78, fuzz: true },
    4: { hx: 50, hy: 35.5, hr: 19.8, by: 64, brx: 26.5, bry: 22, eyeY: 34, eyeDx: 10.8, eyeR: 3.8, beak: 1.05, beakY: 38, pal: "young", tail: 2.5, wingLen: 0.92 },
    5: { hx: 50, hy: 33, hr: 18.6, by: 63, brx: 28.5, bry: 25, eyeY: 31.5, eyeDx: 10.2, eyeR: 3.4, beak: 1.15, beakY: 35, pal: "adult", tail: 4, wingLen: 1 },
    6: { hx: 50, hy: 33, hr: 18.6, by: 63, brx: 28.5, bry: 25, eyeY: 31.5, eyeDx: 10.2, eyeR: 3.4, beak: 1.15, beakY: 35, pal: "cobalt", tail: 4, wingLen: 1 },
    7: { hx: 50, hy: 33, hr: 18.6, by: 63, brx: 28.5, bry: 25, eyeY: 31.5, eyeDx: 10.2, eyeR: 3.4, beak: 1.15, beakY: 35, pal: "adult", tail: 4, wingLen: 1, halo: true },
  }[stage];
  const TIEL = stage === 6
    ? { b0: "#fff6d8", b1: "#f6e3a6", b2: "#e6c97a", edge: "#caa955", w0: "#fbeec2", w1: "#f2da92", w2: "#d9ba62", wLine: "#b08f3c", tail: "#e3c676" }
    : { b0: "#fffbee", b1: "#f8eecb", b2: "#e9d9a4", edge: "#cdb87a", w0: "#fcf3d6", w1: "#f3e4b2", w2: "#dfc88a", wLine: "#b89c56", tail: "#e9d7a2" };
  const C = tiel ? TIEL : PAL[S.pal];
  const { hx, hy, hr, by, brx, bry } = S;

  // โครงหัว+ตัวเป็นก้อนเดียวแบบลูกแพร์ (parrotlet ไม่มีคอให้เห็น)
  const side = (m) => {   // m = +1 ขวา, -1 ซ้าย (วาดจากยอดหัวลงไปก้น)
    const X = (dx) => f(hx + m * dx);
    return `C${X(hr * 0.6)} ${f(hy - hr)} ${X(hr)} ${f(hy - hr * 0.58)} ${X(hr)} ${f(hy)} ` +
      `C${X(hr)} ${f(hy + hr * 0.5)} ${X(brx * 0.84)} ${f(by - bry * 0.66)} ${X(brx * 0.97)} ${f(by - bry * 0.12)} ` +
      `C${X(brx * 1.03)} ${f(by + bry * 0.38)} ${X(brx * 0.78)} ${f(by + bry * 0.96)} ${f(hx)} ${f(by + bry)}`;
  };
  const right = side(1);
  const leftBack = (() => {  // ด้านซ้ายย้อนจากก้นขึ้นหัว
    const X = (dx) => f(hx - dx);
    return `C${X(brx * 0.78)} ${f(by + bry * 0.96)} ${X(brx * 1.03)} ${f(by + bry * 0.38)} ${X(brx * 0.97)} ${f(by - bry * 0.12)} ` +
      `C${X(brx * 0.84)} ${f(by - bry * 0.66)} ${X(hr)} ${f(hy + hr * 0.5)} ${X(hr)} ${f(hy)} ` +
      `C${X(hr)} ${f(hy - hr * 0.58)} ${X(hr * 0.6)} ${f(hy - hr)} ${f(hx)} ${f(hy - hr)}z`;
  })();
  const bodyD = `M${f(hx)} ${f(hy - hr)} ${right} ${leftBack}`;

  // หน้าอก/ท้องสีครีม ไล่ขึ้นไปถึงคอ (ขอบจางด้วย gradient)
  const bellyD = (() => {
    const t = hy + hr * 0.36;
    const R = `C${f(hx + brx * 0.55)} ${f(t)} ${f(hx + brx * 0.74)} ${f(by - bry * 0.42)} ${f(hx + brx * 0.72)} ${f(by + bry * 0.12)} ` +
      `C${f(hx + brx * 0.7)} ${f(by + bry * 0.72)} ${f(hx + brx * 0.36)} ${f(by + bry * 0.97)} ${f(hx)} ${f(by + bry * 0.98)} `;
    const L = `C${f(hx - brx * 0.36)} ${f(by + bry * 0.97)} ${f(hx - brx * 0.7)} ${f(by + bry * 0.72)} ${f(hx - brx * 0.72)} ${f(by + bry * 0.12)} ` +
      `C${f(hx - brx * 0.74)} ${f(by - bry * 0.42)} ${f(hx - brx * 0.55)} ${f(t)} ${f(hx)} ${f(t)}z`;
    return `M${f(hx)} ${f(t)} ${R}${L}`;
  })();

  // ปีกพับข้างตัว: ขนคลุมไหล่ฟ้าอ่อน -> โคบอลต์ -> ขนปลายปีกเข้ม
  const wl = S.wingLen;
  const P = (ax, ay) => `${f(hx - brx * ax)} ${f(by + bry * ay)}`;
  const wingD = `M${P(0.8, -0.62)} C${P(0.99, -0.38)} ${P(1.05, 0.25 * wl)} ${P(0.96, 0.6 * wl)} ` +
    `C${P(0.88, 0.86 * wl)} ${P(0.74, 1.0 * wl)} ${P(0.52, 1.07 * wl)} ` +
    `C${P(0.46, 0.62 * wl)} ${P(0.5, 0)} ${P(0.62, -0.4)} C${P(0.67, -0.53)} ${P(0.73, -0.61)} ${P(0.8, -0.62)}z`;
  const wingLines = stage === 3 ? "" : [
    `M${P(1.0, 0.3 * wl)} C${P(0.92, 0.62 * wl)} ${P(0.78, 0.88 * wl)} ${P(0.56, 1.05 * wl)}`,
    `M${P(0.93, 0.08 * wl)} C${P(0.84, 0.44 * wl)} ${P(0.7, 0.72 * wl)} ${P(0.52, 0.88 * wl)}`,
    `M${P(0.84, -0.1)} C${P(0.76, 0.2 * wl)} ${P(0.64, 0.46 * wl)} ${P(0.52, 0.6 * wl)}`,
  ].map(d => `<path d="${d}" fill="none" stroke="${C.wLine}" stroke-width=".75" opacity=".55" ${SW}/>`).join("") +
    // เกล็ดขนคลุมไหล่
    [[0.86, -0.36], [0.74, -0.3], [0.9, -0.2], [0.78, -0.14], [0.66, -0.2]].map(([ax, ay]) =>
      `<path d="M${P(ax + 0.07, ay)} q${f(brx * 0.07)} ${f(bry * 0.07)} ${f(brx * 0.14)} 0" fill="none" stroke="#d4eefa" stroke-width=".6" opacity=".7" ${SW}/>`).join("");
  const wingInner = `<path d="${wingD}" fill="url(#${id("wg")})" stroke="${C.wLine}" stroke-width=".5" stroke-opacity=".45"/>${wingLines}`;
  const wings = `<g class="p-wing p-wing-l">${wingInner}</g><g class="p-wing p-wing-r"><g transform="matrix(-1 0 0 1 100 0)">${wingInner}</g></g>`;

  // หางสั้นโผล่ใต้ท้อง (อยู่หลังตัว)
  const tail = S.tail ? `<g class="p-tail"><path d="M${f(hx - 4.4)} ${f(by + bry - 3)} L${f(hx + 4.4)} ${f(by + bry - 3)} L${f(hx + 3.2)} ${f(by + bry + S.tail)} Q${f(hx)} ${f(by + bry + S.tail + 2.2)} ${f(hx - 3.2)} ${f(by + bry + S.tail)}z" fill="${C.tail}"/></g>` : "";

  // เท้าชมพู 3 นิ้วเกาะพื้น
  const fy = by + bry - 1.8, fdx = brx * 0.36;
  const foot = (x) => {
    const toes = `M${f(x)} ${f(fy)} l${f(-2.8)} ${f(3.4)} M${f(x)} ${f(fy)} l0 ${f(4)} M${f(x)} ${f(fy)} l${f(2.8)} ${f(3.4)}`;
    return `<path d="${toes}" stroke="#d9999b" stroke-width="2.6" fill="none" ${SW}/><path d="${toes}" stroke="#f3c3c2" stroke-width="1.5" fill="none" ${SW}/>`;
  };
  const feet = `<g class="p-feet">${foot(hx - fdx)}${foot(hx + fdx)}</g>`;

  // ตาน้ำตาลเข้มกลม มีขอบเปลือกตาจางๆ + แสงสะท้อน
  const eye = (cx) => {
    const r = S.eyeR, cy = S.eyeY;
    return `<g class="p-eye"><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r + 0.7)}" fill="#e9f7fc" opacity=".85"/>` +
      `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="#2a1a12"/>` +
      `<circle cx="${f(cx)}" cy="${f(cy + r * 0.25)}" r="${f(r * 0.62)}" fill="#4a2e20" opacity=".8"/>` +
      `<circle cx="${f(cx - r * 0.34)}" cy="${f(cy - r * 0.36)}" r="${f(r * 0.34)}" fill="#fff"/>` +
      `<circle cx="${f(cx + r * 0.36)}" cy="${f(cy + r * 0.34)}" r="${f(r * 0.14)}" fill="#fff" opacity=".85"/></g>`;
  };

  // ปากงุ้มสีชมพูอ่อน
  const bs = S.beak, bY = S.beakY;
  const B = (x, y) => `${f(hx + x * bs)} ${f(bY + y * bs)}`;
  const beak = `<path d="M${B(-5.4, 0.6)} C${B(-5.2, -2.8)} ${B(5.2, -2.8)} ${B(5.4, 0.6)} C${B(5.8, 4.6)} ${B(3.2, 8.6)} ${B(0, 11.4)} C${B(-3.2, 8.6)} ${B(-5.8, 4.6)} ${B(-5.4, 0.6)}z" fill="url(#${id("bk")})"/>` +
    `<path d="M${B(-3.2, 5.6)} C${B(-1.4, 7.6)} ${B(1.4, 7.6)} ${B(3.2, 5.6)} C${B(2.4, 8.4)} ${B(1.2, 10.4)} ${B(0, 11.8)} C${B(-1.2, 10.4)} ${B(-2.4, 8.4)} ${B(-3.2, 5.6)}z" fill="#cf8c89" opacity=".45"/>` +
    `<ellipse cx="${f(hx - 1.7 * bs)}" cy="${f(bY + 0.6 * bs)}" rx="${f(1.5 * bs)}" ry="${f(0.9 * bs)}" fill="#fff" opacity=".6"/>` +
    `<circle cx="${f(hx - 1.6 * bs)}" cy="${f(bY - 1.1 * bs)}" r="${f(0.42 * bs)}" fill="#a97877" opacity=".55"/><circle cx="${f(hx + 1.6 * bs)}" cy="${f(bY - 1.1 * bs)}" r="${f(0.42 * bs)}" fill="#a97877" opacity=".55"/>`;

  // ขนอ่อนฟูบนหัว (ร่างเด็ก)
  const fuzz = S.fuzz ? `<path d="M${f(hx - 3)} ${f(hy - hr + 0.8)} q-1.6 -3.4 0.8 -5.2 M${f(hx + 0.6)} ${f(hy - hr + 0.2)} q0.4 -3.8 3 -4.6 M${f(hx + 3.8)} ${f(hy - hr + 1)} q2 -2.6 4.4 -2.4" stroke="${C.b1}" stroke-width="1.5" fill="none" ${SW}/>` : "";

  // ขนเกล็ดบนอกจางๆ ให้ดูมีเนื้อขน
  const chest = [[-5, 0.05], [2, 0.02], [-1.5, 0.28], [5.5, 0.26], [-6, 0.5], [1.5, 0.52]].map(([dx, ay]) =>
    `<path d="M${f(hx + dx - 2)} ${f(by + bry * ay)} q2 1.5 4 0" fill="none" stroke="#ffffff" stroke-width=".6" opacity=".7" ${SW}/>`).join("");

  const halo = S.halo ? `<circle cx="50" cy="52" r="46" fill="url(#${id("halo")})"/>` +
    [[14, 20, 3.2], [85, 16, 2.6], [88, 58, 2.2], [11, 62, 2.4]].map(([x, y, r]) =>
      `<path class="p-note" d="M${x} ${f(y - r)} Q${x} ${y} ${f(x + r)} ${y} Q${x} ${y} ${x} ${f(y + r)} Q${x} ${y} ${f(x - r)} ${y} Q${x} ${y} ${x} ${f(y - r)}z" fill="#fde68a"/>`).join("") : "";

  const defs = `<defs>
    <radialGradient id="${id("bd")}" cx=".38" cy=".26" r=".8"><stop offset="0" stop-color="${C.b0}"/><stop offset=".55" stop-color="${C.b1}"/><stop offset="1" stop-color="${C.b2}"/></radialGradient>
    <radialGradient id="${id("bl")}" cx=".5" cy=".62" r=".62"><stop offset="0" stop-color="#fbf7ec"/><stop offset=".55" stop-color="#eef6f2"/><stop offset=".85" stop-color="${tiel ? "#f8efcf" : "#d8eff6"}" stop-opacity=".7"/><stop offset="1" stop-color="${C.b0}" stop-opacity="0"/></radialGradient>
    <radialGradient id="${id("fc")}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e6f7fb"/><stop offset=".7" stop-color="#d6f1f9" stop-opacity=".7"/><stop offset="1" stop-color="#d6f1f9" stop-opacity="0"/></radialGradient>
    <linearGradient id="${id("wg")}" x1="0" y1="0" x2=".25" y2="1"><stop offset="0" stop-color="${C.w0}"/><stop offset=".22" stop-color="${C.w0}"/><stop offset=".48" stop-color="${C.w1}"/><stop offset=".78" stop-color="${C.w2}"/><stop offset="1" stop-color="${C.wLine}"/></linearGradient>
    <linearGradient id="${id("bk")}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3df"/><stop offset=".6" stop-color="#efbdb8"/><stop offset="1" stop-color="#dc9f9b"/></linearGradient>
    ${S.halo ? `<radialGradient id="${id("halo")}"><stop offset="0" stop-color="#bfe7ff" stop-opacity=".75"/><stop offset=".7" stop-color="#dbeafe" stop-opacity=".35"/><stop offset="1" stop-color="#dbeafe" stop-opacity="0"/></radialGradient>` : ""}
    <clipPath id="${id("cl")}"><path d="${bodyD}"/></clipPath>
  </defs>`;

  return `${defs}${halo}
    <g class="p-body">
      ${tail}
      <path d="${bodyD}" fill="url(#${id("bd")})" stroke="${C.edge}" stroke-width=".8" stroke-opacity=".55"/>
      <g clip-path="url(#${id("cl")})">
        <path class="p-belly" d="${bellyD}" fill="url(#${id("bl")})"/>
        ${chest}
        <ellipse cx="${f(hx)}" cy="${f(S.beakY + 2)}" rx="${f(hr * 0.72)}" ry="${f(hr * 0.5)}" fill="url(#${id("fc")})"/>
        ${tiel ? `<ellipse cx="${f(hx)}" cy="${f(hy - hr * 0.05)}" rx="${f(hr * 0.86)}" ry="${f(hr * 0.8)}" fill="#fde047" opacity=".92"/>
          <circle cx="${f(hx - hr * 0.62)}" cy="${f(hy + hr * 0.3)}" r="${f(hr * 0.2)}" fill="#f59e0b"/><circle cx="${f(hx + hr * 0.62)}" cy="${f(hy + hr * 0.3)}" r="${f(hr * 0.2)}" fill="#f59e0b"/>` : ""}
        <ellipse cx="${f(hx - hr * 0.42)}" cy="${f(hy - hr * 0.55)}" rx="${f(hr * 0.42)}" ry="${f(hr * 0.22)}" fill="#fff" opacity=".35" transform="rotate(-22 ${f(hx - hr * 0.42)} ${f(hy - hr * 0.55)})"/>
      </g>
      ${fuzz}
      ${wings}
      ${eye(hx - S.eyeDx)}${eye(hx + S.eyeDx)}
      ${beak}
      ${feet}
    </g>`;
}

/* ---------- สัตว์เลี้ยง 3D (three.js) ----------
   นกเป็นโมเดล 3 มิติจริงทุกร่าง (ลูกนกตัวเล็กใน Lv 1-2 แล้วโตขึ้น) — เลือกได้ 2 สายพันธุ์: parrotlet / cockatiel
   petSvg() ห่อภาพวาดสำรองไว้ใน <span class="pet3d" data-stage data-species> ; เมื่อโหลด three.js ได้:
   - กล่อง .pp-pet[data-live] ในหน้าสัตว์เลี้ยง = วิวสด ลาก/กดลูกศรหมุนได้ + หายใจ/กะพริบตา/กระพือปีก
   - จุดเล็กอื่นๆ = ภาพนิ่งที่ render จากโมเดลเดียวกัน (cache ไว้ต่อร่าง/ขนาด)
   โหลดไม่ได้ (ออฟไลน์/ไม่มี WebGL) ก็ยังเห็นภาพวาดเดิม */
const THREE_SRC = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
const pet3d = { status: "idle", loading: null, snapR: null, live: null, cache: new Map() };

function loadThree() {
  if (window.THREE) return Promise.resolve(window.THREE);
  if (!pet3d.loading) {
    pet3d.loading = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = THREE_SRC; s.async = true;
      s.crossOrigin = "anonymous";   // ได้ response แบบ CORS -> service worker เก็บ cache ไว้ใช้ออฟไลน์ได้
      s.onload = () => window.THREE ? resolve(window.THREE) : reject(new Error("no THREE"));
      s.onerror = () => reject(new Error("three.js load failed"));
      document.head.appendChild(s);
    });
  }
  return pet3d.loading;
}

/* โมเดลนกตามร่าง — หน่วย: สูงราว 2.4 (เท้า y≈-1.05 ถึงหัว y≈1.3), หันหน้าไป +z */
function buildParrotlet3D(T, stage, species) {
  const tiel = species === "cockatiel";
  const lin = (hex) => new T.Color(hex).convertSRGBToLinear();
  const PAL = {
    baby:   { top: "#b6e2f6", low: "#7fbfe3", w0: "#b3d4f2", w1: "#8db3e8", w2: "#6d93d8", tail: "#86b6de" },
    young:  { top: "#93d1ef", low: "#4f9fd2", w0: "#8cc4ec", w1: "#5a8cdc", w2: "#3a62c0", tail: "#3d86c0" },
    adult:  { top: "#86cbee", low: "#3f8fca", w0: "#7fc1ea", w1: "#4a82d6", w2: "#2448a8", tail: "#2c7fb6" },
    cobalt: { top: "#7cc4ec", low: "#337fc0", w0: "#63a8e6", w1: "#2f5fcc", w2: "#16338f", tail: "#1f64a8" },
    chick:  { top: "#cdeaf8", low: "#a6d3ec", w0: "#c2e0f4", w1: "#a3c9ee", w2: "#8bb3e4", tail: "#a6d3ec" },
    // cockatiel แบบ lutino: ตัวเหลืองอ่อนเกือบขาว หน้าเหลือง แก้มส้ม (ร่าง 6 Pearl เหลืองเข้มขึ้นอีกนิด)
    tiel:      { top: "#fdf6dc", low: "#eddfae", w0: "#fcf3d6", w1: "#f3e4b2", w2: "#dfc88a", tail: "#e9d7a2", belly: "#fffbee", face: "#fde047" },
    tielPearl: { top: "#fdf0c6", low: "#ecd592", w0: "#fbeec2", w1: "#f2da92", w2: "#d9ba62", tail: "#e3c676", belly: "#fff8e2", face: "#fcd34d" },
    tielChick: { top: "#fbf0c2", low: "#efd98b", w0: "#f7e7ab", w1: "#ecd488", w2: "#dcbf66", tail: "#efd98b", belly: "#fff9e3", face: "#fff2b0" },
  };
  const CFG = {
    1: { pal: "chick", headK: 1.26, bodyK: 0.84, eye: 0.15, tail: 0, wing: 0.55, fuzz: true, s: 0.6 },
    2: { pal: "chick", headK: 1.18, bodyK: 0.87, eye: 0.14, tail: 0, wing: 0.66, fuzz: true, s: 0.74 },
    3: { pal: "baby", headK: 1.12, bodyK: 0.9, eye: 0.13, tail: 0, wing: 0.78, fuzz: true, s: 0.92 },
    4: { pal: "young", headK: 1.05, bodyK: 0.96, eye: 0.115, tail: 0.7, wing: 0.9, s: 0.96 },
    5: { pal: "adult", headK: 1, bodyK: 1, eye: 0.105, tail: 1, wing: 1, s: 1 },
    6: { pal: "cobalt", headK: 1, bodyK: 1, eye: 0.105, tail: 1, wing: 1, s: 1 },
    7: { pal: "adult", headK: 1, bodyK: 1, eye: 0.105, tail: 1, wing: 1, s: 1, halo: true },
  }[stage];
  const palKey = !tiel ? CFG.pal
    : stage <= 2 ? "tielChick" : stage === 6 ? "tielPearl" : "tiel";
  const P = PAL[palKey];
  const bellyHex = P.belly || "#f7f3e6", faceHex = P.face || "#dcf2f9";
  const root = new T.Group();
  const bird = new T.Group(); root.add(bird);
  const std = (o) => new T.MeshStandardMaterial(Object.assign({ roughness: 0.78, metalness: 0 }, o));

  // ---- ตัว+หัว: lathe รูปลูกแพร์ ระบายสีต่อ vertex (ฟ้าด้านบน/หลัง, ครีมหน้าอก, หน้าฟ้าอ่อน) ----
  const hk = CFG.headK, bk = CFG.bodyK;
  const prof = [[0, -1.0], [0.42 * bk, -0.97], [0.7 * bk, -0.82], [0.85 * bk, -0.52], [0.86 * bk, -0.18], [0.77 * bk, 0.12],
    [0.64 * hk, 0.36], [0.66 * hk, 0.6], [0.64 * hk, 0.86], [0.53 * hk, 1.08], [0.31 * hk, 1.24], [0, 1.3]]
    .map(([r, y]) => new T.Vector2(r, y));
  const spline = new T.SplineCurve(prof).getPoints(60);
  const bodyGeo = new T.LatheGeometry(spline, 64);
  bodyGeo.scale(1, 1, 0.9);
  const pos = bodyGeo.attributes.position, cols = [];
  const cTop = lin(P.top), cLow = lin(P.low), cCream = lin(bellyHex), cFace = lin(faceHex), tmp = new T.Color();
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const r = Math.hypot(x, z) || 1e-6;
    const front = z / r;                                   // 1 = หน้าตรง, -1 = หลัง
    tmp.copy(cLow).lerp(cTop, smooth(-0.9, 1.1, y));       // ฟ้าไล่จากล่างเข้มขึ้นไปบนอ่อน
    const belly = smooth(0.3, 0.85, front) * smooth(0.5, 0.12, y) * smooth(-1.02, -0.72, y);
    tmp.lerp(cCream, belly * 0.95);
    const face = tiel
      ? smooth(-0.15, 0.55, front) * smooth(0.3, 0.52, y)
      : smooth(0.45, 0.95, front) * smooth(0.36, 0.58, y) * smooth(0.98, 0.74, y);
    tmp.lerp(cFace, face * (tiel ? 0.95 : 0.6));
    cols.push(tmp.r, tmp.g, tmp.b);
  }
  bodyGeo.setAttribute("color", new T.Float32BufferAttribute(cols, 3));
  bodyGeo.computeVertexNormals();
  const body = new T.Mesh(bodyGeo, std({ vertexColors: true, roughness: 0.82 }));
  bird.add(body);

  // จุดบนผิวหัว (ใช้วางตา/ปาก): ศูนย์กลางหัวราว y 0.72 รัศมี ~0.66*hk (บีบ z 0.9)
  const headC = new T.Vector3(0, 0.72, 0), headR = 0.655 * hk;
  const onHead = (dx, dy, dz, k = 1) => {
    const d = new T.Vector3(dx, dy, dz).normalize();
    return new T.Vector3(headC.x + d.x * headR * k, headC.y + d.y * headR * k, headC.z + d.z * headR * 0.9 * k);
  };

  // ---- ปีกพับข้างตัว: ขนคลุมไหล่ฟ้าอ่อน -> โคบอลต์ -> ขนปลายปีกเข้ม (หมุนรอบหัวไหล่ได้) ----
  const wingGeo = (() => {
    const g = new T.SphereGeometry(1, 36, 28);
    const p = g.attributes.position, c = [];
    const w0 = lin(P.w0), w1 = lin(P.w1), w2 = lin(P.w2);
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i);                                 // -1 ล่าง .. 1 บน
      const t = smooth(0.75, -0.95, y);
      tmp.copy(w0).lerp(w1, smooth(0, 0.45, t)).lerp(w2, smooth(0.45, 1, t));
      c.push(tmp.r, tmp.g, tmp.b);
    }
    g.setAttribute("color", new T.Float32BufferAttribute(c, 3));
    return g;
  })();
  const makeWing = (side) => {
    const pivot = new T.Group();
    pivot.position.set(side * 0.66 * bk, 0.28, -0.02);
    const wl = CFG.wing;
    const cover = new T.Mesh(wingGeo, std({ vertexColors: true, roughness: 0.7 }));
    cover.scale.set(0.15, 0.62 * wl, 0.36);
    cover.position.set(side * 0.13, -0.5 * wl, -0.12);
    cover.rotation.set(-0.42, 0, side * 0.1);
    // ขนปลายปีก (primaries) ซ้อนด้านล่างหลัง
    const prim = new T.Mesh(new T.SphereGeometry(1, 28, 20), std({ color: lin(P.w2), roughness: 0.6 }));
    prim.scale.set(0.1, 0.5 * wl, 0.17);
    prim.position.set(side * 0.1, -0.98 * wl, -0.42);
    prim.rotation.set(-0.72, 0, side * 0.06);
    pivot.add(cover, prim);
    if (tiel && stage >= 3) {
      const bar = new T.Mesh(new T.SphereGeometry(1, 20, 14), std({ color: lin("#ffffff"), roughness: 0.85 }));
      bar.scale.set(0.06, 0.36 * wl, 0.15);
      bar.position.set(side * 0.22, -0.4 * wl, -0.01);
      bar.rotation.set(-0.42, 0, side * 0.1);
      pivot.add(bar);
    }
    return pivot;
  };
  const wingL = makeWing(-1), wingR = makeWing(1);
  bird.add(wingL, wingR);

  // ---- หาง: ขนแบนสั้นชี้ลงด้านหลัง ----
  let tail = null;
  if (CFG.tail) {
    tail = new T.Mesh(new T.SphereGeometry(1, 24, 16), std({ color: lin(P.tail), roughness: 0.6 }));
    tail.scale.set(tiel ? 0.16 : 0.2, (tiel ? 0.82 : 0.46) * CFG.tail, 0.06);
    tail.position.set(0, tiel ? -1.18 : -1.02, tiel ? -0.78 : -0.62);
    tail.rotation.set(-0.75, 0, 0);
    bird.add(tail);
  }

  // ---- ตา: ลูกตาน้ำตาลเข้มมันวาว + ขอบเปลือกตาจาง + จุดสะท้อนแสง ----
  const eyes = [];
  for (const side of [-1, 1]) {
    const eg = new T.Group();
    const p = onHead(side * 0.62, 0.14, 0.78, 0.97);
    eg.position.copy(p);
    eg.lookAt(p.clone().add(new T.Vector3(side * 0.62, 0.14, 0.78)));
    const ball = new T.Mesh(new T.SphereGeometry(CFG.eye, 24, 18), new T.MeshStandardMaterial({ color: lin("#24160f"), roughness: 0.12, metalness: 0.1 }));
    ball.scale.set(1, 1, 0.55);
    const ring = new T.Mesh(new T.TorusGeometry(CFG.eye * 1.02, CFG.eye * 0.2, 10, 28), std({ color: lin("#e8f6fb"), roughness: 0.9 }));
    const glint = new T.Mesh(new T.SphereGeometry(CFG.eye * 0.28, 12, 10), new T.MeshBasicMaterial({ color: 0xffffff }));
    glint.position.set(-CFG.eye * 0.32, CFG.eye * 0.36, CFG.eye * 0.5);
    eg.add(ball, ring, glint);
    bird.add(eg);
    eyes.push(eg);
  }

  // ---- ปากงุ้มชมพูอ่อน: โดมโคนปาก + ปลายแหลมโค้งลง ----
  const beakMat = std({ color: lin(tiel && stage >= 3 ? "#efd0bb" : "#f3c8c3"), roughness: 0.42 });   // lutino: ปากสีงาอมชมพู
  const beak = new T.Group();
  const bp = onHead(0, -0.22, 1, 0.93);
  beak.position.copy(bp);
  const dome = new T.Mesh(new T.SphereGeometry(0.2 * hk, 28, 20), beakMat);
  dome.scale.set(1.0, 0.95, 1.05);
  const hookGeo = new T.ConeGeometry(0.155 * hk, 0.27 * hk, 28, 1);
  hookGeo.translate(0, 0.135 * hk, 0);          // ฐานกรวยอยู่ที่จุดหมุน ปลายแหลมยื่นออกไป
  const hook = new T.Mesh(hookGeo, beakMat);
  hook.position.set(0, -0.05, 0.08);
  hook.rotation.set(Math.PI - 0.22, 0, 0);           // ชี้ลงและเยื้องไปข้างหน้า (ปากงุ้ม)
  hook.scale.set(1, 1, 0.85);
  const lower = new T.Mesh(new T.SphereGeometry(0.08 * hk, 16, 12), std({ color: lin(tiel && stage >= 3 ? "#d6ab95" : "#d99c98"), roughness: 0.5 }));
  lower.position.set(0, -0.2, -0.02);
  beak.add(dome, hook, lower);
  bird.add(beak);

  // ---- cockatiel: หงอนเหลืองปลายเทา + แก้มส้ม ----
  if (tiel) {
    const cheekMat = std({ color: lin(stage <= 2 ? "#fbc58a" : "#f59e0b"), roughness: 0.7 });
    for (const side of [-1, 1]) {
      const p = onHead(side * 0.86, -0.2, 0.5, 0.99);
      const ck = new T.Mesh(new T.SphereGeometry(0.15 * hk, 20, 14), cheekMat);
      ck.position.copy(p);
      ck.lookAt(p.clone().add(new T.Vector3(side * 0.86, -0.2, 0.5)));
      ck.scale.set(1, 1, 0.3);
      bird.add(ck);
    }
    if (stage >= 3) {
      const crestLen = stage === 3 ? 0.4 : stage === 4 ? 0.55 : 0.72;
      const cGeo = new T.ConeGeometry(0.06, crestLen, 12, 6);
      cGeo.translate(0, crestLen / 2, 0);
      const cp = cGeo.attributes.position, cc = [];
      const cBase = lin(P.face), cTip = lin(stage === 6 ? "#f6e3a4" : "#f8edc4");   // หงอนเหลือง ปลายซีดลง
      for (let i = 0; i < cp.count; i++) { tmp.copy(cBase).lerp(cTip, smooth(0.35, 1, cp.getY(i) / crestLen)); cc.push(tmp.r, tmp.g, tmp.b); }
      cGeo.setAttribute("color", new T.Float32BufferAttribute(cc, 3));
      const crestMat = std({ vertexColors: true, roughness: 0.7 });
      [[-0.07, 0.2, -0.35], [0.0, 0.26, -0.2], [0.07, 0.22, -0.3], [0.0, 0.12, -0.55]].forEach(([x, z, tilt], i) => {
        const fth = new T.Mesh(cGeo, crestMat);
        fth.position.set(x, 1.2 * hk, z * hk);
        fth.rotation.set(tilt, 0, x * 1.4);
        fth.scale.setScalar(1 - i * 0.08);
        bird.add(fth);
      });
    }
  }

  // ---- ขนฟูบนหัว (ร่างเด็ก) ----
  if (CFG.fuzz) {
    for (const [x, rz] of [[-0.08, 0.5], [0.02, -0.1], [0.1, -0.6]]) {
      const tuft = new T.Mesh(new T.ConeGeometry(0.035, 0.2, 8), std({ color: lin(P.top) }));
      tuft.position.set(x, 1.24 * hk + 0.06, 0.02);
      tuft.rotation.z = rz;
      bird.add(tuft);
    }
  }

  // ---- เท้าชมพู: 3 นิ้วหน้า 1 นิ้วหลัง ----
  const toeMat = std({ color: lin("#eab4b4"), roughness: 0.55 });
  for (const side of [-1, 1]) {
    const foot = new T.Group();
    foot.position.set(side * 0.3, -0.98, 0.18);
    for (const a of [-0.45, 0, 0.45, Math.PI]) {
      const toe = new T.Mesh(new T.CylinderGeometry(0.04, 0.05, 0.3, 10), toeMat);
      toe.geometry.translate(0, 0.15, 0);
      toe.rotation.set(Math.PI / 2 - 0.25, 0, 0);
      const holder = new T.Group(); holder.rotation.y = a + side * 0.12; holder.add(toe);
      foot.add(holder);
    }
    bird.add(foot);
  }

  // ---- เงาใต้เท้า ----
  const shadowTex = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d"); const gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
    gr.addColorStop(0, "rgba(40,50,90,.45)"); gr.addColorStop(1, "rgba(40,50,90,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new T.CanvasTexture(c);
  })();
  const shadow = new T.Mesh(new T.PlaneGeometry(2, 1.1), new T.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = -1.06 * CFG.s;
  shadow.scale.setScalar(0.35 + CFG.s * 0.65);
  root.add(shadow);

  // ---- ร่างสุดท้าย: รัศมีฟ้าด้านหลัง + ประกายลอยรอบตัว ----
  const sparkles = [];
  if (CFG.halo) {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const g = c.getContext("2d"); const gr = g.createRadialGradient(128, 128, 10, 128, 128, 126);
    if (tiel) { gr.addColorStop(0, "rgba(253,230,138,.85)"); gr.addColorStop(.6, "rgba(254,243,199,.35)"); gr.addColorStop(1, "rgba(254,243,199,0)"); }
    else { gr.addColorStop(0, "rgba(191,231,255,.9)"); gr.addColorStop(.6, "rgba(219,234,254,.35)"); gr.addColorStop(1, "rgba(219,234,254,0)"); }
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    const halo = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(c), depthWrite: false, transparent: true }));
    halo.scale.set(3.6, 3.6, 1); halo.position.set(0, 0.2, -1.2);
    root.add(halo);
    const sm = new T.MeshBasicMaterial({ color: lin("#fde68a") });
    for (let i = 0; i < 5; i++) {
      const sp = new T.Mesh(new T.OctahedronGeometry(0.07), sm);
      sp.userData = { a: (i / 5) * Math.PI * 2 + 0.6, r: 1.35 + (i % 2) * 0.2, y: 0.2 + ((i * 37) % 10) / 10 };
      sp.position.set(Math.cos(sp.userData.a) * sp.userData.r, sp.userData.y, Math.sin(sp.userData.a) * sp.userData.r);
      root.add(sp); sparkles.push(sp);
    }
  }

  bird.scale.setScalar(CFG.s);
  return { root, bird, body, wingL, wingR, tail, eyes, sparkles };
}

function makePetRenderer(T, opts) {
  const r = new T.WebGLRenderer(Object.assign({ antialias: true, alpha: true }, opts));
  r.outputEncoding = T.sRGBEncoding;
  r.setClearColor(0x000000, 0);
  return r;
}
function petScene(T, model) {
  const scene = new T.Scene();
  scene.add(new T.HemisphereLight(0xffffff, 0x8e9fc9, 0.62));
  const key = new T.DirectionalLight(0xffffff, 0.78); key.position.set(1.6, 2.2, 3); scene.add(key);
  const rim = new T.DirectionalLight(0xdbeafe, 0.55); rim.position.set(-2, 1.4, -2.5); scene.add(rim);
  scene.add(model.root);
  const cam = new T.PerspectiveCamera(30, 1, 0.1, 50);
  cam.position.set(0, 0.35, 6.4); cam.lookAt(0, 0.12, 0);
  return { scene, cam };
}

/* ภาพนิ่ง (มุมสามส่วนสี่ ให้เห็นความเป็น 3D) — cache ต่อร่าง+ขนาด */
function petSnapshot(T, stage, px, species) {
  const key = species + ":" + stage + ":" + px;
  if (pet3d.cache.has(key)) return pet3d.cache.get(key);
  if (!pet3d.snapR) pet3d.snapR = makePetRenderer(T, { preserveDrawingBuffer: true });
  const r = pet3d.snapR;
  r.setPixelRatio(1); r.setSize(px, px, false);
  const model = buildParrotlet3D(T, stage, species);
  model.root.rotation.y = 0.42;
  const { scene, cam } = petScene(T, model);
  r.render(scene, cam);
  const url = r.domElement.toDataURL("image/png");
  pet3d.cache.set(key, url);
  scene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) (o.material.map && o.material.map.dispose(), o.material.dispose()); });
  return url;
}

/* วิวสด: ใช้ renderer ตัวเดียวย้าย canvas ไปกล่องใหม่ทุกครั้งที่หน้า render ใหม่ */
function mountLivePet(T, el, stage, species) {
  let L = pet3d.live;
  if (!L) {
    const r = makePetRenderer(T);
    const canvas = r.domElement;
    canvas.className = "pet3d-canvas";
    canvas.setAttribute("aria-label", "3D pet — drag or use arrow keys to rotate");
    canvas.setAttribute("role", "img");
    canvas.tabIndex = 0;
    canvas.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault();
      L.vel = e.key === "ArrowLeft" ? -0.06 : 0.06; L.idle = performance.now();
    });
    L = pet3d.live = { r, canvas, key: "", model: null, scene: null, cam: null, rotY: 0.35, vel: 0, drag: null, idle: 0, running: false };
    canvas.addEventListener("pointerdown", (e) => { L.drag = { x: e.clientX, last: e.clientX }; L.vel = 0; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointermove", (e) => {
      if (!L.drag) return;
      const dx = e.clientX - L.drag.last; L.drag.last = e.clientX;
      L.rotY += dx * 0.012; L.vel = dx * 0.012;
    });
    const end = () => { L.drag = null; L.idle = performance.now(); };
    canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end);
  }
  if (L.key !== species + ":" + stage) {
    if (L.scene) L.scene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) (o.material.map && o.material.map.dispose(), o.material.dispose()); });
    L.model = buildParrotlet3D(T, stage, species);
    Object.assign(L, petScene(T, L.model));
    L.key = species + ":" + stage;
  }
  el.innerHTML = "";
  el.appendChild(L.canvas);
  el.insertAdjacentHTML("beforeend", '<span class="pet3d-hint" aria-hidden="true">↔ drag to spin</span>');
  const size = Math.max(64, Math.round(el.clientWidth || 150));
  L.r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  L.r.setSize(size, size, false);
  if (!L.running) { L.running = true; requestAnimationFrame(livePetFrame); }
}

function livePetFrame(now) {
  const L = pet3d.live;
  if (!L || !L.canvas.isConnected || document.hidden) { if (L) L.running = false; return; }
  const m = L.model, t = now / 1000;
  const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!L.drag) {
    L.rotY += L.vel; L.vel *= 0.92;                     // ปล่อยนิ้วแล้วหมุนต่อแบบมีแรงเฉื่อย
    if (!calm && Math.abs(L.vel) < 0.002 && now - L.idle > 1500) {
      const target = 0.35 + Math.sin(t * 0.5) * 0.35;   // ว่างๆ ก็หันซ้ายขวาช้าๆ
      L.rotY += (target - L.rotY) * 0.02;
    }
  }
  m.root.rotation.y = L.rotY;
  if (!calm) {
    m.body.scale.set(1 + Math.sin(t * 2) * 0.012, 1 + Math.sin(t * 2) * 0.018, 1);      // หายใจ
    const flap = Math.max(0, Math.sin(t * 1.1) ** 24);                                   // กระพือปีกเป็นพักๆ
    m.wingL.rotation.z = -flap * 0.5; m.wingR.rotation.z = flap * 0.5;
    if (m.tail) m.tail.rotation.y = Math.sin(t * 1.7) * 0.15;
    m.bird.position.y = Math.abs(Math.sin(t * 1.1)) ** 24 * 0.05;
    m.bird.rotation.z = Math.sin(t * 0.8) * 0.03;
    m.sparkles.forEach((s, i) => {
      const a = s.userData.a + t * 0.5;
      s.position.set(Math.cos(a) * s.userData.r, s.userData.y + Math.sin(t * 2 + i) * 0.1, Math.sin(a) * s.userData.r);
      s.rotation.y = t * 2;
    });
  }
  const blink = (t % 4.2) < 0.13 ? 0.12 : 1;                                             // กะพริบตา
  m.eyes.forEach(e => { e.scale.y = blink; });
  L.r.render(L.scene, L.cam);
  requestAnimationFrame(livePetFrame);
}

/* สลับภาพวาดเป็น 3D ในทุกจุดที่ยังไม่ได้สลับ */
function hydratePets() {
  const els = document.querySelectorAll(".pet3d:not([data-h])");
  if (!els.length || pet3d.status === "failed") return;
  if (!window.THREE) {
    if (pet3d.status !== "loading") {
      pet3d.status = "loading";
      loadThree().then(() => { pet3d.status = "ready"; hydratePets(); })
        .catch(() => { pet3d.status = "failed"; });
    }
    return;
  }
  const T = window.THREE;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let liveUsed = false;
  for (const el of els) {
    el.setAttribute("data-h", "1");
    const stage = Number(el.dataset.stage);
    const species = el.dataset.species === "cockatiel" ? "cockatiel" : "parrotlet";
    try {
      const box = el.closest(".pp-pet[data-live]");
      if (!liveUsed && box) {
        mountLivePet(T, el, stage, species);
        liveUsed = true;
      } else {
        const css = Math.max(24, el.clientWidth || el.parentElement?.clientWidth || 48);
        const px = Math.min(512, Math.ceil((css * dpr) / 32) * 32);
        const img = new Image();
        img.className = "pet3d-img"; img.alt = ""; img.src = petSnapshot(T, stage, px, species);
        el.innerHTML = ""; el.appendChild(img);
      }
    } catch (err) {
      pet3d.status = "failed";   // ไม่มี WebGL ฯลฯ -> ปล่อยภาพวาดเดิมไว้
      console.warn("3D pet unavailable:", err);
      return;
    }
  }
}

let petSvgSeq = 0;
function petSvg(level, speciesOverride) {
  // ปัดเป็นจำนวนเต็มและกัน NaN/undefined (เช่น xp เพี้ยนจากไฟล์ import)
  const n = Math.round(Number(level));
  const stage = Number.isFinite(n) ? Math.max(1, Math.min(n, PET_STAGE_COUNT)) : 1;
  const species = speciesOverride === "cockatiel" || speciesOverride === "parrotlet" ? speciesOverride : petSpecies();
  // id ต้องไม่ซ้ำข้ามอินสแตนซ์ (หน้าเดียวกันวาดสัตว์เลี้ยงได้หลายตัว)
  const uid = ++petSvgSeq;
  const id = (k) => `pet${stage}-${k}-${uid}`;
  // ภาพวาดสำรองระหว่างโหลด/ไม่มี WebGL — hydratePets() จะสลับเป็นโมเดล 3D
  const small = stage < 3 ? ` style="transform:scale(${stage === 1 ? 0.66 : 0.8});transform-origin:50% 88%"` : "";
  const svg = `<svg class="pet-svg" viewBox="0 0 100 100" aria-hidden="true"${small}>${parrotletInner(Math.max(3, stage), id, species)}</svg>`;
  return `<span class="pet3d" data-stage="${stage}" data-species="${species}" role="img" aria-label="${esc(stageName(stage, species))}">${svg}</span>`;
}

function levelInfo() {

  const custom = petCustomName();
  return { name: custom || stageName(stage), stageName: stageName(stage), custom: !!custom };
}
function addXp(n) {
  const before = levelInfo().level;
  state.game.xp = Math.max(0, state.game.xp + n);
  if (levelInfo().level > before) {

}

/** นับ streak ต่อเนื่องล่าสุด (จบที่วันนี้ หรือเมื่อวานถ้ายังไม่ได้ check-in วันนี้) */
function currentStreak() {
  const d = new Date();
  if (!state.game.checkins[dateKey(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while (state.game.checkins[dateKey(d)]) {
    n++;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

/* ---------- pet page + focus session (สไตล์ Foku) ---------- */
let petView = null;        // null | main | setup | running | done
let focusCatId = null;     // หมวดที่เลือกโฟกัส
let focusMin = 25;         // นาทีที่ตั้ง
let focusEndsAt = null;    // timestamp จบ
let focusTimer = null;     // interval อัปเดตนาฬิกา
let focusEarnedXp = 0;

const FOCUS_PRESETS = [5, 10, 15, 25, 30, 45, 60];
const PET_LINES = [
  "I'm ready to focus! Let's set up a timer!",
  "Let's get one thing done together!",
  "Pick a task — I'll cheer you on!",
  "Focus time? I'm in!",
];

function openPet() { petView = "main"; viewTransition = true; render(); }
function closePet() {
  petView = null;
  if (focusTimer) { clearInterval(focusTimer); focusTimer = null; }
  focusEndsAt = null;
  viewTransition = true;
  render();
}
function petStats() {
  const doneToday = state.tasks.filter(t => t.status === "done" && t.doneAt && isToday(new Date(t.doneAt))).length;
  const rtDone = state.routines.filter(r => routineDone(r.id)).length;
  const focusToday = state.game.focus[dateKey(new Date())] || 0;
  const happiness = Math.min(100, 45 + currentStreak() * 8 + doneToday * 4);
  const energy = Math.min(100, 35 + doneToday * 8 + rtDone * 10 + Math.round(focusToday / 5) * 5);
  return { happiness, energy, focusToday };
}
function startFocusSetup() { petView = "setup"; if (!focusCatId) focusCatId = activeCategories()[0]?.id || null; viewTransition = true; render(); }
function setFocusMin(n) { focusMin = Math.max(1, Math.min(180, n)); render(); }
function startFocus() {
  focusEndsAt = Date.now() + focusMin * 60000;
  petView = "running";
  viewTransition = true;
  render();
  focusTimer = setInterval(focusTick, 500);
}
function focusTick() {
  if (petView !== "running" || !focusEndsAt) return;
  const left = focusEndsAt - Date.now();
  if (left <= 0) return finishFocus();
  const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
  const clock = document.getElementById("focusClock");
  if (clock) clock.textContent = m + ":" + String(s).padStart(2, "0");
  const bar = document.getElementById("focusBar");
  if (bar) bar.style.width = (100 - left / (focusMin * 60000) * 100) + "%";
}
function finishFocus() {
  clearInterval(focusTimer); focusTimer = null;
  focusEndsAt = null;
  const k = dateKey(new Date());
  state.game.focus[k] = (state.game.focus[k] || 0) + focusMin;
  focusEarnedXp = Math.max(5, focusMin); // +1 XP ต่อนาที (ขั้นต่ำ 5)
  addXp(focusEarnedXp);
  save();
  petView = "done";
  viewTransition = true;
  render();
  if ("Notification" in window && Notification.permission === "granted" && !state.meta.notifOff) {
    new Notification("🎉 Focus complete!", { body: focusMin + " minutes — +" + focusEarnedXp + " XP" });
  }
}
function giveUpFocus() {
  if (!confirm("Give up this focus session? No XP will be earned.")) return;
  clearInterval(focusTimer); focusTimer = null;
  focusEndsAt = null;
  petView = "main";
  viewTransition = true;
  render();
}

/** อายุจากวันเกิด/วันฟัก เช่น "2y 3m" หรือ "8m" */
function ageText(hatchDate) {
  if (!hatchDate) return "";
  const b = new Date(hatchDate + "T00:00:00");
  const now = new Date();
  let months = (now.getFullYear() - b.getFullYear()) * 12 + (now.getMonth() - b.getMonth());
  if (now.getDate() < b.getDate()) months--;
  if (months < 0) return "";
  const y = Math.floor(months / 12), m = months % 12;
  if (y === 0) return m + "m old";
  return y + "y" + (m ? " " + m + "m" : "") + " old";
}
function latestWeight(p) {

/** กราฟน้ำหนักย้อนหลัง (สูงสุด 12 จุด) */
function weightChartSvg(p) {
  const pts = p.records.filter(r => r.type === "weight" && r.grams)
    .sort((a, b) => a.date.localeCompare(b.date)).slice(-12);
  if (pts.length < 2) return "";
  const w = 280, h = 64, pad = 6;
  const vals = pts.map(r => Number(r.grams));
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const xy = vals.map((v, i) => [
    pad + i * (w - pad * 2) / (vals.length - 1),
    h - pad - (v - min) / span * (h - pad * 2),
  ]);
  const line = xy.map(c => c.map(n => n.toFixed(1)).join(",")).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" class="wt-chart" aria-label="Weight history">
    <polyline points="${line}" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${xy.map((c, i) => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${i === xy.length - 1 ? 3.5 : 2}" fill="#06b6d4"/>`).join("")}
  </svg>
  <div class="wt-range"><span>${min} g</span><span>${max} g</span></div>`;
}

/** ผู้ใช้กำลังลากเลือกข้อความอยู่ -> คลิกนั้นคือการเลือกข้อความ ไม่ใช่กดเปิดรายละเอียด/ติ๊กงาน */
function textSelected() {
  const sel = window.getSelection ? window.getSelection() : null;
  return !!sel && !sel.isCollapsed && sel.toString().trim().length > 0;
}
/** คัดลอกข้อความลง clipboard (สำรองด้วย execCommand สำหรับเบราว์เซอร์/บริบทที่ไม่มี Clipboard API) */
async function copyText(text, what) {
  try {
    await navigator.clipboard.writeText(text);
    showToast("📋 Copied " + what);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    ta.remove();
    showToast(ok ? "📋 Copied " + what : "❌ Copy failed — select the text and copy instead");
  }
}

function showToast(msg) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.setAttribute("role", "status");
  el.setAttribute("aria-live", "polite");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("show"), 30);
  setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 350); }, 2800);
}

/* ---------- task ops ---------- */
function toggleDone(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const nowDone = t.status === "open";
  t.status = nowDone ? "done" : "open";
  t.doneAt = nowDone ? new Date().toISOString() : null;
  if (nowDone && t.recurrence !== "none" && t.dueAt) {
    const next = nextDueDate(new Date(t.dueAt), t.recurrence);
    if (next) {
      // งานแบบช่วงวัน (range) ที่ทำซ้ำ — เลื่อน endDate ตามไปด้วยเท่าจำนวนวันเดิม เพื่อคงความยาวช่วงเท่าเดิม
      let nextEndDate = null;
      if (t.endDate) {
        const spanDays = Math.round((new Date(t.endDate + "T00:00:00") - startOfDay(new Date(t.dueAt))) / 86400000);
        const nextEnd = new Date(next); nextEnd.setDate(nextEnd.getDate() + spanDays);
        nextEndDate = dateKey(nextEnd);
      }
      state.tasks.push({
        ...t, id: uid(), dueAt: next.toISOString(), endDate: nextEndDate,
        status: "open", doneAt: null, notifiedAt: null,
        createdAt: new Date().toISOString(),
      });
    }
  }
  addXp(nowDone ? 5 : -5);
  lastToggled = id;
  save(); render();
  setTimeout(() => { lastToggled = null; }, 400);
}

/* ---------- shared rendering ---------- */
/** date/time/datetime-local inputs ไม่ submit ฟอร์มเองตอนกด Enter (พฤติกรรม default ของ Chrome) — เลย submit เองแทน
 * บาง sheet (schedule, checklist) ไม่มี <form> ครอบ ก็กดปุ่ม Save หลักของ sheet นั้นแทน */
function submitOnEnter(e) {
  if (e.key !== "Enter") return;
  e.preventDefault();
  if (e.target.form) { e.target.form.requestSubmit(); return; }
  e.target.closest(".sheet")?.querySelector(".btn-primary")?.click();
}
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function catById(id) { return state.categories.find(c => c.id === id); }

/* ---------- โปรเจกต์ย่อยในหมวด (เช่น Work -> ลูกค้า A / งานวิจัย B) ----------
   เก็บใน cat.projects = [{id, name, color}] + task.projectId — อยู่ใน blob categories/tasks เดิม
   จึง sync ข้ามเครื่องได้เลยโดยไม่ต้องแก้ส่วน sync; task ที่ projectId หาไม่เจอ (โปรเจกต์ถูกลบ/ย้ายหมวด) ถือว่าไม่มีโปรเจกต์ */
let todayProject = null;   // โปรเจกต์ที่เปิดอยู่ในหน้าหมวด (null = หน้าหมวดปกติ)
function catProjects(cat) { return cat && Array.isArray(cat.projects) ? cat.projects : []; }
function projectOf(t) {
  if (!t || !t.projectId) return null;
  return catProjects(catById(t.categoryId)).find(p => p.id === t.projectId) || null;
}
function openProject(catId, pid) { todayCat = catId; todayProject = pid; viewTransition = true; render(); }

        </label>
        <button type="submit" class="btn btn-primary">Save</button>
        ${p ? `<button type="button" class="btn btn-danger-outline" onclick="deleteProject('${cat.id}', '${p.id}')">Delete project</button>` : ""}
      </form>
    </div>
  </div>`;
  setTimeout(() => document.getElementById("pName")?.focus(), 50);
}

function saveProject(e, catId, pid) {
  e.preventDefault();
  const cat = catById(catId);
  const name = document.getElementById("pName").value.trim();
  if (!cat || !name) return;
  if (!Array.isArray(cat.projects)) cat.projects = [];
  if (cat.projects.some(x => x.id !== pid && x.name.toLowerCase() === name.toLowerCase())) {
    showToast("❌ มีโปรเจกต์ชื่อนี้ในหมวดนี้แล้ว");
    return;
  }
  if (pid) {
    const p = cat.projects.find(x => x.id === pid);
    if (p) p.name = name;
  } else {
    cat.projects.push({ id: uid(), name, color: COLORS[cat.projects.length % COLORS.length] });
  }
  save(); closeForm(); render();
}

function deleteAgentProject(catId) {
  const cat = catById(catId);
  if (!cat || !isAgentCategory(cat)) return;
  const n = state.tasks.filter(t => t.categoryId === catId).length;
  if (!confirm(`Delete project "${agentCatLabel(cat)}" and its ${n} task${n === 1 ? "" : "s"}?\nงานที่ AI บันทึกเข้ามาใหม่ในชื่อนี้จะสร้างโปรเจกต์ขึ้นมาใหม่`)) return;
  state.categories = state.categories.filter(c => c.id !== catId);
  state.tasks = state.tasks.filter(t => t.categoryId !== catId);
  todayCat = agentCategories().length ? AI_HUB : null;
  todayProject = null;
  save(); render();
}

function deleteProject(catId, pid) {
  const cat = catById(catId);
  if (!cat) return;
  if (!confirm("Delete this project? Its tasks stay in " + cat.name + " without a project.")) return;
  cat.projects = catProjects(cat).filter(p => p.id !== pid);
  state.tasks.forEach(t => { if (t.categoryId === catId && t.projectId === pid) t.projectId = null; });
  if (todayProject === pid) todayProject = null;
  save(); closeForm(); render();
}

    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleDone('${t.id}')}"

        ${proj && !(currentTab === "home" && todayCat === t.categoryId && todayProject === proj.id) ? `<span class="chip" style="background:color-mix(in srgb, ${proj.color} 14%, var(--card));color:color-mix(in srgb, ${proj.color} 55%, var(--fg))">${icon("folder", 10)} ${esc(proj.name)}</span>` : ""}
      </div>

      onkeydown="event.stopPropagation()">${icon("edit", 15)}</button>

/** บรรทัดตัวอย่างใต้ชื่องาน — ข้ามบรรทัดที่ระบบใส่เอง ("⏱ ช่วงเวลา", "(auto) สรุปจาก git...")
 *  ไปเอาบรรทัดเนื้อหาจริงก่อน ไม่งั้นงาน AI ทุกอันจะโชว์แค่เวลาเหมือนกันหมด */
function firstNoteLine(note) {
  const p = parseAgentNote(note);
  const firstText = s => s.split("\n").map(x => x.trim()).find(x => x && !x.startsWith("(auto)")) || "";
  let line = "";
  if (p.added[0]) line = "Added: " + p.added[0];
  else if (p.changed[0]) line = "Improved: " + p.changed[0];
  else if (p.fixed[0]) line = "Fixed: " + p.fixed[0];
  else line = firstText(p.details) || p.time;
  return line.length > 140 ? line.slice(0, 137) + "…" : line;
}

/** หน้าอ่านรายละเอียดงาน (อ่านอย่างเดียว — มีปุ่มไปแก้ไข) */
function openTaskDetail(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const cat = catById(t.categoryId);
  const catName = cat ? (isAgentCategory(cat) ? agentCatLabel(cat) : cat.name) : "No category";
  const chips = [
    cat ? `<span class="chip" style="background:color-mix(in srgb, ${cat.color} 16%, var(--card));color:color-mix(in srgb, ${cat.color} 55%, var(--fg))">${esc(catName)}</span>` : "",
    `<span class="chip" style="background:color-mix(in srgb, ${t.status === "done" ? "#10b981" : "#6366f1"} 16%, var(--card));color:color-mix(in srgb, ${t.status === "done" ? "#10b981" : "#6366f1"} 55%, var(--fg))">${t.status === "done" ? "Done" : "Open"}</span>`,
    t.recurrence && t.recurrence !== "none" ? `<span class="chip" style="background:var(--bg);color:var(--muted)">${icon("repeat", 10)} ${RECURRENCE_LABELS[t.recurrence]}</span>` : "",
  ].join("");
  const p = parseAgentNote(t.note);

  if (p.time) rows.push(`<div class="detail-row"><span class="k">Time spent</span><span>${esc(p.time.replace(/^⏱\s*/, ""))}</span></div>`);
  if (t.dueAt) rows.push(`<div class="detail-row"><span class="k">${isRangeTask(t) ? "Dates" : "Due"}</span><span>${fmtSpan(t)}</span></div>`);
  if (t.status === "done" && t.doneAt) rows.push(`<div class="detail-row"><span class="k">Finished</span><span>${fmtDateTime(new Date(t.doneAt))}</span></div>`);
  // โน้ตแบบมีหัวข้อ -> แยกเป็นกลุ่ม เพิ่ม/ปรับปรุง/แก้บั๊ก + รายละเอียด; แบบเก่า -> โชว์ทั้งก้อน
  const kindBlocks = CHANGE_KINDS.filter(k => p[k.key].length).map(k => `
