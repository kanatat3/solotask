<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Send a request · Kodo</title>
<link rel="icon" href="kodo-list-32.png">
<style>
  /* โทเคนชุดเดียว: 60% พื้นกลาง (bg) · 30% การ์ด/ช่อง (card, field) · 10% accent เฉพาะปุ่มหลัก/โฟกัส/สถานะที่ต้องเห็น */
  :root {
    --bg: #f3f4f8; --card: #fff; --field: #f6f7fb; --fg: #1e2335; --muted: #61667d; --border: #e3e6ef;
    --primary: #5b5bd6; --primary-ink: #fff; --primary-soft: #eef0ff; --danger: #c2410c; --ok: #047857;
    --r-sm: .7rem; --r-md: .95rem; --r-lg: 1.35rem;
    /* เงาแบบแสงจริง: key (คม ใกล้) + ambient (ฟุ้ง จาง) ตกลงล่างอย่างเดียว ย้อมสีพื้น */
    --shadow-sm: 0 1px 2px rgba(40, 44, 90, .08), 0 2px 8px rgba(40, 44, 90, .05);
    --shadow-md: 0 2px 4px rgba(40, 44, 90, .07), 0 12px 32px -8px rgba(40, 44, 90, .14);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #0f1220; --card: #181c2e; --field: #11152a; --fg: #e8eaf3; --muted: #a2a8bf; --border: #2a3047;
    --primary: #8b8cf6; --primary-ink: #11132a; --primary-soft: #23264a; --danger: #fca5a5; --ok: #6ee7b7;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3); --shadow-md: 0 2px 4px rgba(0, 0, 0, .3), 0 12px 32px -8px rgba(0, 0, 0, .45);
  } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif; }
  main { max-width: 36rem; margin: 0 auto; padding: max(1.4rem, env(safe-area-inset-top)) 1rem 3rem; }
  .brand { display: flex; align-items: center; gap: .55rem; font-weight: 800; letter-spacing: -.01em; margin: 0 .2rem 1rem; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; box-shadow: var(--shadow-sm); }
  .card { background: var(--card); border-radius: var(--r-lg); padding: 1.4rem 1.25rem 1.3rem; box-shadow: var(--shadow-md); }
  .eyebrow { display: inline-flex; align-items: center; gap: .35rem; font-size: .74rem; font-weight: 700; color: var(--muted); background: var(--field);
    border-radius: 999px; padding: .2rem .65rem .2rem .5rem; margin-bottom: .6rem; max-width: 100%; }
  .eyebrow b { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h1 { font-size: 1.4rem; line-height: 1.25; letter-spacing: -.015em; margin: 0 0 .3rem; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 1.2rem; }
  .field { margin-bottom: 1rem; }
  label, .lbl { display: flex; align-items: baseline; gap: .4rem; font-size: .84rem; font-weight: 700; margin: 0 0 .4rem; }
  label .opt, .lbl .opt { font-weight: 500; color: var(--muted); font-size: .78rem; }
  input[type=text], textarea { width: 100%; font: inherit; color: var(--fg); background: var(--field); border: 1.5px solid transparent;
    border-radius: var(--r-sm); padding: .75rem .85rem; transition: border-color .15s ease-out, background .15s ease-out; }
  input[type=text]::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 85%, transparent); }
  textarea { min-height: 10rem; resize: vertical; }
  input:focus-visible, textarea:focus-visible { outline: none; border-color: var(--primary); background: var(--card); }
  .drop { display: flex; align-items: center; gap: .8rem; width: 100%; text-align: left; border: 1.5px dashed var(--border); border-radius: var(--r-md);
    padding: .8rem .9rem; background: transparent; color: var(--fg); font: inherit; cursor: pointer; transition: border-color .15s ease-out, background .15s ease-out; }
  .drop .ico-box { flex-shrink: 0; width: 2.4rem; height: 2.4rem; border-radius: .7rem; display: grid; place-items: center; background: var(--field); color: var(--muted); }
  .drop .t { font-size: .88rem; font-weight: 700; }
  .drop .hint { font-size: .74rem; color: var(--muted); }
  .drop:hover, .drop:focus-visible, .drop.over { border-color: var(--primary); background: var(--primary-soft); outline: none; }
  .drop.over .ico-box, .drop:hover .ico-box { color: var(--primary); background: var(--card); }
  .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr)); gap: .5rem; margin-top: .6rem; }
  .files:empty { display: none; }
  .file { position: relative; border-radius: var(--r-sm); overflow: hidden; background: var(--field); font-size: .7rem; box-shadow: var(--shadow-sm); }
  .file img { display: block; width: 100%; height: 5.5rem; object-fit: cover; }
  .file .ico { height: 5.5rem; display: grid; place-items: center; color: var(--muted); }
  .file .nm { padding: .35rem .45rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file button { position: absolute; top: .3rem; right: .3rem; width: 1.75rem; height: 1.75rem; border-radius: 50%; border: none; display: grid; place-items: center;
    background: rgba(17, 19, 42, .62); color: #fff; cursor: pointer; }
  .btn { display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; min-height: 3rem; margin-top: 1.3rem; padding: .8rem;
    border: none; border-radius: var(--r-md); background: var(--primary); color: var(--primary-ink); font: inherit; font-weight: 800; cursor: pointer;
    box-shadow: 0 1px 2px rgba(60, 60, 160, .2), 0 8px 20px -8px rgba(60, 60, 160, .45); transition: transform .12s ease-out, filter .15s ease-out; }
  .btn:hover:not(:disabled) { filter: brightness(1.06); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  .btn:disabled { background: var(--field); color: var(--muted); box-shadow: none; cursor: not-allowed; }
  .btn.busy:disabled { background: var(--primary); color: var(--primary-ink); opacity: .85; cursor: progress; }
  .spin { width: 1rem; height: 1rem; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { margin-top: .75rem; font-size: .84rem; color: var(--muted); min-height: 1.2em; }
  .msg.err { color: var(--danger); font-weight: 600; } .msg.ok { color: var(--ok); }
  .prog { height: .35rem; border-radius: 999px; background: var(--field); overflow: hidden; margin-top: .45rem; }
  .prog span { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .25s ease-out; }
  .done { text-align: center; padding: 1.2rem .4rem .4rem; }
  .done .badge { width: 3.6rem; height: 3.6rem; margin: 0 auto .9rem; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ok) 14%, var(--card)); color: var(--ok); }
  .done .btn { max-width: 16rem; margin: 1.2rem auto 0; }
  /* skeleton ตอนโหลดลิงก์ — รูปทรงเดียวกับฟอร์มจริง */
  .sk { background: linear-gradient(90deg, var(--field) 0%, color-mix(in srgb, var(--field) 55%, var(--card)) 50%, var(--field) 100%); background-size: 200% 100%; animation: sk 1.2s ease-in-out infinite; border-radius: .5rem; }
  @keyframes sk { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  @media (prefers-reduced-motion: reduce) { .sk, .spin { animation: none; } .btn, .drop, input, textarea { transition: none; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="kodo-list-192.png" alt="">Kodo</div>
  <div class="card" id="app" aria-busy="true"><span class="sr-only">Loading the request form…</span>
    <div class="sk" style="width:38%;height:1.3rem;margin-bottom:.8rem"></div>
    <div class="sk" style="width:72%;height:1.6rem;margin-bottom:.5rem"></div>
    <div class="sk" style="width:90%;height:.9rem;margin-bottom:1.4rem"></div>
    <div class="sk" style="width:40%;height:.9rem;margin-bottom:.45rem"></div>
    <div class="sk" style="height:10rem;margin-bottom:1rem;border-radius:.7rem"></div>
    <div class="sk" style="height:3.6rem;margin-bottom:1rem;border-radius:.95rem"></div>
    <div class="sk" style="height:3rem;border-radius:.95rem"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(() => {
  const SB_URL = "https://towguwjwflxrfiidpken.supabase.co";
  const SB_KEY = "sb_publishable_nyM22Il9GueZ6gOBnM002A_xSfZYUop";   // publishable key — ส่งได้แค่ผ่านฟังก์ชันที่ตรวจลิงก์
  const BUCKET = "request-files";
  const MAX_FILES = 10, MAX_SIZE = 10 * 1024 * 1024;
  const TYPES = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "image/gif": "gif", "image/heic": "heic", "image/heif": "heif",
    "application/pdf": "pdf", "text/plain": "txt", "text/csv": "csv", "text/markdown": "md", "application/json": "json", "application/zip": "zip",
    "application/x-zip-compressed": "zip", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": "xlsx",
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document": "docx", "application/vnd.openxmlformats-officedocument.presentationml.presentation": "pptx",
    "application/vnd.ms-excel": "xls", "application/msword": "doc", "video/mp4": "mp4", "video/quicktime": "mov" };
  const EXT_TYPES = { txt: "text/plain", log: "text/plain", md: "text/markdown", csv: "text/csv", json: "application/json", zip: "application/zip",
    pdf: "application/pdf", xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", heic: "image/heic", mp4: "video/mp4", mov: "video/quicktime" };
  const app = document.getElementById("app");
  const ICONS = {
    clip: '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
    file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
    folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  };
  const icon = (n, size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const token = new URLSearchParams(location.hash.slice(1)).get("t") || "";
  const files = [];   // { file, type, url }

  if (!/^[A-Za-z0-9_-]{24,64}$/.test(token)) { app.innerHTML = `<h1>Link not valid</h1><p class="sub">Ask for a new request link.</p>`; return; }
  if (!window.supabase) { app.innerHTML = `<h1>Can't connect</h1><p class="sub">Check your internet connection and reload.</p>`; return; }
  const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });

  const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join("");
  function fileType(f) {
    if (TYPES[f.type]) return f.type;
    const ext = (String(f.name || "").split(".").pop() || "").toLowerCase();
    return EXT_TYPES[ext] || "";
  }

  // ชื่อผู้ส่งจำไว้ในเครื่องนี้ (localStorage ของเบราว์เซอร์คนส่ง) — ครั้งหน้าไม่ต้องพิมพ์ใหม่; ไม่ส่งขึ้น server เพิ่ม
  const NAME_KEY = "kodo-request-name";
  const savedName = () => { try { return localStorage.getItem(NAME_KEY) || ""; } catch { return ""; } };
  const rememberName = (n) => { try { n ? localStorage.setItem(NAME_KEY, n) : localStorage.removeItem(NAME_KEY); } catch { /* โหมดส่วนตัว/บล็อก storage: ข้าม */ } };

  function renderForm(project) {
    app.removeAttribute("aria-busy");
    app.innerHTML = `
      <span class="eyebrow">${icon("folder", 14)}<span>Request for <b>${esc(project)}</b></span></span>
      <h1>What should we fix or change?</h1>
      <p class="sub">Describe it in your own words — paste screenshots or attach files if it helps.<br>แจ้งสิ่งที่อยากให้แก้ วางรูปหรือแนบไฟล์ได้เลย</p>
      <div class="field">
        <label for="body">What needs to change?</label>
        <textarea id="body" maxlength="20000" placeholder="e.g. The Save button on the report page does nothing on my phone."></textarea>
      </div>
      <div class="field">
        <span class="lbl" id="attLbl">Attachments <span class="opt">optional</span></span>
        <button type="button" class="drop" id="drop" aria-describedby="attLbl attHint">
          <span class="ico-box">${icon("clip", 18)}</span>
          <span><span class="t">Add screenshots or files</span><span class="hint" id="attHint" style="display:block">Drop, paste (Ctrl/⌘+V) or choose · images, PDF, Office, zip, video · up to 10 files, 10 MB each</span></span>
        </button>
        <input type="file" id="picker" multiple hidden>
        <div class="files" id="files"></div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label for="who">Your name <span class="opt">optional · remembered on this device</span></label>
        <input type="text" id="who" maxlength="80" autocomplete="name" placeholder="e.g. Nok from Sales">
      </div>
      <button class="btn" id="send" disabled>${icon("send", 17)}<span id="sendLbl">Send request</span></button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>`;
    const body = document.getElementById("body"), drop = document.getElementById("drop"), picker = document.getElementById("picker");
    body.addEventListener("input", updateSend);
    drop.onclick = () => picker.click();
    picker.onchange = () => { addFiles(picker.files); picker.value = ""; };
    ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
    document.addEventListener("paste", (e) => {
      const pasted = [...(e.clipboardData?.files || [])];
      if (pasted.length) { e.preventDefault(); addFiles(pasted.map((f, i) => f.name && f.name !== "image.png" ? f : new File([f], `pasted-${Date.now()}-${i}.${(TYPES[f.type] || "png")}`, { type: f.type }))); }
    });
    document.getElementById("who").value = savedName().slice(0, 80);
    document.getElementById("send").onclick = send;
    updateSend();
  }
  /** ปุ่มส่งบอกว่าจะส่งอะไร และกดได้เมื่อมีข้อความหรือไฟล์แล้วเท่านั้น */
  function updateSend() {
    const btn = document.getElementById("send"), lbl = document.getElementById("sendLbl"), body = document.getElementById("body");
    if (!btn || !lbl || btn.classList.contains("busy")) return;
    const n = files.length;
    lbl.textContent = n ? `Send request · ${n} file${n === 1 ? "" : "s"}` : "Send request";
    btn.disabled = !(body && body.value.trim()) && !n;
  }

  function addFiles(list) {
    const msg = document.getElementById("msg");
    msg.className = "msg"; msg.textContent = "";
    for (const f of list) {
      if (files.length >= MAX_FILES) { msg.className = "msg err"; msg.textContent = `Up to ${MAX_FILES} files`; break; }
      const type = fileType(f);
      if (!type) { msg.className = "msg err"; msg.textContent = `"${f.name}" isn't a supported file type`; continue; }
      if (f.size > MAX_SIZE) { msg.className = "msg err"; msg.textContent = `"${f.name}" is larger than 10 MB`; continue; }
      files.push({ file: f, type, url: type.startsWith("image/") ? URL.createObjectURL(f) : "" });
    }
    renderFiles();
  }
  function renderFiles() {
    const box = document.getElementById("files");
    box.innerHTML = files.map((x, i) => `<div class="file">${x.url ? `<img src="${x.url}" alt="">` : `<div class="ico">${icon("file", 26)}</div>`}
      <div class="nm" title="${esc(x.file.name)}">${esc(x.file.name)}</div><button type="button" aria-label="Remove ${esc(x.file.name)}" data-i="${i}">${icon("x", 14)}</button></div>`).join("");
    updateSend();
    box.querySelectorAll("button").forEach(b => b.onclick = () => { const x = files.splice(Number(b.dataset.i), 1)[0]; if (x && x.url) URL.revokeObjectURL(x.url); renderFiles(); });
  }

  async function send() {
    const btn = document.getElementById("send"), msg = document.getElementById("msg");
    const body = document.getElementById("body").value;
    const author = document.getElementById("who").value.trim();
    if (!body.trim() && !files.length) { msg.className = "msg err"; msg.textContent = "Write something or attach a file"; return; }
    const setBusy = (on) => { btn.classList.toggle("busy", on); btn.disabled = on; btn.innerHTML = on ? `<span class="spin" aria-hidden="true"></span><span id="sendLbl">Sending…</span>` : `${icon("send", 17)}<span id="sendLbl">Send request</span>`; if (!on) updateSend(); };
    setBusy(true); msg.className = "msg"; msg.textContent = files.length ? "" : "Sending your request…";
    try {
      const attachments = [];
      for (let i = 0; i < files.length; i++) {
        const x = files[i];
        msg.innerHTML = `Uploading file ${i + 1} of ${files.length}…<div class="prog" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="${files.length}" aria-valuenow="${i}"><span style="width:${Math.round(i / files.length * 100)}%"></span></div>`;
        const path = `${token}/${rid()}.${TYPES[x.type]}`;
        const { error } = await sb.storage.from(BUCKET).upload(path, x.file, { contentType: x.type, upsert: false });
        if (error) throw new Error(`Couldn't upload "${x.file.name}": ${error.message}`);
        attachments.push({ path, name: String(x.file.name || "file").slice(0, 120), mime: x.type, size: x.file.size });
      }
      const { error } = await sb.rpc("submit_project_request", { t: token, author, body, attachments });
      if (error) throw new Error(error.message);
      rememberName(author);
      app.innerHTML = `<div class="done"><div class="badge">${icon("check", 28)}</div><h1>Request sent</h1><p class="sub" style="margin:0">Thank you! ส่งเรื่องเรียบร้อยแล้ว — we'll take it from here.</p>
        <button class="btn" id="again">Send another request</button></div>`;
      files.length = 0;
      document.getElementById("again").onclick = () => start();
    } catch (e) {
      msg.className = "msg err"; msg.textContent = e.message || "Couldn't send — try again";
      setBusy(false);
    }
  }

  async function start() {
    const { data, error } = await sb.rpc("request_link_info", { t: token });
    const row = Array.isArray(data) ? data[0] : null;
    app.removeAttribute("aria-busy");
    if (error || !row) { app.innerHTML = `<h1>Link not found</h1><p class="sub">This request link doesn't exist. Ask for a new one.</p>`; return; }
    if (!row.active) { app.innerHTML = `<h1>This link is closed</h1><p class="sub">Ask for a new request link.</p>`; return; }
    renderForm(row.project);
  }
  start();
})();
</script>
</body>
</html>
